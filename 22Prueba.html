<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>DojoPro · Gestión de Academia</title>
<style>
:root{
  --bg:#0b1220; --panel:#111a2e; --panel2:#16213a; --line:#22304d;
  --txt:#e6edf7; --mut:#8ea1c4; --acc:#f43f5e; --acc2:#22d3ee;
  --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:14px}
h1,h2,h3{margin:0}
.mut{color:var(--mut)}
.sm{font-size:12px}
.mt{margin-top:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1;min-width:160px}

/* layout */
.layout{display:flex;min-height:100vh}
.sidebar{width:245px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px;gap:14px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center}
.brand b{font-size:16px;display:block}
.brand small{display:block;font-size:11px;color:var(--mut);font-weight:400}
nav{display:flex;flex-direction:column;gap:3px;overflow:auto;flex:1;margin:0 -6px}
.nav-item{background:none;border:0;color:#a9bbd8;text-align:left;padding:9px 12px;border-radius:10px;cursor:pointer;display:flex;gap:9px;align-items:center;white-space:nowrap;font-size:14px}
.nav-item:hover{background:#1a2540;color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(244,63,94,.18),rgba(34,211,238,.06));color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
.side-foot{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.user-chip{display:flex;gap:9px;align-items:center;min-width:0}
.user-chip > div{min-width:0;overflow:hidden}
.user-chip b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:#0e1729;position:sticky;top:0;z-index:5}
.topbar h2{font-size:18px;display:flex;align-items:center;gap:9px}
.content{padding:20px 24px 70px;width:100%;max-width:1400px}

/* components */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;border:0;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;text-decoration:none;line-height:1.1}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:#1c2947;border:1px solid var(--line);color:#cfe0ff;font-weight:500}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.full{width:100%}
.btn.danger{background:#7f1d1d;border:1px solid #b91c1c}
input,select,textarea{background:#0e1729;border:1px solid var(--line);color:var(--txt);padding:9px 11px;border-radius:9px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc2)}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.stat{background:linear-gradient(160deg,#16213a,#101a2e);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat .k{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-size:25px;font-weight:700;margin-top:6px}
.stat .s{font-size:12px;color:var(--mut);margin-top:3px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);padding:10px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid #1b2743;vertical-align:middle}
tr:hover td{background:#152039}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-ok{background:rgba(34,197,94,.15);color:#4ade80}
.b-warn{background:rgba(245,158,11,.15);color:#fbbf24}
.b-bad{background:rgba(239,68,68,.15);color:#f87171}
.b-info{background:rgba(34,211,238,.13);color:#67e8f9}
.b-mut{background:#1e2b47;color:#9db0d0}
.avatar{border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.avatar.ini{background:linear-gradient(135deg,#f43f5e,#22d3ee);color:#fff;font-weight:700;letter-spacing:.5px}
table img.avatar{vertical-align:middle;margin-right:8px}
table .avatar.ini{vertical-align:middle;margin-right:8px}
.empty{padding:28px;text-align:center;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.sec-title{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:22px 0 10px;font-weight:700}

/* search wrapper */
.search-wrap{position:relative;flex:1;min-width:160px}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.search-wrap input{padding-left:34px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(4,8,18,.72);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow:auto;backdrop-filter:blur(3px)}
.modal.show{display:flex}
.modal-box{background:var(--panel2);border:1px solid var(--line);border-radius:16px;width:100%;max-width:620px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal.wide .modal-box{max-width:880px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head h3{font-size:17px}
.modal-head button{background:none;border:0;color:var(--mut);font-size:26px;cursor:pointer;line-height:1}
.photo-prev{width:88px;height:88px;border-radius:14px;object-fit:cover;border:1px solid var(--line);background:#0e1729;flex:none}

/* perfil */
.profile-head{display:flex;gap:16px;align-items:flex-start;padding:16px;background:linear-gradient(135deg,#182643,#0f1a30);border:1px solid var(--line);border-radius:16px}
.profile-head .info{flex:1;min-width:0}
.profile-head h3{font-size:20px;margin-bottom:4px}
.profile-head .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.profile-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.profile-card{background:#0e1729;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.profile-card .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:700;margin-bottom:8px}
.profile-card .line{display:flex;gap:8px;font-size:13px;line-height:1.7}
.profile-card .line b{color:var(--mut);font-weight:500;min-width:52px}

/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(900px 500px at 20% 0%,#1a2540,transparent),var(--bg)}
.login-card{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:28px;width:100%;max-width:370px;display:flex;flex-direction:column;gap:14px}
.hint{font-size:12px;color:var(--mut);text-align:center;line-height:1.7}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,80px);background:#1c2947;border:1px solid var(--line);padding:12px 20px;border-radius:12px;opacity:0;transition:.3s;z-index:200;font-weight:600;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.ok{border-color:#166534}.toast.bad{border-color:#991b1b}
@media(max-width:900px){
  .layout{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static}
  nav{flex-direction:row;overflow-x:auto}
  .grid2,.grid3,.profile-cards{grid-template-columns:1fr}
}
@media print{.sidebar,.topbar,.toolbar,.btn{display:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">

    <div id="modalBody"></div>
  </div>
</div>

function icon(name, size = 16) {
  const paths = ICONS[name] || '';
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex:none">${paths}</svg>`;

  if (!bd) return '—';
  const d = new Date(bd), t = new Date();
  let a = t.getFullYear() - d.getFullYear();
  const m = t.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < d.getDate())) a--;
  return a;

  if (!s) return '?';
  let full = '';

/* =========================================================
   1) DASHBOARD
   ========================================================= */
function viewDashboard() {
  const periodo = today().slice(0, 7);
  const activos = DB.students.filter(s => s.estado === 'activo');
  const retirados = DB.students.filter(s => s.estado === 'retirado');
  const pend = DB.payments.filter(p => p.estado === 'pendiente');
  const vencidas = pend.filter(p => p.fechaVencimiento < today());
  const deudores = new Set(vencidas.map(p => p.studentId));
  const deuda = pend.reduce((a, p) => a + p.monto, 0);
  const ing = DB.transactions.filter(t => t.tipo === 'ingreso' && t.fecha.slice(0, 7) === periodo).reduce((a, t) => a + t.monto, 0);
  const egr = DB.transactions.filter(t => t.tipo === 'egreso' && t.fecha.slice(0, 7) === periodo).reduce((a, t) => a + t.monto, 0);
  const ventas = DB.sales.filter(s => s.fecha.slice(0, 7) === periodo).reduce((a, s) => a + s.total, 0);
  const attHoy = DB.attendance.filter(a => a.fecha === today());
  let pres = 0, tot = 0;
  attHoy.forEach(a => Object.values(a.registros).forEach(x => { tot++; if (x === 'presente' || x === 'tarde') pres++; }));

  const proximos = pend.slice().sort((a, b) => a.fechaVencimiento.localeCompare(b.fechaVencimiento)).slice(0, 6);
  const movs = DB.transactions.slice().sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, 6);

  const fin = (can('finance') || can('sales')) ? `
    <div class="cards mt">
      <div class="stat"><div class="k">Ingresos del mes</div><div class="v" style="color:#4ade80">${money(ing)}</div><div class="s">${monthLabel(periodo)}</div></div>
      <div class="stat"><div class="k">Egresos del mes</div><div class="v" style="color:#f87171">${money(egr)}</div><div class="s">${monthLabel(periodo)}</div></div>
      <div class="stat"><div class="k">Balance</div><div class="v" style="color:${ing - egr >= 0 ? '#4ade80' : '#f87171'}">${money(ing - egr)}</div><div class="s">Ingresos − egresos</div></div>
      <div class="stat"><div class="k">Ventas del mes</div><div class="v">${money(ventas)}</div><div class="s">${DB.sales.filter(s => s.fecha.slice(0, 7) === periodo).length} transacciones</div></div>
    </div>` : '';

  return `
    <div class="cards">
      <div class="stat"><div class="k">Estudiantes activos</div><div class="v">${activos.length}</div><div class="s">${retirados.length} retirados</div></div>
      <div class="stat"><div class="k">Cobros pendientes</div><div class="v" style="color:#fbbf24">${pend.length}</div><div class="s">${money(deuda)} por cobrar</div></div>
      <div class="stat"><div class="k">Deudores vencidos</div><div class="v" style="color:#f87171">${deudores.size}</div><div class="s">${vencidas.length} cuotas vencidas</div></div>
      <div class="stat"><div class="k">Asistencia hoy</div><div class="v">${tot ? Math.round(pres / tot * 100) + '%' : '—'}</div><div class="s">${pres}/${tot} registros</div></div>
    </div>
    ${fin}
    <div class="grid2 mt" style="align-items:start">
      <div class="card">
        <div class="sec-title" style="margin-top:0">Próximos vencimientos</div>
        ${proximos.length ? `<table><thead><tr><th>Estudiante</th><th>Período</th><th>Vence</th><th>Monto</th></tr></thead><tbody>
        ${proximos.map(p => {
          const s = DB.students.find(x => x.id === p.studentId);
          const venc = p.fechaVencimiento < today();
          return `<tr><td>${h(s ? ((s.nombres || '') + ' ' + (s.apellidos || '')).trim() : '—')}</td><td class="mut">${p.periodo}</td>
          <td><span class="badge ${venc ? 'b-bad' : 'b-warn'}">${fmtDate(p.fechaVencimiento)}</span></td><td>${money(p.monto)}</td></tr>`;
        }).join('')}</tbody></table>` : '<p class="empty">Sin cobros pendientes.</p>'}
      </div>
      <div class="card">
        <div class="sec-title" style="margin-top:0">Últimos movimientos</div>
        ${movs.length ? `<table><thead><tr><th>Fecha</th><th>Concepto</th><th>Monto</th></tr></thead><tbody>
        ${movs.map(t => `<tr><td class="mut">${fmtDate(t.fecha)}</td><td>${h(t.descripcion)}<div class="mut sm">${h(t.categoria)}</div></td>
        <td style="color:${t.tipo === 'ingreso' ? '#4ade80' : '#f87171'};white-space:nowrap">${t.tipo === 'ingreso' ? '+' : '−'} ${money(t.monto)}</td></tr>`).join('')}
        </tbody></table>` : '<p class="empty">Sin movimientos</p>'}
      </div>
    </div>`;
}

function pickPhoto(input) {
  const file = input.files[0]; if (!file) return;
  const fr = new FileReader();
  fr.onload = e => {
    const img = new Image();
    img.onload = () => {
      const max = 220; let w = img.width, hh = img.height;
      const sc = Math.min(1, max / Math.max(w, hh));
      w = Math.round(w * sc); hh = Math.round(hh * sc);
      const c = document.createElement('canvas'); c.width = w; c.height = hh;
      c.getContext('2d').drawImage(img, 0, 0, w, hh);
      const data = c.toDataURL('image/jpeg', 0.72);
      $('#f_foto').value = data; $('#f_photoPrev').src = data;
    };
    img.src = e.target.result;
  };
  fr.readAsDataURL(file);
}

function saveStudent(id) {

  };
  if (!data.nombres || !data.apellidos) return toast('Nombres y apellidos son obligatorios', 'bad');

}

function viewPayments() {
  return `

      <input type="month" id="payMonth" value="${today().slice(0, 7)}" style="width:auto" onchange="renderPaymentsList()">
      <select id="payStatus" style="width:auto" onchange="renderPaymentsList()">

      </select>

function renderPaymentsList() {
  const per = $('#payMonth')?.value || today().slice(0, 7);

  let list = DB.payments.filter(p => p.periodo === per);
  if (st === 'pendiente') list = list.filter(p => p.estado === 'pendiente');
  if (st === 'pagado') list = list.filter(p => p.estado === 'pagado');
  if (st === 'vencido') list = list.filter(p => p.estado === 'pendiente' && p.fechaVencimiento < today());
  list.sort((a, b) => a.fechaVencimiento.localeCompare(b.fechaVencimiento));
  const el = $('#payList'); if (!el) return;
  const totalPag = DB.payments.filter(p => p.periodo === per && p.estado === 'pagado').reduce((a, p) => a + p.monto, 0);
  const totalPend = DB.payments.filter(p => p.periodo === per && p.estado === 'pendiente').reduce((a, p) => a + p.monto, 0);
  el.innerHTML = `
    <div class="cards" style="margin-bottom:16px">
      <div class="stat"><div class="k">Recaudado</div><div class="v" style="color:#4ade80">${money(totalPag)}</div><div class="s">${monthLabel(per)}</div></div>
      <div class="stat"><div class="k">Pendiente</div><div class="v" style="color:#fbbf24">${money(totalPend)}</div></div>
      <div class="stat"><div class="k">Registros</div><div class="v">${DB.payments.filter(p => p.periodo === per).length}</div></div>
    </div>
    <div class="card" style="padding:0;overflow:auto">
    ${list.length ? `<table><thead><tr><th>Estudiante</th><th>Concepto</th><th>Monto</th><th>Vence</th><th>Estado</th><th>Pago</th><th style="text-align:right">Acciones</th></tr></thead><tbody>
    ${list.map(p => {
    const s = DB.students.find(x => x.id === p.studentId);
    const venc = p.estado === 'pendiente' && p.fechaVencimiento < today();
    const nombre = s ? ((s.nombres || '') + ' ' + (s.apellidos || '')).trim() : '';
    return `<tr>
        <td>${s ? avatarHTML(s, 28) + h(nombre) : '<span class="mut">Eliminado</span>'}</td>
        <td class="mut">${h(p.concepto)}</td>
        <td><b>${money(p.monto)}</b></td>
        <td>${fmtDate(p.fechaVencimiento)}</td>
        <td><span class="badge ${p.estado === 'pagado' ? 'b-ok' : (venc ? 'b-bad' : 'b-warn')}">${venc ? 'vencido' : p.estado}</span></td>
        <td class="mut">${p.fechaPago ? fmtDate(p.fechaPago) + ' · ' + h(p.metodo) : '—'}</td>
        <td style="text-align:right;white-space:nowrap">

          <button class="btn danger sm" onclick="delPayment('${p.id}')">${icon('x', 14)}</button>
        </td></tr>`;
  }).join('')}</tbody></table>` : '<p class="empty">No hay registros para este período. Usa «Generar mensualidades».</p>'}
    </div>`;
}

function generateMonthly() {
  const per = $('#payMonth')?.value || today().slice(0, 7);
  const activos = DB.students.filter(s => s.estado === 'activo');
  let creados = 0;
  activos.forEach(s => {
    if (DB.payments.some(p => p.studentId === s.id && p.periodo === per)) return;
    const g = DB.groups.find(x => x.id === s.grupoId);
    DB.payments.push({
      id: uid('p'), studentId: s.id, concepto: 'Mensualidad', periodo: per,
      monto: g ? g.mensualidad : 60000, estado: 'pendiente',
      fechaVencimiento: per + '-10', fechaPago: '', metodo: '',
      recibo: 'REC-' + String(DB.payments.length + 1 + creados).padStart(4, '0')
    });
    creados++;
  });
  persist(); renderPaymentsList(); render();
  toast(creados ? `${creados} mensualidades generadas` : 'Todos los estudiantes ya tenían su mensualidad');
}

    <div class="row end mt"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="savePaymentCreate()">Registrar pago</button></div>`);

function savePaymentCreate() {
  const sid = v('pc_stu'); if (!sid) return toast('Selecciona un estudiante', 'bad');
  const per = v('pc_periodo');
  const p = {
    id: uid('p'), studentId: sid, concepto: v('pc_concepto'), periodo: per,
    monto: +v('pc_monto') || 0, estado: 'pagado', fechaVencimiento: per + '-10',
    fechaPago: v('pc_fecha') || today(), metodo: v('pc_metodo'),
    recibo: 'REC-' + String(DB.payments.length + 1).padStart(4, '0')
  };
  DB.payments.push(p);
  syncPaymentTx(p);

}

function openPayRegister(id) {
  const p = DB.payments.find(x => x.id === id); if (!p) return;
  const s = DB.students.find(x => x.id === p.studentId);
  openModal('Registrar pago', `
    <div class="card" style="margin-bottom:14px">
      <b>${h(s ? ((s.nombres || '') + ' ' + (s.apellidos || '')).trim() : '')}</b>
      <div class="mut sm">${h(p.concepto)} · Período ${p.periodo}</div>
    </div>
    <div class="grid2">
      <label>Monto a cobrar<input type="number" id="pr_monto" value="${p.monto}"></label>
      <label>Fecha de pago<input type="date" id="pr_fecha" value="${today()}"></label>
      <label>Método<select id="pr_metodo">${opts(['Efectivo', 'Transferencia', 'Tarjeta', 'Nequi', 'Daviplata'], 'Efectivo')}</select></label>
    </div>
    <div class="row end mt"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="confirmPay('${id}')">Confirmar pago</button></div>`);
}
function confirmPay(id) {
  const p = DB.payments.find(x => x.id === id); if (!p) return;
  p.monto = +v('pr_monto') || p.monto;
  p.fechaPago = v('pr_fecha') || today();
  p.metodo = v('pr_metodo');
  p.estado = 'pagado';
  syncPaymentTx(p);
  persist(); closeModal(); render(); toast('Pago registrado correctamente');
  setTimeout(() => showReceipt(id), 200);
}
function syncPaymentTx(p) {
  DB.transactions = DB.transactions.filter(t => t.refId !== p.id);
  if (p.estado === 'pagado') {
    const s = DB.students.find(x => x.id === p.studentId);
    DB.transactions.push({
      id: uid('t'), fecha: p.fechaPago, tipo: 'ingreso', categoria: p.concepto,
      descripcion: `${p.concepto} ${p.periodo} — ${s ? ((s.nombres || '') + ' ' + (s.apellidos || '')).trim() : ''}`,
      monto: p.monto, metodo: p.metodo, refId: p.id
    });
  }
}
function delPayment(id) {
  if (!confirm('¿Eliminar este registro de pago?')) return;
  DB.payments = DB.payments.filter(p => p.id !== id);
  DB.transactions = DB.transactions.filter(t => t.refId !== id);
  persist(); render(); toast('Registro eliminado');
}
function showReceipt(id) {
  const p = DB.payments.find(x => x.id === id); if (!p) return;
  const s = DB.students.find(x => x.id === p.studentId);
  const body = `
    <div style="text-align:center"><h3 style="margin:0">ACADEMIA DOJOPRO</h3><div>Recibo de pago</div></div><hr>
    <div>Recibo N°: <b>${p.recibo}</b></div>
    <div>Fecha: ${fmtDate(p.fechaPago || today())}</div>
    <div>Estudiante: ${h(s ? ((s.nombres || '') + ' ' + (s.apellidos || '')).trim() : '—')}</div>
    <div>Código: ${h(s ? s.codigo : '—')}</div>
    <div>Concepto: ${h(p.concepto)} (${p.periodo})</div>
    <div>Método: ${h(p.metodo || '—')}</div><hr>
    <div style="font-size:18px"><b>TOTAL: ${money(p.monto)}</b></div><hr>
    <div style="text-align:center;font-size:11px">Gracias por su pago · DojoPro</div>`;
  openModal('Recibo ' + p.recibo, `
    <div class="card" style="font-family:ui-monospace,monospace;font-size:13px;line-height:1.8">${body}</div>
    <div class="row end mt"><button class="btn ghost" onclick="closeModal()">Cerrar</button><button class="btn" onclick='printHTML(${JSON.stringify(body)})'>${icon('printer')} Imprimir</button></div>`);
}

function viewAttendance() {
  const gs = DB.groups.map(g => `<option value="${g.id}">${h(g.nombre)}</option>`).join('');
  return `
    <div class="toolbar">
      <select id="attGroup" style="width:auto" onchange="renderAttSheet()">${gs || '<option value="">Sin grupos</option>'}</select>
      <input type="date" id="attDate" style="width:auto" value="${today()}" onchange="renderAttSheet()">
      <button class="btn ghost" onclick="markAll('presente')">Marcar todos presentes</button>
      <button class="btn" onclick="saveAttendance()">${icon('save')} Guardar asistencia</button>
    </div>
    <div id="attSheet"></div>`;
}

function renderAttSheet() {
  const gid = $('#attGroup')?.value, f = $('#attDate')?.value;
  const el = $('#attSheet'); if (!el) return;
  if (!gid) { el.innerHTML = '<div class="card"><p class="empty">Crea primero un grupo en «Horarios y grupos».</p></div>'; return; }
  const g = DB.groups.find(x => x.id === gid);
  const students = DB.students.filter(s => s.grupoId === gid && s.estado === 'activo');
  const rec = DB.attendance.find(a => a.grupoId === gid && a.fecha === f);
  const reg = rec ? rec.registros : {};
  const st = ['presente', 'tarde', 'ausente', 'excusa'];

  if (!students.length) {
    el.innerHTML = `<div class="card"><p class="empty">El grupo <b>${h(g.nombre)}</b> no tiene estudiantes activos.</p></div>`;
    return;
  }
  el.innerHTML = `
    <div class="card" style="padding:0;overflow:auto">
      <table><thead><tr><th>Estudiante</th><th>Cinturón</th><th>Estado de asistencia</th></tr></thead><tbody>
      ${students.map(s => `<tr>
        <td>${avatarHTML(s, 30)}<b>${h(((s.nombres || '') + ' ' + (s.apellidos || '')).trim())}</b><div class="mut sm">${h(s.codigo)}</div></td>
        <td><span class="badge b-mut">${h(s.cinturon)}</span></td>
        <td><select class="attSel" data-stu="${s.id}" style="max-width:200px" onchange="updateAttStats()">
          ${st.map(x => `<option value="${x}" ${(reg[s.id] || 'presente') === x ? 'selected' : ''}>${x}</option>`).join('')}
        </select></td></tr>`).join('')}
      </tbody></table>
    </div>
    <div class="cards mt" id="attStats"></div>
    <p class="mut sm mt" style="display:flex;align-items:center;gap:6px">
      ${rec
        ? `${icon('check', 14)} Este día ya tiene asistencia guardada; puedes actualizarla.`
        : `${icon('info', 14)} Aún no hay registro guardado para este día.`}
    </p>`;
  updateAttStats();
}

function updateAttStats() {
  const sels = document.querySelectorAll('.attSel');
  const c = { presente: 0, tarde: 0, ausente: 0, excusa: 0 };
  sels.forEach(s => c[s.value]++);
  const tot = sels.length || 1;
  const el = $('#attStats'); if (!el) return;
  el.innerHTML = `
    <div class="stat"><div class="k">Presentes</div><div class="v" style="color:#4ade80">${c.presente + c.tarde}</div><div class="s">${Math.round((c.presente + c.tarde) / tot * 100)}% del grupo</div></div>
    <div class="stat"><div class="k">Ausentes</div><div class="v" style="color:#f87171">${c.ausente}</div></div>
    <div class="stat"><div class="k">Tarde</div><div class="v" style="color:#fbbf24">${c.tarde}</div></div>
    <div class="stat"><div class="k">Con excusa</div><div class="v" style="color:#67e8f9">${c.excusa}</div></div>`;
}
function markAll(val) { document.querySelectorAll('.attSel').forEach(s => s.value = val); updateAttStats(); }

function saveAttendance() {
  const gid = $('#attGroup')?.value, f = $('#attDate')?.value;
  if (!gid || !f) return toast('Selecciona grupo y fecha', 'bad');
  const registros = {};
  document.querySelectorAll('.attSel').forEach(s => registros[s.dataset.stu] = s.value);
  if (!Object.keys(registros).length) return toast('No hay estudiantes en el grupo', 'bad');
  let rec = DB.attendance.find(a => a.grupoId === gid && a.fecha === f);
  if (rec) rec.registros = registros;
  else DB.attendance.push({ id: uid('att'), fecha: f, grupoId: gid, registros });
  persist(); renderAttSheet(); toast('Asistencia guardada');
}

          <td><span class="badge" style="background:${bc}22;color:${bc};border-left:4px solid ${bc}">${h(s.cinturon || 'Blanco')}</span></td>

      ${proms.map(p => {

        return `<tr><td>${fmtDate(p.fecha)}</td>
        <td>${h(s ? ((s.nombres || '') + ' ' + (s.apellidos || '')).trim() : '—')}</td>

        <td>${p.grado}º</td>
        <td><span class="badge ${p.resultado === 'Aprobado' ? 'b-ok' : 'b-bad'}">${h(p.resultado)}</span></td>

function openPromotion(studentId) {
  const list = DB.students.filter(s => s.estado === 'activo');
  const sel = studentId || (list[0] && list[0].id);
  const s = DB.students.find(x => x.id === sel) || {};
  openModal('Registrar examen / ascenso', `
    <div class="grid2">
      <label>Deportista<select id="pr_stu" onchange="refreshPromBelt()">${list.map(x => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${h(((x.nombres || '') + ' ' + (x.apellidos || '')).trim())}</option>`).join('')}</select></label>
      <label>Fecha del examen<input type="date" id="pr_fecha" value="${today()}"></label>
      <label>Cinturón actual<input id="pr_actual" value="${h(s.cinturon || 'Blanco')}" disabled></label>
      <label>Nuevo cinturón<select id="pr_nuevo">${opts(BELTS, s.cinturon)}</select></label>
      <label>Grado obtenido<input type="number" id="pr_grado" min="0" max="9" value="${(s.grado || 0) + 1}"></label>
      <label>Resultado<select id="pr_resultado">${opts(['Aprobado', 'Reprobado'], 'Aprobado')}</select></label>
    </div>
    <label class="mt">Observaciones<input id="pr_nota" placeholder="Ej. Excelente técnica de combate"></label>
    <div class="row end mt"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="savePromotion()">Guardar</button></div>`);
  refreshPromBelt();
}
function refreshPromBelt() {
  const s = DB.students.find(x => x.id === $('#pr_stu')?.value);
  if (s && $('#pr_actual')) { $('#pr_actual').value = s.cinturon; $('#pr_nuevo').value = s.cinturon; $('#pr_grado').value = (s.grado || 0) + 1; }
}
function savePromotion() {
  const sid = v('pr_stu'); const s = DB.students.find(x => x.id === sid);
  if (!s) return toast('Selecciona un deportista', 'bad');
  const nuevo = v('pr_nuevo'), resultado = v('pr_resultado'), grado = +v('pr_grado') || 0;
  DB.promotions.push({
    id: uid('pr'), studentId: sid, fecha: v('pr_fecha') || today(),
    cinturonAnterior: s.cinturon, cinturonNuevo: nuevo, grado,
    examen: 'Examen de ascenso', resultado, nota: v('pr_nota')
  });
  if (resultado === 'Aprobado') { s.cinturon = nuevo; s.grado = grado; }
  persist(); closeModal(); render(); toast(resultado === 'Aprobado' ? 'Ascenso registrado correctamente' : 'Examen registrado');
}

/* =========================================================
   6) INVENTARIO
   ========================================================= */
function viewInventory() {
  const items = DB.inventory;
  const bajo = items.filter(i => i.stock <= i.stockMin);
  const valor = items.reduce((a, i) => a + i.stock * i.costo, 0);
  return `
    <div class="cards">
      <div class="stat"><div class="k">Ítems registrados</div><div class="v">${items.length}</div></div>
      <div class="stat"><div class="k">Unidades en stock</div><div class="v">${items.reduce((a, i) => a + i.stock, 0)}</div></div>
      <div class="stat"><div class="k">Valor del inventario</div><div class="v">${money(valor)}</div><div class="s">a costo</div></div>
      <div class="stat"><div class="k">Stock bajo</div><div class="v" style="color:${bajo.length ? '#f87171' : '#4ade80'}">${bajo.length}</div><div class="s">requieren reposición</div></div>
    </div>
    <div class="toolbar mt"><button class="btn" onclick="openItem()">${icon('plus')} Nuevo producto</button></div>
    <div class="card" style="padding:0;overflow:auto">
      <table><thead><tr><th>Producto</th><th>Categoría</th><th>Talla</th><th>Stock</th><th>Costo</th><th>Precio</th><th>Margen</th><th style="text-align:right">Acciones</th></tr></thead><tbody>
      ${items.length ? items.map(i => `<tr>
        <td><b>${h(i.nombre)}</b></td>
        <td class="mut">${h(i.categoria)}</td>
        <td class="mut">${h(i.talla || '—')}</td>
        <td><span class="badge ${i.stock <= i.stockMin ? 'b-bad' : 'b-ok'}">${i.stock} u.</span> <span class="mut sm">mín ${i.stockMin}</span></td>
        <td>${money(i.costo)}</td>
        <td><b>${money(i.precio)}</b></td>
        <td class="mut">${money(i.precio - i.costo)}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn ghost sm" onclick="adjustStock('${i.id}')">±Stock</button>
          <button class="btn ghost sm" onclick="openItem('${i.id}')">Editar</button>
          <button class="btn danger sm" onclick="delItem('${i.id}')">${icon('x', 14)}</button>
        </td></tr>`).join('') : '<tr><td colspan="8"><p class="empty">Sin productos registrados</p></td></tr>'}
      </tbody></table>
    </div>`;
}

function openItem(id) {
  const it = id ? DB.inventory.find(x => x.id === id) : { categoria: 'Uniforme', stock: 0, stockMin: 3, costo: 0, precio: 0 };
  openModal(id ? 'Editar producto' : 'Nuevo producto', `
    <div class="grid2">
      <label>Nombre<input id="it_nombre" value="${h(it.nombre || '')}"></label>
      <label>Categoría<select id="it_cat">${opts(['Uniforme', 'Cinturón', 'Protector', 'Material deportivo', 'Otros'], it.categoria)}</select></label>
      <label>Talla<input id="it_talla" value="${h(it.talla || '')}"></label>
      <label>Stock actual<input type="number" id="it_stock" min="0" value="${it.stock}"></label>
      <label>Stock mínimo<input type="number" id="it_min" min="0" value="${it.stockMin}"></label>
      <label>Costo unitario<input type="number" id="it_costo" min="0" value="${it.costo}"></label>
      <label>Precio de venta<input type="number" id="it_precio" min="0" value="${it.precio}"></label>
    </div>
    <div class="row end mt"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveItem('${id || ''}')">Guardar</button></div>`);
}
function saveItem(id) {
  const data = {
    nombre: v('it_nombre'), categoria: v('it_cat'), talla: v('it_talla'),
    stock: +v('it_stock') || 0, stockMin: +v('it_min') || 0,
    costo: +v('it_costo') || 0, precio: +v('it_precio') || 0
  };
  if (!data.nombre) return toast('El nombre es obligatorio', 'bad');
  if (id) Object.assign(DB.inventory.find(x => x.id === id), data);
  else DB.inventory.push({ id: uid('i'), ...data });
  persist(); closeModal(); render(); toast('Producto guardado');
}
function adjustStock(id) {
  const it = DB.inventory.find(x => x.id === id); if (!it) return;
  const n = prompt(`Ajustar stock de "${it.nombre}".\nStock actual: ${it.stock}\nIngresa el nuevo stock:`, it.stock);
  if (n === null) return;
  const val = parseInt(n, 10); if (isNaN(val) || val < 0) return toast('Valor inválido', 'bad');
  it.stock = val; persist(); render(); toast('Stock actualizado');
}
function delItem(id) {
  if (!confirm('¿Eliminar este producto del inventario?')) return;
  DB.inventory = DB.inventory.filter(x => x.id !== id); persist(); render(); toast('Producto eliminado');
}

/* =========================================================
   7) VENTAS
   ========================================================= */
let saleDraft = [];
function viewSales() {
  const cur = today().slice(0, 7);
  const mes = DB.sales.filter(s => s.fecha.slice(0, 7) === cur);
  const total = mes.reduce((a, s) => a + s.total, 0);
  const ventas = DB.sales.slice().sort((a, b) => b.fecha.localeCompare(a.fecha));
  return `
    <div class="cards">
      <div class="stat"><div class="k">Ventas del mes</div><div class="v" style="color:#4ade80">${money(total)}</div></div>
      <div class="stat"><div class="k">Transacciones del mes</div><div class="v">${mes.length}</div></div>
      <div class="stat"><div class="k">Ticket promedio</div><div class="v">${money(mes.length ? total / mes.length : 0)}</div></div>
      <div class="stat"><div class="k">Ventas totales</div><div class="v">${DB.sales.length}</div></div>
    </div>
    <div class="toolbar mt"><button class="btn" onclick="openSale()">${icon('plus')} Nueva venta</button></div>
    <div class="card" style="padding:0;overflow:auto">
    ${ventas.length ? `<table><thead><tr><th>Fecha</th><th>Cliente</th><th>Productos</th><th>Método</th><th>Total</th><th style="text-align:right">Acciones</th></tr></thead><tbody>
      ${ventas.map(s => `<tr>
        <td>${fmtDate(s.fecha)}</td>
        <td>${h(s.clienteNombre || 'Público general')}</td>
        <td class="mut sm">${s.items.map(i => `${i.cantidad}× ${h(i.desc)}`).join('<br>')}</td>
        <td>${h(s.metodo)}</td>
        <td><b>${money(s.total)}</b></td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn ghost sm" onclick="showSaleReceipt('${s.id}')">Recibo</button>
          <button class="btn danger sm" onclick="delSale('${s.id}')">${icon('x', 14)}</button>
        </td></tr>`).join('')}</tbody></table>` : '<p class="empty">Sin ventas registradas</p>'}
    </div>`;
}

function openSale() {
  saleDraft = [];
  const prods = DB.inventory.filter(i => i.stock > 0)
    .map(i => `<option value="${i.id}">${h(i.nombre)}${i.talla ? ' (' + h(i.talla) + ')' : ''} — ${money(i.precio)} · stock ${i.stock}</option>`).join('');
  const stu = DB.students.filter(s => s.estado === 'activo').map(s => `<option value="${s.id}">${h(((s.nombres || '') + ' ' + (s.apellidos || '')).trim())}</option>`).join('');
  openModal('Nueva venta', `
    <div class="grid2">
      <label>Cliente / Estudiante<select id="saleClient"><option value="">— Público general —</option>${stu}</select></label>
      <label>Método de pago<select id="saleMethod">${opts(['Efectivo', 'Transferencia', 'Tarjeta', 'Nequi', 'Daviplata'], 'Efectivo')}</select></label>
    </div>
    <div class="card mt">
      <div class="sec-title" style="margin-top:0">Agregar producto del inventario</div>
      <div class="row">
        <select id="saleProd" class="grow">${prods || '<option value="">Sin productos con stock</option>'}</select>
        <input id="saleQty" type="number" min="1" value="1" style="width:85px">
        <button class="btn" onclick="addSaleItem()">Agregar</button>
      </div>
      <div class="sec-title">Artículo libre (no inventariado)</div>
      <div class="row">
        <input id="freeDesc" class="grow" placeholder="Ej. Agua, examen, otro">
        <input id="freePrice" type="number" min="0" placeholder="Precio" style="width:110px">
        <button class="btn ghost" onclick="addFreeItem()">Agregar</button>
      </div>
    </div>
    <div id="saleDraft" class="mt"></div>
    <div class="row end mt"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="confirmSale()">Registrar venta</button></div>`, true);
  renderSaleDraft();
}
function addSaleItem() {
  const id = v('saleProd'); if (!id) return toast('Selecciona un producto', 'bad');
  const it = DB.inventory.find(x => x.id === id); if (!it) return;
  const qty = Math.max(1, +v('saleQty') || 1);
  const enCarrito = saleDraft.filter(d => d.invId === id).reduce((a, d) => a + d.cantidad, 0);
  if (enCarrito + qty > it.stock) return toast(`Stock insuficiente (disponible: ${it.stock - enCarrito})`, 'bad');
  saleDraft.push({ invId: id, desc: `${it.nombre}${it.talla ? ' (' + it.talla + ')' : ''}`, cantidad: qty, precio: it.precio });
  renderSaleDraft();
}
function addFreeItem() {
  const desc = v('freeDesc'), price = +v('freePrice') || 0;
  if (!desc) return toast('Escribe una descripción', 'bad');
  saleDraft.push({ invId: '', desc, cantidad: 1, precio: price });
  $('#freeDesc').value = ''; $('#freePrice').value = '';
  renderSaleDraft();
}
function removeSaleItem(i) { saleDraft.splice(i, 1); renderSaleDraft(); }
function renderSaleDraft() {
  const el = $('#saleDraft'); if (!el) return;
  const total = saleDraft.reduce((a, d) => a + d.precio * d.cantidad, 0);
  el.innerHTML = saleDraft.length ? `<div class="card" style="padding:0;overflow:auto">
    <table><thead><tr><th>Descripción</th><th>Cant.</th><th>Precio</th><th>Subtotal</th><th></th></tr></thead><tbody>
    ${saleDraft.map((d, i) => `<tr><td>${h(d.desc)}</td><td>${d.cantidad}</td><td>${money(d.precio)}</td><td><b>${money(d.precio * d.cantidad)}</b></td>
    <td style="text-align:right"><button class="btn danger sm" onclick="removeSaleItem(${i})">${icon('x', 14)}</button></td></tr>`).join('')}
    <tr><td colspan="3" style="text-align:right"><b>TOTAL</b></td><td colspan="2"><b style="font-size:17px;color:#4ade80">${money(total)}</b></td></tr>
    </tbody></table></div>` : '<p class="mut sm">Aún no has agregado productos a la venta.</p>';
}
function confirmSale() {
  if (!saleDraft.length) return toast('Agrega al menos un producto', 'bad');
  const cid = v('saleClient');
  const s = DB.students.find(x => x.id === cid);
  const total = saleDraft.reduce((a, d) => a + d.precio * d.cantidad, 0);
  saleDraft.forEach(d => {
    if (d.invId) { const it = DB.inventory.find(i => i.id === d.invId); if (it) it.stock -= d.cantidad; }
  });
  const sale = {
    id: uid('sa'), fecha: today(), clienteId: cid,
    clienteNombre: s ? ((s.nombres || '') + ' ' + (s.apellidos || '')).trim() : 'Público general',
    metodo: v('saleMethod'), total, items: saleDraft.slice()
  };
  DB.sales.push(sale);
  DB.transactions.push({
    id: uid('t'), fecha: sale.fecha, tipo: 'ingreso', categoria: 'Venta',
    descripcion: 'Venta a ' + sale.clienteNombre, monto: total, metodo: sale.metodo, refId: sale.id
  });
  saleDraft = []; persist(); closeModal(); render(); toast('Venta registrada');
}
function delSale(id) {
  if (!confirm('¿Eliminar esta venta? Se devolverá el stock y se borrará el ingreso asociado.')) return;
  const s = DB.sales.find(x => x.id === id); if (!s) return;
  s.items.forEach(it => { if (it.invId) { const p = DB.inventory.find(i => i.id === it.invId); if (p) p.stock += it.cantidad; } });
  DB.sales = DB.sales.filter(x => x.id !== id);
  DB.transactions = DB.transactions.filter(t => t.refId !== id);
  persist(); render(); toast('Venta eliminada y stock restaurado');
}
function showSaleReceipt(id) {
  const s = DB.sales.find(x => x.id === id); if (!s) return;
  const body = `
    <div style="text-align:center"><h3 style="margin:0">ACADEMIA DOJOPRO</h3><div>Comprobante de venta</div></div><hr>
    <div>Fecha: ${fmtDate(s.fecha)}</div>
    <div>Cliente: ${h(s.clienteNombre)}</div>
    <div>Método: ${h(s.metodo)}</div><hr>
    ${s.items.map(i => `<div>${i.cantidad} × ${h(i.desc)} ....... ${money(i.precio * i.cantidad)}</div>`).join('')}
    <hr><div style="font-size:18px"><b>TOTAL: ${money(s.total)}</b></div><hr>
    <div style="text-align:center;font-size:11px">¡Gracias por tu compra!</div>`;
  openModal('Comprobante de venta', `
    <div class="card" style="font-family:ui-monospace,monospace;font-size:13px;line-height:1.8">${body}</div>
    <div class="row end mt"><button class="btn ghost" onclick="closeModal()">Cerrar</button><button class="btn" onclick='printHTML(${JSON.stringify(body)})'>${icon('printer')} Imprimir</button></div>`);
}

   8) INGRESOS Y EGRESOS
   ========================================================= */
function viewFinance() {
  const cur = today().slice(0, 7);
  const ing = DB.transactions.filter(t => t.tipo === 'ingreso' && t.fecha.slice(0, 7) === cur).reduce((a, t) => a + t.monto, 0);
  const egr = DB.transactions.filter(t => t.tipo === 'egreso' && t.fecha.slice(0, 7) === cur).reduce((a, t) => a + t.monto, 0);
  return `
    <div class="cards">
      <div class="stat"><div class="k">Ingresos del mes</div><div class="v" style="color:#4ade80">${money(ing)}</div><div class="s">${monthLabel(cur)}</div></div>
      <div class="stat"><div class="k">Egresos del mes</div><div class="v" style="color:#f87171">${money(egr)}</div><div class="s">${monthLabel(cur)}</div></div>
      <div class="stat"><div class="k">Ganancia neta</div><div class="v" style="color:${ing - egr >= 0 ? '#4ade80' : '#f87171'}">${money(ing - egr)}</div></div>
      <div class="stat"><div class="k">Movimientos</div><div class="v">${DB.transactions.length}</div></div>
    </div>
    <div class="toolbar mt">
      <input type="month" id="finMonth" style="width:auto" onchange="renderFinList()">
      <select id="finType" style="width:auto" onchange="renderFinList()">

      </select>
      <button class="btn ghost" onclick="openTx('ingreso')">${icon('plus')} Ingreso</button>
      <button class="btn" onclick="openTx('egreso')">${icon('plus')} Egreso</button>
    </div>
    <div id="finList"></div>`;
}
function renderFinList() {
  const per = $('#finMonth')?.value || '';
  const tipo = $('#finType')?.value || '';
  let list = DB.transactions.filter(t => (!per || t.fecha.slice(0, 7) === per) && (!tipo || t.tipo === tipo));
  list.sort((a, b) => b.fecha.localeCompare(a.fecha));
  const ing = list.filter(t => t.tipo === 'ingreso').reduce((a, t) => a + t.monto, 0);
  const egr = list.filter(t => t.tipo === 'egreso').reduce((a, t) => a + t.monto, 0);
  const el = $('#finList'); if (!el) return;
  el.innerHTML = `
    <div class="cards" style="margin-bottom:14px">
      <div class="stat"><div class="k">Total ingresos</div><div class="v" style="color:#4ade80">${money(ing)}</div></div>
      <div class="stat"><div class="k">Total egresos</div><div class="v" style="color:#f87171">${money(egr)}</div></div>
      <div class="stat"><div class="k">Balance</div><div class="v">${money(ing - egr)}</div></div>
    </div>
    <div class="card" style="padding:0;overflow:auto">
    ${list.length ? `<table><thead><tr><th>Fecha</th><th>Tipo</th><th>Categoría</th><th>Descripción</th><th>Método</th><th>Monto</th><th></th></tr></thead><tbody>
      ${list.map(t => `<tr>
        <td>${fmtDate(t.fecha)}</td>
        <td><span class="badge ${t.tipo === 'ingreso' ? 'b-ok' : 'b-bad'}">${t.tipo}</span></td>
        <td class="mut">${h(t.categoria)}</td>
        <td>${h(t.descripcion)}</td>
        <td class="mut">${h(t.metodo || '—')}</td>
        <td style="color:${t.tipo === 'ingreso' ? '#4ade80' : '#f87171'};font-weight:700;white-space:nowrap">${t.tipo === 'ingreso' ? '+' : '−'} ${money(t.monto)}</td>
        <td style="text-align:right">${t.refId ? '' : `<button class="btn danger sm" onclick="delTx('${t.id}')">${icon('x', 14)}</button>`}</td>
      </tr>`).join('')}</tbody></table>` : '<p class="empty">Sin movimientos para el filtro seleccionado</p>'}
    </div>`;
}
function openTx(tipo) {
  openModal(tipo === 'ingreso' ? 'Registrar ingreso' : 'Registrar egreso', `
    <div class="grid2">
      <label>Fecha<input type="date" id="tx_fecha" value="${today()}"></label>
      <label>Monto<input type="number" id="tx_monto" min="0" value="0"></label>
      <label>Categoría<select id="tx_cat">${opts(tipo === 'ingreso'
    ? ['Mensualidad', 'Inscripción', 'Examen', 'Venta', 'Patrocinio', 'Otro']
    : ['Arriendo', 'Servicios', 'Insumos', 'Nómina', 'Mantenimiento', 'Publicidad', 'Otro'], 'Otro')}</select></label>
      <label>Método<select id="tx_metodo">${opts(['Efectivo', 'Transferencia', 'Tarjeta', 'Nequi', 'Daviplata'], 'Efectivo')}</select></label>
    </div>
    <label class="mt">Descripción<input id="tx_desc" placeholder="Detalle del movimiento"></label>
    <div class="row end mt"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveTx('${tipo}')">Guardar</button></div>`);
}
function saveTx(tipo) {
  const monto = +v('tx_monto') || 0;
  if (monto <= 0) return toast('El monto debe ser mayor a cero', 'bad');
  DB.transactions.push({
    id: uid('t'), fecha: v('tx_fecha') || today(), tipo, categoria: v('tx_cat'),
    descripcion: v('tx_desc') || v('tx_cat'), monto, metodo: v('tx_metodo'), refId: ''
  });
  persist(); closeModal(); render(); toast('Movimiento registrado');
}
function delTx(id) {
  if (!confirm('¿Eliminar este movimiento?')) return;
  DB.transactions = DB.transactions.filter(t => t.id !== id); persist(); render(); toast('Movimiento eliminado');
}

/* =========================================================
   9) REPORTES
   ========================================================= */
function viewReports() {
  const cur = today().slice(0, 7);
  const activos = DB.students.filter(s => s.estado === 'activo');
  const retirados = DB.students.filter(s => s.estado === 'retirado');
  const nuevos = DB.students.filter(s => (s.fechaInscripcion || '').slice(0, 7) === cur);
  const pend = DB.payments.filter(p => p.estado === 'pendiente');
  const vencidas = pend.filter(p => p.fechaVencimiento < today());
  const deudoresMap = {};
  vencidas.forEach(p => { deudoresMap[p.studentId] = (deudoresMap[p.studentId] || 0) + p.monto; });
  const deudores = Object.entries(deudoresMap).map(([id, monto]) => ({ s: DB.students.find(x => x.id === id), monto })).filter(x => x.s);

  const lim = new Date(); lim.setDate(lim.getDate() - 30); const limStr = lim.toISOString().slice(0, 10);
  const att = DB.attendance.filter(a => a.fecha >= limStr);
  const porGrupo = DB.groups.map(g => {
    const recs = att.filter(a => a.grupoId === g.id);
    let p = 0, t = 0;
    recs.forEach(r => Object.values(r.registros).forEach(x => { t++; if (x === 'presente' || x === 'tarde') p++; }));
    return { g, p, t, pct: t ? Math.round(p / t * 100) : 0 };
  });

  const prodMap = {};
  DB.sales.forEach(s => s.items.forEach(i => {
    const k = i.desc; if (!prodMap[k]) prodMap[k] = { cant: 0, total: 0 };
    prodMap[k].cant += i.cantidad; prodMap[k].total += i.cantidad * i.precio;
  }));
  const topProds = Object.entries(prodMap).sort((a, b) => b[1].total - a[1].total).slice(0, 8);

  const meses = [];
  for (let i = 5; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); meses.push(d.toISOString().slice(0, 7)); }
  const finMes = meses.map(m => {
    const i = DB.transactions.filter(t => t.tipo === 'ingreso' && t.fecha.slice(0, 7) === m).reduce((a, t) => a + t.monto, 0);
    const e = DB.transactions.filter(t => t.tipo === 'egreso' && t.fecha.slice(0, 7) === m).reduce((a, t) => a + t.monto, 0);
    return { m, i, e, b: i - e };
  });

  return `
    <div class="row" style="justify-content:flex-end;margin-bottom:14px">
      <button class="btn ghost" onclick="window.print()">${icon('printer')} Imprimir reporte</button>
    </div>

    <div class="sec-title" style="margin-top:0">Estudiantes</div>
    <div class="cards">
      <div class="stat"><div class="k">Activos</div><div class="v" style="color:#4ade80">${activos.length}</div></div>
      <div class="stat"><div class="k">Inscritos este mes</div><div class="v">${nuevos.length}</div></div>
      <div class="stat"><div class="k">Retirados</div><div class="v" style="color:#f87171">${retirados.length}</div></div>
      <div class="stat"><div class="k">Deudores</div><div class="v" style="color:#fbbf24">${deudores.length}</div><div class="s">${money(vencidas.reduce((a, p) => a + p.monto, 0))} vencido</div></div>
    </div>

    <div class="sec-title">Reporte de deudores</div>
    <div class="card" style="padding:0;overflow:auto">
    ${deudores.length ? `<table><thead><tr><th>Estudiante</th><th>Grupo</th><th>Tutor</th><th>Contacto</th><th>Deuda</th><th>Cuotas vencidas</th></tr></thead><tbody>
      ${deudores.map(d => {
        const g = DB.groups.find(x => x.id === d.s.grupoId);
        const n = vencidas.filter(p => p.studentId === d.s.id).length;
        return `<tr><td>${avatarHTML(d.s, 28)}<b>${h(((d.s.nombres || '') + ' ' + (d.s.apellidos || '')).trim())}</b></td>
        <td class="mut">${g ? h(g.nombre) : '—'}</td>
        <td class="mut">${h(d.s.tutor?.nombre || '—')}</td>
        <td class="mut">${h(d.s.tutor?.telefono || d.s.telefono || '—')}</td>
        <td style="color:#f87171;font-weight:700">${money(d.monto)}</td><td>${n}</td></tr>`;
      }).join('')}</tbody></table>` : '<p class="empty">No hay deudores vencidos.</p>'}
    </div>

    <div class="sec-title">Asistencia por grupo (últimos 30 días)</div>
    <div class="card" style="padding:0;overflow:auto">
      <table><thead><tr><th>Grupo</th><th>Horario</th><th>Registros</th><th>Asistencias</th><th>% Asistencia</th></tr></thead><tbody>
      ${porGrupo.map(r => `<tr>
        <td><b>${h(r.g.nombre)}</b></td>
        <td class="mut">${h(r.g.dias.join(', '))} · ${h(r.g.horaInicio)}-${h(r.g.horaFin)}</td>
        <td>${r.t}</td><td>${r.p}</td>
        <td><span class="badge ${r.pct >= 80 ? 'b-ok' : r.pct >= 60 ? 'b-warn' : 'b-bad'}">${r.pct}%</span></td>
      </tr>`).join('')}</tbody></table>
    </div>

    <div class="sec-title">Productos más vendidos</div>
    <div class="card" style="padding:0;overflow:auto">
    ${topProds.length ? `<table><thead><tr><th>Producto</th><th>Unidades</th><th>Total vendido</th></tr></thead><tbody>
      ${topProds.map(([k, d]) => `<tr><td>${h(k)}</td><td>${d.cant}</td><td><b>${money(d.total)}</b></td></tr>`).join('')}
      </tbody></table>` : '<p class="empty">Sin ventas registradas</p>'}
    </div>

    <div class="sec-title">Informe financiero (últimos 6 meses)</div>
    <div class="card" style="padding:0;overflow:auto">
      <table><thead><tr><th>Mes</th><th>Ingresos</th><th>Egresos</th><th>Balance</th></tr></thead><tbody>
      ${finMes.map(r => `<tr>
        <td>${monthLabel(r.m)}</td>
        <td style="color:#4ade80">${money(r.i)}</td>
        <td style="color:#f87171">${money(r.e)}</td>
        <td style="color:${r.b >= 0 ? '#4ade80' : '#f87171'};font-weight:700">${money(r.b)}</td>
      </tr>`).join('')}
      </tbody></table>
    </div>`;
}

/* =========================================================
   10) HORARIOS Y GRUPOS
   ========================================================= */
const DIAS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
function viewGroups() {
  return `
    <div class="toolbar"><button class="btn" onclick="openGroup()">${icon('plus')} Nuevo grupo</button></div>
    <div class="cards">
    ${DB.groups.map(g => {
      const n = DB.students.filter(s => s.grupoId === g.id && s.estado === 'activo').length;
      const ins = DB.users.find(u => u.id === g.instructorId);
      const lleno = n >= g.cupo;
      return `<div class="card">
        <div class="row" style="justify-content:space-between">
          <h3 style="font-size:16px">${h(g.nombre)}</h3>
          <span class="badge ${lleno ? 'b-bad' : 'b-info'}">${n}/${g.cupo}</span>
        </div>
        <div class="mut sm mt">${h(g.categoria)} · ${g.edadMin}-${g.edadMax} años</div>
        <div class="mt"><b>${h(g.horaInicio)} – ${h(g.horaFin)}</b></div>
        <div class="mut sm">${h(g.dias.join(' · '))}</div>
        <div class="mut sm mt">Instructor: ${ins ? h(ins.nombre) : '—'}</div>
        <div class="mt"><span class="badge b-mut">Mensualidad ${money(g.mensualidad)}</span></div>
        <div class="row mt">
          <button class="btn ghost sm" onclick="openGroup('${g.id}')">Editar</button>
          <button class="btn danger sm" onclick="delGroup('${g.id}')">Eliminar</button>
        </div>
      </div>`;
    }).join('') || '<div class="card"><p class="empty">No hay grupos creados</p></div>'}
    </div>`;
}
function openGroup(id) {
  const g = id ? DB.groups.find(x => x.id === id) : { categoria: 'Infantil', edadMin: 5, edadMax: 10, dias: [], horaInicio: '16:00', horaFin: '17:00', cupo: 15, mensualidad: 60000, instructorId: 'u2' };
  openModal(id ? 'Editar grupo' : 'Nuevo grupo', `
    <div class="grid2">
      <label>Nombre del grupo<input id="g_nombre" value="${h(g.nombre || '')}"></label>
      <label>Categoría<select id="g_cat">${opts(['Infantil', 'Juvenil', 'Adulto', 'Competencia', 'Mixto'], g.categoria)}</select></label>
      <label>Edad mínima<input type="number" id="g_emin" value="${g.edadMin}" min="0"></label>
      <label>Edad máxima<input type="number" id="g_emax" value="${g.edadMax}" min="0"></label>
      <label>Hora inicio<input type="time" id="g_hi" value="${h(g.horaInicio)}"></label>
      <label>Hora fin<input type="time" id="g_hf" value="${h(g.horaFin)}"></label>
      <label>Cupo máximo<input type="number" id="g_cupo" value="${g.cupo}" min="1"></label>
      <label>Mensualidad<input type="number" id="g_mens" value="${g.mensualidad}" min="0"></label>
      <label style="grid-column:1/-1">Instructor<select id="g_inst">${DB.users.filter(u => u.rol === 'instructor' || u.rol === 'admin').map(u => `<option value="${u.id}" ${g.instructorId === u.id ? 'selected' : ''}>${h(u.nombre)}</option>`).join('')}</select></label>
    </div>
    <label class="mt">Días de entrenamiento</label>
    <div class="row">${DIAS.map(d => `<label style="flex-direction:row;gap:6px;align-items:center;color:var(--txt)">
      <input type="checkbox" class="g_dia" value="${d}" ${g.dias.includes(d) ? 'checked' : ''} style="width:auto"> ${d}</label>`).join('')}</div>
    <div class="row end mt"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveGroup('${id || ''}')">Guardar</button></div>`);
}
function saveGroup(id) {
  const dias = [...document.querySelectorAll('.g_dia:checked')].map(c => c.value);
  const data = {
    nombre: v('g_nombre'), categoria: v('g_cat'), edadMin: +v('g_emin') || 0, edadMax: +v('g_emax') || 0,
    horaInicio: v('g_hi'), horaFin: v('g_hf'), cupo: +v('g_cupo') || 10,
    mensualidad: +v('g_mens') || 0, instructorId: v('g_inst'), dias
  };
  if (!data.nombre) return toast('El nombre es obligatorio', 'bad');
  if (id) Object.assign(DB.groups.find(x => x.id === id), data);
  else DB.groups.push({ id: uid('g'), ...data });
  persist(); closeModal(); render(); toast('Grupo guardado');
}
function delGroup(id) {
  const n = DB.students.filter(s => s.grupoId === id).length;
  if (n) return toast(`No se puede eliminar: ${n} estudiantes asignados`, 'bad');
  if (!confirm('¿Eliminar este grupo?')) return;
  DB.groups = DB.groups.filter(g => g.id !== id); persist(); render(); toast('Grupo eliminado');
}

/* =========================================================
   11) USUARIOS Y PERMISOS
   ========================================================= */
function viewUsers() {
  return `
    <div class="card" style="margin-bottom:16px">
      <div class="sec-title" style="margin-top:0">Matriz de permisos</div>
      <table><thead><tr><th>Módulo</th><th>Administrador</th><th>Instructor</th></tr></thead><tbody>
      ${Object.keys(NAV).map(k => `<tr>
        <td><span style="display:inline-flex;align-items:center;gap:7px">${icon(NAV[k].icon, 15)} ${NAV[k].label}</span></td>
        <td>${PERMS.admin.includes(k) ? '<span class="badge b-ok">Acceso</span>' : '<span class="badge b-mut">—</span>'}</td>
        <td>${PERMS.instructor.includes(k) ? '<span class="badge b-ok">Acceso</span>' : '<span class="badge b-mut">—</span>'}</td>
      </tr>`).join('')}</tbody></table>
    </div>
    <div class="toolbar"><button class="btn" onclick="openUser()">${icon('plus')} Nuevo usuario</button></div>
    <div class="card" style="padding:0;overflow:auto">
      <table><thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Estado</th><th style="text-align:right">Acciones</th></tr></thead><tbody>
      ${DB.users.map(u => `<tr>
        <td>${avatarHTML({ nombre: u.nombre }, 30)} <b>${h(u.nombre)}</b></td>
        <td class="mut">${h(u.usuario)}</td>
        <td><span class="badge ${u.rol === 'admin' ? 'b-info' : 'b-mut'}">${u.rol}</span></td>
        <td><span class="badge ${u.activo ? 'b-ok' : 'b-bad'}">${u.activo ? 'activo' : 'inactivo'}</span></td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn ghost sm" onclick="openUser('${u.id}')">Editar</button>
          ${u.id !== session.id ? `<button class="btn danger sm" onclick="delUser('${u.id}')">${icon('x', 14)}</button>` : '<span class="mut sm"> (tú)</span>'}
        </td></tr>`).join('')}
      </tbody></table>
    </div>`;
}
function openUser(id) {
  const u = id ? DB.users.find(x => x.id === id) : { rol: 'instructor', activo: true };
  openModal(id ? 'Editar usuario' : 'Nuevo usuario', `
    <div class="grid2">
      <label>Nombre completo<input id="u_nombre" value="${h(u.nombre || '')}"></label>
      <label>Usuario<input id="u_user" value="${h(u.usuario || '')}"></label>
      <label>Contraseña<input id="u_pass" value="${h(u.password || '')}"></label>
      <label>Rol<select id="u_rol">${opts(['admin', 'instructor'], u.rol)}</select></label>
      <label>Estado<select id="u_activo"><option value="1" ${u.activo ? 'selected' : ''}>Activo</option><option value="0" ${!u.activo ? 'selected' : ''}>Inactivo</option></select></label>
    </div>
    <div class="row end mt"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveUser('${id || ''}')">Guardar</button></div>`);
}
function saveUser(id) {
  const data = { nombre: v('u_nombre'), usuario: v('u_user'), password: v('u_pass'), rol: v('u_rol'), activo: v('u_activo') === '1' };
  if (!data.nombre || !data.usuario || !data.password) return toast('Todos los campos son obligatorios', 'bad');
  if (DB.users.some(u => u.usuario.toLowerCase() === data.usuario.toLowerCase() && u.id !== id))
    return toast('Ese nombre de usuario ya existe', 'bad');
  if (id) {
    Object.assign(DB.users.find(u => u.id === id), data);
    if (id === session.id) setSession({ ...session, nombre: data.nombre, rol: data.rol });
  } else DB.users.push({ id: uid('u'), ...data });
  persist(); closeModal(); render(); toast('Usuario guardado');
}
function delUser(id) {
  if (id === session.id) return toast('No puedes eliminar tu propio usuario', 'bad');
  if (!confirm('¿Eliminar este usuario?')) return;
  DB.users = DB.users.filter(u => u.id !== id); persist(); render(); toast('Usuario eliminado');
}

/* =========================================================
   ARRANQUE
   ========================================================= */
restoreSession();
render();
</script>
</body>
</html>
