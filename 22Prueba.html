<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0f1a"/>
<title>DojoPro · Gestión de Academia</title>
<style>
:root{
  --bg:#0a0f1a;
  --bg-elev:#0d1422;
  --panel:#131b2e;
  --panel-2:#182136;
  --panel-3:#202b45;
  --line:#243149;
  --line-2:#2e3d5a;
  --txt:#e8eef7;
  --txt-2:#b8c6dc;
  --mut:#7f92b0;
  --acc:#f43f5e;
  --acc-2:#22d3ee;
  --ok:#10b981;
  --warn:#f59e0b;
  --bad:#ef4444;
  --r-sm:8px;
  --r-md:12px;
  --r-lg:16px;
  --r-xl:20px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.25);
  --shadow-md:0 4px 14px rgba(0,0,0,.35);
  --shadow-lg:0 12px 34px rgba(0,0,0,.5);
  --shadow-xl:0 24px 60px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 600px at 10% -10%,rgba(244,63,94,.07),transparent 55%),
    radial-gradient(1000px 500px at 100% 0%,rgba(34,211,238,.06),transparent 50%),
    var(--bg);
  background-attachment:fixed;
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:14px}
h1,h2,h3{margin:0;line-height:1.25}
.mut{color:var(--mut)}
.sm{font-size:12px}
.mt{margin-top:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1;min-width:0}

/* ============ LAYOUT ============ */
.layout{
  display:grid;
  grid-template-columns:260px 1fr;
  min-height:100vh;
  min-height:100dvh;
}
.sidebar{
  background:var(--panel);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  padding:16px;
  gap:14px;
  position:sticky;
  top:0;
  height:100vh;
  height:100dvh;
  min-width:0;
  overflow:hidden;
}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand-mark{color:var(--acc);display:flex;align-items:center;flex:none}
.brand-text{min-width:0}
.brand-text b{font-size:16px;display:block}
.brand-text small{display:block;font-size:11px;color:var(--mut);font-weight:400}
nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;margin:0 -6px;padding:0 6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.nav-item{
  background:none;border:0;color:var(--txt-2);text-align:left;
  padding:10px 12px;border-radius:10px;cursor:pointer;
  display:flex;gap:10px;align-items:center;white-space:nowrap;
  font-size:14px;min-height:40px;transition:background .15s,color .15s;min-width:0;
}
.nav-item svg{flex:none;color:var(--mut)}
.nav-item:hover{background:var(--panel-3);color:#fff}
.nav-item.active{
  background:linear-gradient(90deg,rgba(244,63,94,.18),rgba(34,211,238,.05));
  color:#fff;
  box-shadow:inset 3px 0 0 var(--acc);
}
.nav-item.active svg{color:var(--acc)}
.side-foot{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.user-chip{display:flex;gap:9px;align-items:center;min-width:0}
.user-chip > div{min-width:0;overflow:hidden}
.user-chip b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-size:13px}
.user-chip small{color:var(--mut);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-actions{display:flex;gap:6px}
.side-actions .btn{flex:1}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 24px;border-bottom:1px solid var(--line);
  background:rgba(13,20,34,.85);backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:5;
}
.topbar-left{display:flex;align-items:center;gap:10px;min-width:0}
.topbar-left h2{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;align-items:center;gap:14px;color:var(--mut);font-size:13px;flex:none}
.topbar-right .date{white-space:nowrap}
.topbar-right .avatar{display:none}
.content{padding:22px 24px 90px;width:100%;min-width:0}
.content > *{animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ============ COMPONENTS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(135deg,#f43f5e,#e11d48);
  color:#fff;border:0;padding:9px 16px;border-radius:var(--r-sm);
  cursor:pointer;font-weight:600;font-size:13px;min-height:36px;
  transition:filter .15s,transform .1s;white-space:nowrap;text-decoration:none;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--panel-3);border:1px solid var(--line);color:#cfe0ff;font-weight:500}
.btn.ghost:hover{background:#26334f}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px;min-height:28px}
.btn.full{width:100%}
.btn.danger{background:#7f1d1d;border:1px solid #b91c1c}
.btn.danger:hover{background:#991b1b}
.btn.icon-only{padding:5px;width:30px;height:30px;min-height:0}

input,select,textarea{
  background:var(--bg-elev);border:1px solid var(--line);color:var(--txt);
  padding:9px 12px;border-radius:var(--r-sm);width:100%;outline:none;
  font-size:14px;min-height:38px;transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--acc-2);box-shadow:0 0 0 3px rgba(34,211,238,.14);
}
select{cursor:pointer}
label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mut);font-weight:500}
textarea{resize:vertical;min-height:70px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.toolbar > *{min-width:0}

.card{
  background:var(--panel-2);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-sm);
  min-width:0;
}
.card.flush{padding:0;overflow:hidden}
.card.flush .table-wrap{border-radius:var(--r-lg)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.stat{
  background:linear-gradient(160deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);border-radius:var(--r-md);padding:16px;
  min-width:0;position:relative;overflow:hidden;
}
.stat::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--acc),var(--acc-2));
  opacity:0;transition:opacity .2s;
}
.stat:hover::after{opacity:1}
.stat .k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.stat .v{font-size:26px;font-weight:700;margin-top:6px;line-height:1.1;overflow-wrap:break-word}
.stat .s{font-size:12px;color:var(--mut);margin-top:4px}

/* ============ TABLES ============ */
.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-md)}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);padding:11px 14px;border-bottom:1px solid var(--line);font-weight:700;background:rgba(0,0,0,.12)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:break-word}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(255,255,255,.02)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.b-ok{background:rgba(16,185,129,.14);color:#4ade80}
.b-warn{background:rgba(245,158,11,.14);color:#fbbf24}
.b-bad{background:rgba(239,68,68,.14);color:#f87171}
.b-info{background:rgba(34,211,238,.13);color:#67e8f9}
.b-mut{background:var(--panel-3);color:#a9bbd8}

/* avatars */
.avatar{border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;line-height:1;vertical-align:middle}
.avatar.ini{background:linear-gradient(135deg,#f43f5e,#22d3ee);color:#fff;font-weight:700;letter-spacing:.5px}
td > .avatar,tbody .avatar{margin-right:8px}

/* empty states */
.empty{
  padding:34px 20px;text-align:center;color:var(--mut);
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.empty svg{opacity:.35}
.empty b{color:var(--txt-2);font-size:14px}
.empty span{font-size:12px;max-width:340px}

.sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);margin:24px 0 12px;font-weight:700}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;min-width:0}
.grid2 > *,.grid3 > *{min-width:0}

/* search */
.search-wrap{position:relative;flex:1;min-width:180px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.search-wrap input{padding-left:36px}

/* modal */
.modal{
  position:fixed;inset:0;background:rgba(4,8,18,.75);display:none;
  align-items:flex-start;justify-content:center;padding:40px 16px;
  z-index:100;overflow-y:auto;backdrop-filter:blur(4px);
}
.modal.show{display:flex}
.modal-box{
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-lg);
  width:100%;max-width:620px;padding:22px;box-shadow:var(--shadow-xl);
  min-width:0;max-height:calc(100vh - 80px);overflow-y:auto;
}
.modal.wide .modal-box{max-width:900px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;position:sticky;top:-22px;background:var(--panel-2);padding:12px 0;margin-top:-12px;z-index:1}
.modal-head h3{font-size:17px;overflow-wrap:break-word;min-width:0}
.modal-head button{background:none;border:0;color:var(--mut);font-size:26px;cursor:pointer;line-height:1;padding:0;width:32px;height:32px;border-radius:8px;flex:none}
.modal-head button:hover{background:var(--panel-3);color:#fff}
.photo-prev{width:88px;height:88px;border-radius:var(--r-md);object-fit:cover;border:1px solid var(--line);background:var(--bg-elev);flex:none}

/* perfil */
.profile-head{
  display:flex;gap:16px;align-items:flex-start;padding:16px;
  background:linear-gradient(135deg,#1c2b4d,#0f1a30);
  border:1px solid var(--line);border-radius:var(--r-lg);
}
.profile-head .info{flex:1;min-width:0}
.profile-head h3{font-size:19px;margin-bottom:4px;overflow-wrap:break-word}
.profile-head .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.profile-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.profile-card{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;min-width:0}
.profile-card .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:700;margin-bottom:8px}
.profile-card .line{display:flex;gap:8px;font-size:13px;line-height:1.7;min-width:0}
.profile-card .line b{color:var(--mut);font-weight:500;min-width:50px;flex:none}
.profile-card .line span{overflow-wrap:break-word;min-width:0}

/* login */
.login-wrap{
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(900px 500px at 20% 0%,#1a2540,transparent),var(--bg);
}
.login-card{
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:28px;width:100%;max-width:380px;
  display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-lg);
}
.login-card .brand{justify-content:center}
.login-card .brand-text{text-align:left}
.hint{font-size:12px;color:var(--mut);text-align:center;line-height:1.8}
.hint b{color:var(--txt-2)}

/* toast */
.toast{
  position:fixed;bottom:22px;left:50%;transform:translate(-50%,100px);
  background:var(--panel-3);border:1px solid var(--line);
  padding:12px 20px;border-radius:var(--r-md);opacity:0;
  transition:transform .25s,opacity .25s;z-index:200;
  font-weight:600;pointer-events:none;box-shadow:var(--shadow-lg);
  max-width:calc(100vw - 32px);text-align:center;
}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.ok{border-color:#166534;color:#4ade80}
.toast.bad{border-color:#991b1b;color:#f87171}

/* ============ RESPONSIVE ============ */
@media (max-width:1024px){
  .layout{grid-template-columns:76px 1fr}
  .sidebar{padding:14px 8px;align-items:center}
  .brand-text,.user-chip > div,.nav-item span:not(svg),
  .side-actions{display:none}
  .brand{justify-content:center}
  .nav-item{justify-content:center;padding:12px;min-height:44px}
  .user-chip{justify-content:center}
  .side-foot{padding-top:10px}
  .content{padding:20px 18px 90px}
}

@media (max-width:720px){
  .layout{display:block;padding-bottom:76px;min-height:auto}
  .sidebar{
    position:fixed;bottom:0;left:0;right:0;top:auto;
    width:100%;height:auto;min-height:0;
    flex-direction:row;padding:6px;
    border-right:0;border-top:1px solid var(--line);
    background:rgba(19,27,46,.96);backdrop-filter:blur(14px);
    z-index:50;overflow:visible;
  }
  .brand,.side-foot{display:none!important}
  .sidebar nav{
    flex-direction:row;overflow-x:auto;flex:1;margin:0;padding:0;
    gap:2px;scrollbar-width:none;
  }
  .sidebar nav::-webkit-scrollbar{display:none}
  .nav-item{
    flex-direction:column;gap:3px;padding:8px 10px;
    font-size:10px;min-width:66px;flex-shrink:0;
    justify-content:center;border-radius:10px;min-height:56px;
    box-shadow:none!important;
  }
  .nav-item span:not(svg){display:block}
  .nav-item.active{background:rgba(244,63,94,.15);color:#fff}
  .nav-item.active svg{color:var(--acc)}

  .topbar{padding:12px 16px;gap:8px}
  .topbar-left h2{font-size:16px}
  .topbar-right .date{display:none}
  .topbar-right .avatar{display:inline-flex}
  .content{padding:16px 14px 30px}

  .cards{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
  .stat{padding:13px}
  .stat .v{font-size:22px}

  .grid2,.grid3,.profile-cards{grid-template-columns:1fr}

  .toolbar{gap:8px}
  .toolbar .btn{flex:1;min-width:0}
  .search-wrap{min-width:100%}
  .toolbar select,.toolbar input[type="month"],.toolbar input[type="date"]{width:100%!important}

  /* modal bottom-sheet */
  .modal{padding:0;align-items:flex-end}
  .modal-box{
    max-width:none;border-radius:20px 20px 0 0;
    max-height:92vh;padding:20px 16px calc(20px + env(safe-area-inset-bottom));
    border-left:0;border-right:0;border-bottom:0;
  }
  .modal-head{top:-20px;padding-top:4px;margin-top:-8px}

  .photo-prev{width:72px;height:72px}
  .profile-head{padding:14px;gap:12px}

  /* ===== TABLES → CARDS ===== */
  .table-wrap{overflow:visible;border-radius:0;background:transparent}
  table{min-width:0!important;display:block;background:transparent}
  thead{display:none}
  tbody{display:block}
  tbody tr{
    display:block;
    background:var(--panel-2);border:1px solid var(--line);
    border-radius:var(--r-md);margin-bottom:10px;overflow:hidden;
  }
  tbody tr:hover td{background:transparent}
  tbody td{
    display:flex;justify-content:space-between;align-items:center;
    gap:12px;padding:10px 14px;
    border-bottom:1px solid var(--line);
    text-align:right;
  }
  tbody tr td:last-child{border-bottom:0}
  tbody td::before{
    content:attr(data-label);
    font-size:10px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--mut);font-weight:700;flex-shrink:0;text-align:left;
    padding-right:8px;
  }
  tbody td:empty{display:none}
  tbody td.hide-mobile{display:none!important}

  tbody td[data-label="Acciones"],
  tbody td[data-label="Acción"]{
    justify-content:flex-end!important;
    background:rgba(0,0,0,.15);
    gap:6px;
    padding:10px 12px!important;
  }
  tbody td[data-label="Acciones"]::before,
  tbody td[data-label="Acción"]::before{display:none}
  tbody td[data-label="Acciones"] .btn,
  tbody td[data-label="Acción"] .btn{flex:none}

  tbody td > .avatar{margin-right:6px}
  tbody td > b{display:inline-block;max-width:100%;overflow-wrap:break-word}

  .card.flush{background:transparent;border:0;padding:0;box-shadow:none}
  .card.flush .table-wrap{background:transparent}
}

@media (max-width:380px){
  .nav-item{min-width:60px;padding:8px 6px;font-size:9px}
  .topbar-left h2{font-size:15px}
}

/* print */
@media print{
  .sidebar,.topbar,.toolbar,.btn,.nav-item{display:none!important}
  body{background:#fff;color:#000}
  .content{padding:0}
  .card{border:1px solid #ccc;background:#fff;box-shadow:none}
  .table-wrap{overflow:visible}
  table{min-width:0}
  thead{display:table-header-group}
  tbody tr{display:table-row}
  tbody td{display:table-cell;border:1px solid #ddd}
  tbody td::before{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-head"><h3 id="modalTitle"></h3><button onclick="closeModal()" aria-label="Cerrar">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
/* =========================================================
   DojoPro · Demo funcional con persistencia en localStorage
   ========================================================= */

/* ---------- Iconos SVG (Lucide) ---------- */
const ICONS = {
  dashboard:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  students:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/>',
  payments:'<rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>',
  attendance:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  sport:'<circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>',
  inventory:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>',
  sales:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>',
  finance:'<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  reports:'<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
  groups:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',

/* ---------- Auto-label tables para vista móvil ---------- */
let labelScheduled=false;
function scheduleLabel(){
  if(labelScheduled) return;
  labelScheduled=true;
  requestAnimationFrame(()=>{
    labelScheduled=false;
    document.querySelectorAll('.content table').forEach(t=>{
      const headers=[...t.querySelectorAll('thead th')].map(th=>th.textContent.trim());
      t.querySelectorAll('tbody tr').forEach(tr=>{
        [...tr.children].forEach((td,i)=>{
          if(td.tagName==='TD' && headers[i] && !td.dataset.label){
            td.dataset.label=headers[i];
          }
        });
      });
    });
  });
}
const tableObserver = new MutationObserver(scheduleLabel);

  const egr=DB.transactions.filter(t=>t.tipo==='egreso'&&t.fecha.slice(0,7)===periodo).reduce((a,t)=>a+t.monto,0);
  const ventas=DB.sales.filter(s=>s.fecha.slice(0,7)===periodo).reduce((a,s)=>a+s.total,0);
  const attHoy=DB.attendance.filter(a=>a.fecha===today());
  let pres=0,tot=0;
  attHoy.forEach(a=>Object.values(a.registros).forEach(x=>{tot++;if(x==='presente'||x==='tarde') pres++;}));
  const proximos=pend.slice().sort((a,b)=>a.fechaVencimiento.localeCompare(b.fechaVencimiento)).slice(0,6);
  const movs=DB.transactions.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,6);

  const fin=(can('finance')||can('sales'))?`
    <div class="cards mt">
      <div class="stat"><div class="k">Ingresos del mes</div><div class="v" style="color:#4ade80">${money(ing)}</div><div class="s">${monthLabel(periodo)}</div></div>
      <div class="stat"><div class="k">Egresos del mes</div><div class="v" style="color:#f87171">${money(egr)}</div><div class="s">${monthLabel(periodo)}</div></div>
      <div class="stat"><div class="k">Balance</div><div class="v" style="color:${ing-egr>=0?'#4ade80':'#f87171'}">${money(ing-egr)}</div><div class="s">Ingresos − egresos</div></div>
      <div class="stat"><div class="k">Ventas del mes</div><div class="v">${money(ventas)}</div><div class="s">${DB.sales.filter(s=>s.fecha.slice(0,7)===periodo).length} transacciones</div></div>
    </div>`:'';

  return `
    <div class="cards">
      <div class="stat"><div class="k">Estudiantes activos</div><div class="v">${activos.length}</div><div class="s">${retirados.length} retirados</div></div>
      <div class="stat"><div class="k">Cobros pendientes</div><div class="v" style="color:#fbbf24">${pend.length}</div><div class="s">${money(deuda)} por cobrar</div></div>
      <div class="stat"><div class="k">Deudores vencidos</div><div class="v" style="color:#f87171">${deudores.size}</div><div class="s">${vencidas.length} cuotas vencidas</div></div>
      <div class="stat"><div class="k">Asistencia hoy</div><div class="v">${tot?Math.round(pres/tot*100)+'%':'—'}</div><div class="s">${pres}/${tot} registros</div></div>
    </div>
    ${fin}
    <div class="grid2 mt" style="align-items:start">
      <div class="card">
        <div class="sec-title" style="margin-top:0">Próximos vencimientos</div>
        ${proximos.length?`<div class="table-wrap"><table><thead><tr><th>Estudiante</th><th>Período</th><th>Vence</th><th>Monto</th></tr></thead><tbody>
        ${proximos.map(p=>{
          const s=DB.students.find(x=>x.id===p.studentId);
          const venc=p.fechaVencimiento<today();
          return `<tr><td>${h(nom(s)||'—')}</td><td class="mut hide-mobile">${p.periodo}</td>
          <td><span class="badge ${venc?'b-bad':'b-warn'}">${fmtDate(p.fechaVencimiento)}</span></td><td>${money(p.monto)}</td></tr>`;
        }).join('')}</tbody></table></div>`:emptyState('Sin cobros pendientes','Todos los pagos están al día','check')}
      </div>
      <div class="card">
        <div class="sec-title" style="margin-top:0">Últimos movimientos</div>
        ${movs.length?`<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Monto</th></tr></thead><tbody>
        ${movs.map(t=>`<tr><td class="mut">${fmtDate(t.fecha)}</td><td>${h(t.descripcion)}<div class="mut sm">${h(t.categoria)}</div></td>
        <td style="color:${t.tipo==='ingreso'?'#4ade80':'#f87171'};white-space:nowrap;font-weight:600">${t.tipo==='ingreso'?'+':'−'} ${money(t.monto)}</td></tr>`).join('')}

      </div>
    </div>`;
}

function pickPhoto(input){
  const file=input.files[0]; if(!file) return;
  const fr=new FileReader();
  fr.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const max=220; let w=img.width,hh=img.height;
      const sc=Math.min(1,max/Math.max(w,hh));
      w=Math.round(w*sc); hh=Math.round(hh*sc);
      const c=document.createElement('canvas'); c.width=w; c.height=hh;
      c.getContext('2d').drawImage(img,0,0,w,hh);
      const data=c.toDataURL('image/jpeg',.72);
      $('#f_foto').value=data; $('#f_photoPrev').src=data;
    };
    img.src=e.target.result;
  };
  fr.readAsDataURL(file);
}

function delStudent(id){
  const s=DB.students.find(x=>x.id===id);

  DB.payments=DB.payments.filter(p=>p.studentId!==id);
  DB.promotions=DB.promotions.filter(p=>p.studentId!==id);

}

function generateMonthly(){
  const per=$('#payMonth')?.value||today().slice(0,7);
  const activos=DB.students.filter(s=>s.estado==='activo');
  let creados=0;
  activos.forEach(s=>{
    if(DB.payments.some(p=>p.studentId===s.id&&p.periodo===per)) return;
    const g=DB.groups.find(x=>x.id===s.grupoId);
    DB.payments.push({
      id:uid('p'),studentId:s.id,concepto:'Mensualidad',periodo:per,
      monto:g?g.mensualidad:60000,estado:'pendiente',
      fechaVencimiento:per+'-10',fechaPago:'',metodo:'',
      recibo:'REC-'+String(DB.payments.length+1+creados).padStart(4,'0')
    });
    creados++;
  });
  persist(); renderPaymentsList();
  toast(creados?`${creados} mensualidades generadas`:'Todos ya tenían mensualidad');
}

function savePaymentCreate(){

  const p={
    id:uid('p'),studentId:sid,concepto:v('pc_concepto'),periodo:per,

    fechaPago:v('pc_fecha')||today(),metodo:v('pc_metodo'),
    recibo:'REC-'+String(DB.payments.length+1).padStart(4,'0')
  };
  DB.payments.push(p); syncPaymentTx(p);
  persist(); closeModal(); render(); toast('Pago registrado');
}
function openPayRegister(id){
  const p=DB.payments.find(x=>x.id===id); if(!p) return;
  const s=DB.students.find(x=>x.id===p.studentId);
  openModal('Registrar pago',`
    <div class="card" style="margin-bottom:14px">
      <b>${h(s?nom(s):'')}</b>
      <div class="mut sm">${h(p.concepto)} · Período ${p.periodo}</div>

      <label>Monto<input type="number" id="pr_monto" value="${p.monto}"></label>
      <label>Fecha<input type="date" id="pr_fecha" value="${today()}"></label>

    </div>
    <div class="row end mt"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="confirmPay('${id}')">Confirmar</button></div>`);

function confirmPay(id){
  const p=DB.payments.find(x=>x.id===id); if(!p) return;
  p.monto=+v('pr_monto')||p.monto;
  p.fechaPago=v('pr_fecha')||today();
  p.metodo=v('pr_metodo');
  p.estado='pagado';
  syncPaymentTx(p);
  persist(); closeModal(); render(); toast('Pago registrado');
  setTimeout(()=>showReceipt(id),200);
}
function syncPaymentTx(p){
  DB.transactions=DB.transactions.filter(t=>t.refId!==p.id);
  if(p.estado==='pagado'){
    const s=DB.students.find(x=>x.id===p.studentId);
    DB.transactions.push({
      id:uid('t'),fecha:p.fechaPago,tipo:'ingreso',categoria:p.concepto,
      descripcion:`${p.concepto} ${p.periodo} — ${s?nom(s):''}`,
      monto:p.monto,metodo:p.metodo,refId:p.id
    });
  }
}
function delPayment(id){
  if(!confirm('¿Eliminar este pago?')) return;
  DB.payments=DB.payments.filter(p=>p.id!==id);
  DB.transactions=DB.transactions.filter(t=>t.refId!==id);
  persist(); render(); toast('Registro eliminado');
}
function showReceipt(id){
  const p=DB.payments.find(x=>x.id===id); if(!p) return;
  const s=DB.students.find(x=>x.id===p.studentId);
  const body=`
    <div style="text-align:center"><h3 style="margin:0">ACADEMIA DOJOPRO</h3><div>Recibo de pago</div></div><hr>
    <div>Recibo N°: <b>${p.recibo}</b></div>
    <div>Fecha: ${fmtDate(p.fechaPago||today())}</div>
    <div>Estudiante: ${h(s?nom(s):'—')}</div>
    <div>Código: ${h(s?s.codigo:'—')}</div>
    <div>Concepto: ${h(p.concepto)} (${p.periodo})</div>
    <div>Método: ${h(p.metodo||'—')}</div><hr>
    <div style="font-size:18px"><b>TOTAL: ${money(p.monto)}</b></div><hr>
    <div style="text-align:center;font-size:11px">Gracias por su pago · DojoPro</div>`;
  openModal('Recibo '+p.recibo,`
    <div class="card" style="font-family:ui-monospace,monospace;font-size:13px;line-height:1.8">${body}</div>
    <div class="row end mt"><button class="btn ghost" onclick="closeModal()">Cerrar</button><button class="btn" onclick='printHTML(${JSON.stringify(body)})'>${icon('printer')} Imprimir</button></div>`);
}

function viewAttendance(){
  const gs=DB.groups.map(g=>`<option value="${g.id}">${h(g.nombre)}</option>`).join('');
  return `
    <div class="toolbar">
      <select id="attGroup" style="width:auto" onchange="renderAttSheet()">${gs||'<option value="">Sin grupos</option>'}</select>
      <input type="date" id="attDate" style="width:auto" value="${today()}" onchange="renderAttSheet()">
      <button class="btn ghost" onclick="markAll('presente')">Marcar presentes</button>
      <button class="btn" onclick="saveAttendance()">${icon('save')} Guardar</button>
    </div>
    <div id="attSheet"></div>`;
}
function renderAttSheet(){
  const gid=$('#attGroup')?.value, f=$('#attDate')?.value;
  const el=$('#attSheet'); if(!el) return;
  if(!gid){ el.innerHTML=`<div class="card">${emptyState('Sin grupos','Crea primero un grupo','groups')}</div>`; return; }
  const g=DB.groups.find(x=>x.id===gid);
  const students=DB.students.filter(s=>s.grupoId===gid&&s.estado==='activo');
  const rec=DB.attendance.find(a=>a.grupoId===gid&&a.fecha===f);
  const reg=rec?rec.registros:{};
  const st=['presente','tarde','ausente','excusa'];
  if(!students.length){
    el.innerHTML=`<div class="card">${emptyState('Sin estudiantes activos',`El grupo ${g.nombre} no tiene estudiantes`,'students')}</div>`;
    return;
  }
  el.innerHTML=`
    <div class="card flush">
      <div class="table-wrap"><table><thead><tr><th>Estudiante</th><th>Cinturón</th><th>Estado</th></tr></thead><tbody>
      ${students.map(s=>`<tr>
        <td>${avatarHTML(s,30)}<b>${h(nom(s))}</b><div class="mut sm">${h(s.codigo)}</div></td>
        <td class="hide-mobile"><span class="badge b-mut">${h(s.cinturon)}</span></td>
        <td><select class="attSel" data-stu="${s.id}" style="max-width:200px" onchange="updateAttStats()">
          ${st.map(x=>`<option value="${x}" ${(reg[s.id]||'presente')===x?'selected':''}>${x}</option>`).join('')}
        </select></td></tr>`).join('')}
      </tbody></table></div>
    </div>
    <div class="cards mt" id="attStats"></div>
    <p class="mut sm mt" style="display:flex;align-items:center;gap:6px">
      ${rec?`${icon('check',14)} Día guardado; puedes actualizarlo.`:`${icon('info',14)} Aún no hay registro guardado.`}
    </p>`;
  updateAttStats();
}
function updateAttStats(){
  const sels=document.querySelectorAll('.attSel');
  const c={presente:0,tarde:0,ausente:0,excusa:0};
  sels.forEach(s=>c[s.value]++);
  const tot=sels.length||1;
  const el=$('#attStats'); if(!el) return;
  el.innerHTML=`
    <div class="stat"><div class="k">Presentes</div><div class="v" style="color:#4ade80">${c.presente+c.tarde}</div><div class="s">${Math.round((c.presente+c.tarde)/tot*100)}%</div></div>
    <div class="stat"><div class="k">Ausentes</div><div class="v" style="color:#f87171">${c.ausente}</div></div>
    <div class="stat"><div class="k">Tarde</div><div class="v" style="color:#fbbf24">${c.tarde}</div></div>
    <div class="stat"><div class="k">Excusa</div><div class="v" style="color:#67e8f9">${c.excusa}</div></div>`;
}
function markAll(val){ document.querySelectorAll('.attSel').forEach(s=>s.value=val); updateAttStats(); }
function saveAttendance(){
  const gid=$('#attGroup')?.value, f=$('#attDate')?.value;
  if(!gid||!f) return toast('Selecciona grupo y fecha','bad');
  const registros={};
  document.querySelectorAll('.attSel').forEach(s=>registros[s.dataset.stu]=s.value);
  if(!Object.keys(registros).length) return toast('No hay estudiantes','bad');
  let rec=DB.attendance.find(a=>a.grupoId===gid&&a.fecha===f);
  if(rec) rec.registros=registros;
  else DB.attendance.push({id:uid('att'),fecha:f,grupoId:gid,registros});
  persist(); renderAttSheet(); toast('Asistencia guardada');
}

function openItem(id){
  const it=id?DB.inventory.find(x=>x.id===id):{categoria:'Uniforme',stock:0,stockMin:3,costo:0,precio:0};

      <label>Nombre<input id="it_nombre" value="${h(it.nombre||'')}"></label>
      <label>Categoría<select id="it_cat">${opts(['Uniforme','Cinturón','Protector','Material deportivo','Otros'],it.categoria)}</select></label>
      <label>Talla<input id="it_talla" value="${h(it.talla||'')}"></label>
      <label>Stock<input type="number" id="it_stock" min="0" value="${it.stock}"></label>
      <label>Stock mínimo<input type="number" id="it_min" min="0" value="${it.stockMin}"></label>
      <label>Costo<input type="number" id="it_costo" min="0" value="${it.costo}"></label>
      <label>Precio<input type="number" id="it_precio" min="0" value="${it.precio}"></label>
    </div>
    <div class="row end mt"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveItem('${id||''}')">Guardar</button></div>`);
}
function saveItem(id){
  const data={
    nombre:v('it_nombre'),categoria:v('it_cat'),talla:v('it_talla'),
    stock:+v('it_stock')||0,stockMin:+v('it_min')||0,
    costo:+v('it_costo')||0,precio:+v('it_precio')||0
  };
  if(!data.nombre) return toast('El nombre es obligatorio','bad');
  if(id) Object.assign(DB.inventory.find(x=>x.id===id),data);
  else DB.inventory.push({id:uid('i'),...data});
  persist(); closeModal(); render(); toast('Producto guardado');
}
function adjustStock(id){
  const it=DB.inventory.find(x=>x.id===id); if(!it) return;
  const n=prompt(`Ajustar stock de "${it.nombre}".\nActual: ${it.stock}`,it.stock);
  if(n===null) return;
  const val=parseInt(n,10); if(isNaN(val)||val<0) return toast('Valor inválido','bad');
  it.stock=val; persist(); render(); toast('Stock actualizado');
}
function delItem(id){
  if(!confirm('¿Eliminar este producto?')) return;
  DB.inventory=DB.inventory.filter(x=>x.id!==id); persist(); render(); toast('Producto eliminado');
}

function viewSales(){

        <td>${h(s.clienteNombre||'Público general')}</td>
        <td class="mut sm hide-mobile">${s.items.map(i=>`${i.cantidad}× ${h(i.desc)}`).join('<br>')}</td>
        <td class="hide-mobile">${h(s.metodo)}</td>

          <button class="btn ghost sm" onclick="showSaleReceipt('${s.id}')">Recibo</button>
          <button class="btn danger sm icon-only" onclick="delSale('${s.id}')" title="Eliminar">${icon('x',14)}</button>
        </td></tr>`).join('')}</tbody></table></div></div>`:`<div class="card">${emptyState('Sin ventas','Registra la primera venta','sales')}</div>`}`;
}
function openSale(){
  saleDraft=[];
  const prods=DB.inventory.filter(i=>i.stock>0).map(i=>`<option value="${i.id}">${h(i.nombre)}${i.talla?' ('+h(i.talla)+')':''} — ${money(i.precio)} · stock ${i.stock}</option>`).join('');
  const stu=DB.students.filter(s=>s.estado==='activo').map(s=>`<option value="${s.id}">${h(nom(s))}</option>`).join('');
  openModal('Nueva venta',`
    <div class="grid2">
      <label>Cliente<select id="saleClient"><option value="">— Público general —</option>${stu}</select></label>
      <label>Método<select id="saleMethod">${opts(['Efectivo','Transferencia','Tarjeta','Nequi','Daviplata'],'Efectivo')}</select></label>
    </div>
    <div class="card mt">
      <div class="sec-title" style="margin-top:0">Producto del inventario</div>
      <div class="row">
        <select id="saleProd" class="grow">${prods||'<option value="">Sin stock</option>'}</select>
        <input id="saleQty" type="number" min="1" value="1" style="width:80px">
        <button class="btn" onclick="addSaleItem()">Agregar</button>
      </div>
      <div class="sec-title">Artículo libre</div>
      <div class="row">
        <input id="freeDesc" class="grow" placeholder="Ej. Agua, otro">
        <input id="freePrice" type="number" min="0" placeholder="Precio" style="width:100px">
        <button class="btn ghost" onclick="addFreeItem()">Agregar</button>
      </div>
    </div>
    <div id="saleDraft" class="mt"></div>
    <div class="row end mt"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="confirmSale()">Registrar</button></div>`,true);
  renderSaleDraft();
}
function addSaleItem(){
  const id=v('saleProd'); if(!id) return toast('Selecciona producto','bad');
  const it=DB.inventory.find(x=>x.id===id); if(!it) return;
  const qty=Math.max(1,+v('saleQty')||1);
  const enCarrito=saleDraft.filter(d=>d.invId===id).reduce((a,d)=>a+d.cantidad,0);
  if(enCarrito+qty>it.stock) return toast(`Stock insuficiente (disponible: ${it.stock-enCarrito})`,'bad');
  saleDraft.push({invId:id,desc:`${it.nombre}${it.talla?' ('+it.talla+')':''}`,cantidad:qty,precio:it.precio});
  renderSaleDraft();
}
function addFreeItem(){
  const desc=v('freeDesc'), price=+v('freePrice')||0;
  if(!desc) return toast('Escribe una descripción','bad');
  saleDraft.push({invId:'',desc,cantidad:1,precio:price});
  $('#freeDesc').value=''; $('#freePrice').value='';
  renderSaleDraft();
}
function removeSaleItem(i){ saleDraft.splice(i,1); renderSaleDraft(); }
function renderSaleDraft(){
  const el=$('#saleDraft'); if(!el) return;
  const total=saleDraft.reduce((a,d)=>a+d.precio*d.cantidad,0);
  el.innerHTML=saleDraft.length?`<div class="card flush"><div class="table-wrap"><table>
    <thead><tr><th>Descripción</th><th>Cant.</th><th>Precio</th><th>Subtotal</th><th></th></tr></thead><tbody>
    ${saleDraft.map((d,i)=>`<tr><td>${h(d.desc)}</td><td>${d.cantidad}</td><td>${money(d.precio)}</td><td><b>${money(d.precio*d.cantidad)}</b></td>
    <td style="text-align:right"><button class="btn danger sm icon-only" onclick="removeSaleItem(${i})">${icon('x',14)}</button></td></tr>`).join('')}
    <tr><td colspan="3" style="text-align:right"><b>TOTAL</b></td><td colspan="2"><b style="font-size:16px;color:#4ade80">${money(total)}</b></td></tr>
    </tbody></table></div></div>`:'<p class="mut sm">Sin productos agregados.</p>';
}
function confirmSale(){
  if(!saleDraft.length) return toast('Agrega al menos un producto','bad');
  const cid=v('saleClient');
  const s=DB.students.find(x=>x.id===cid);
  const total=saleDraft.reduce((a,d)=>a+d.precio*d.cantidad,0);
  saleDraft.forEach(d=>{ if(d.invId){ const it=DB.inventory.find(i=>i.id===d.invId); if(it) it.stock-=d.cantidad; } });
  const sale={
    id:uid('sa'),fecha:today(),clienteId:cid,
    clienteNombre:s?nom(s):'Público general',
    metodo:v('saleMethod'),total,items:saleDraft.slice()
  };
  DB.sales.push(sale);
  DB.transactions.push({id:uid('t'),fecha:sale.fecha,tipo:'ingreso',categoria:'Venta',descripcion:'Venta a '+sale.clienteNombre,monto:total,metodo:sale.metodo,refId:sale.id});
  saleDraft=[]; persist(); closeModal(); render(); toast('Venta registrada');
}
function delSale(id){
  if(!confirm('¿Eliminar esta venta? Se devolverá stock y se borrará el ingreso.')) return;
  const s=DB.sales.find(x=>x.id===id); if(!s) return;
  s.items.forEach(it=>{ if(it.invId){ const p=DB.inventory.find(i=>i.id===it.invId); if(p) p.stock+=it.cantidad; } });
  DB.sales=DB.sales.filter(x=>x.id!==id);
  DB.transactions=DB.transactions.filter(t=>t.refId!==id);
  persist(); render(); toast('Venta eliminada');
}
function showSaleReceipt(id){
  const s=DB.sales.find(x=>x.id===id); if(!s) return;
  const body=`
    <div style="text-align:center"><h3 style="margin:0">ACADEMIA DOJOPRO</h3><div>Comprobante de venta</div></div><hr>
    <div>Fecha: ${fmtDate(s.fecha)}</div>
    <div>Cliente: ${h(s.clienteNombre)}</div>
    <div>Método: ${h(s.metodo)}</div><hr>
    ${s.items.map(i=>`<div>${i.cantidad} × ${h(i.desc)} ....... ${money(i.precio*i.cantidad)}</div>`).join('')}
    <hr><div style="font-size:18px"><b>TOTAL: ${money(s.total)}</b></div><hr>
    <div style="text-align:center;font-size:11px">¡Gracias por tu compra!</div>`;
  openModal('Comprobante',`
    <div class="card" style="font-family:ui-monospace,monospace;font-size:13px;line-height:1.8">${body}</div>
    <div class="row end mt"><button class="btn ghost" onclick="closeModal()">Cerrar</button><button class="btn" onclick='printHTML(${JSON.stringify(body)})'>${icon('printer')} Imprimir</button></div>`);
}

function saveTx(tipo){

   9) REPORTES
   ========================================================= */
function viewReports(){
  const cur=today().slice(0,7);
  const activos=DB.students.filter(s=>s.estado==='activo');
  const retirados=DB.students.filter(s=>s.estado==='retirado');
  const nuevos=DB.students.filter(s=>(s.fechaInscripcion||'').slice(0,7)===cur);
  const pend=DB.payments.filter(p=>p.estado==='pendiente');
  const vencidas=pend.filter(p=>p.fechaVencimiento<today());
  const deudoresMap={};
  vencidas.forEach(p=>{ deudoresMap[p.studentId]=(deudoresMap[p.studentId]||0)+p.monto; });
  const deudores=Object.entries(deudoresMap).map(([id,monto])=>({s:DB.students.find(x=>x.id===id),monto})).filter(x=>x.s);
  const lim=new Date(); lim.setDate(lim.getDate()-30); const limStr=lim.toISOString().slice(0,10);
  const att=DB.attendance.filter(a=>a.fecha>=limStr);
  const porGrupo=DB.groups.map(g=>{
    const recs=att.filter(a=>a.grupoId===g.id);
    let p=0,t=0;
    recs.forEach(r=>Object.values(r.registros).forEach(x=>{t++;if(x==='presente'||x==='tarde') p++;}));
    return {g,p,t,pct:t?Math.round(p/t*100):0};
  });
  const prodMap={};
  DB.sales.forEach(s=>s.items.forEach(i=>{
    const k=i.desc; if(!prodMap[k]) prodMap[k]={cant:0,total:0};
    prodMap[k].cant+=i.cantidad; prodMap[k].total+=i.cantidad*i.precio;
  }));
  const topProds=Object.entries(prodMap).sort((a,b)=>b[1].total-a[1].total).slice(0,8);
  const meses=[];
  for(let i=5;i>=0;i--){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); meses.push(d.toISOString().slice(0,7)); }
  const finMes=meses.map(m=>{
    const i=DB.transactions.filter(t=>t.tipo==='ingreso'&&t.fecha.slice(0,7)===m).reduce((a,t)=>a+t.monto,0);
    const e=DB.transactions.filter(t=>t.tipo==='egreso'&&t.fecha.slice(0,7)===m).reduce((a,t)=>a+t.monto,0);
    return {m,i,e,b:i-e};
  });
  return `
    <div class="row end" style="margin-bottom:14px"><button class="btn ghost" onclick="window.print()">${icon('printer')} Imprimir</button></div>
    <div class="sec-title" style="margin-top:0">Estudiantes</div>
    <div class="cards">
      <div class="stat"><div class="k">Activos</div><div class="v" style="color:#4ade80">${activos.length}</div></div>
      <div class="stat"><div class="k">Nuevos este mes</div><div class="v">${nuevos.length}</div></div>
      <div class="stat"><div class="k">Retirados</div><div class="v" style="color:#f87171">${retirados.length}</div></div>
      <div class="stat"><div class="k">Deudores</div><div class="v" style="color:#fbbf24">${deudores.length}</div><div class="s">${money(vencidas.reduce((a,p)=>a+p.monto,0))} vencido</div></div>
    </div>
    <div class="sec-title">Reporte de deudores</div>
    ${deudores.length?`<div class="card flush"><div class="table-wrap"><table>
      <thead><tr><th>Estudiante</th><th>Grupo</th><th>Tutor</th><th>Contacto</th><th>Deuda</th><th>Cuotas</th></tr></thead><tbody>
      ${deudores.map(d=>{
        const g=DB.groups.find(x=>x.id===d.s.grupoId);
        const n=vencidas.filter(p=>p.studentId===d.s.id).length;
        return `<tr><td>${avatarHTML(d.s,28)}<b>${h(nom(d.s))}</b></td>
        <td class="mut hide-mobile">${g?h(g.nombre):'—'}</td>
        <td class="mut hide-mobile">${h(d.s.tutor?.nombre||'—')}</td>
        <td class="mut hide-mobile">${h(d.s.tutor?.telefono||d.s.telefono||'—')}</td>
        <td style="color:#f87171;font-weight:700">${money(d.monto)}</td><td>${n}</td></tr>`;
      }).join('')}</tbody></table></div></div>`:`<div class="card">${emptyState('Sin deudores','Todos al día','check')}</div>`}
    <div class="sec-title">Asistencia por grupo (30 días)</div>
    <div class="card flush"><div class="table-wrap"><table>
      <thead><tr><th>Grupo</th><th>Horario</th><th>Registros</th><th>Asistencias</th><th>%</th></tr></thead><tbody>
      ${porGrupo.map(r=>`<tr>
        <td><b>${h(r.g.nombre)}</b></td>
        <td class="mut hide-mobile">${h(r.g.dias.join(', '))} · ${h(r.g.horaInicio)}-${h(r.g.horaFin)}</td>
        <td>${r.t}</td><td>${r.p}</td>
        <td><span class="badge ${r.pct>=80?'b-ok':r.pct>=60?'b-warn':'b-bad'}">${r.pct}%</span></td>
      </tr>`).join('')}</tbody></table></div></div>
    <div class="sec-title">Productos más vendidos</div>
    ${topProds.length?`<div class="card flush"><div class="table-wrap"><table>
      <thead><tr><th>Producto</th><th>Unidades</th><th>Total</th></tr></thead><tbody>
      ${topProds.map(([k,d])=>`<tr><td>${h(k)}</td><td>${d.cant}</td><td><b>${money(d.total)}</b></td></tr>`).join('')}
      </tbody></table></div></div>`:`<div class="card">${emptyState('Sin ventas','Aún no hay datos','sales')}</div>`}
    <div class="sec-title">Informe financiero (6 meses)</div>
    <div class="card flush"><div class="table-wrap"><table>
      <thead><tr><th>Mes</th><th>Ingresos</th><th>Egresos</th><th>Balance</th></tr></thead><tbody>
      ${finMes.map(r=>`<tr>
        <td>${monthLabel(r.m)}</td>
        <td style="color:#4ade80">${money(r.i)}</td>
        <td style="color:#f87171">${money(r.e)}</td>
        <td style="color:${r.b>=0?'#4ade80':'#f87171'};font-weight:700">${money(r.b)}</td>
      </tr>`).join('')}</tbody></table></div></div>`;
}

function saveGroup(id){
  const dias=[...document.querySelectorAll('.g_dia:checked')].map(c=>c.value);
  const data={
    nombre:v('g_nombre'),categoria:v('g_cat'),edadMin:+v('g_emin')||0,edadMax:+v('g_emax')||0,
    horaInicio:v('g_hi'),horaFin:v('g_hf'),cupo:+v('g_cupo')||10,
    mensualidad:+v('g_mens')||0,instructorId:v('g_inst'),dias
  };
  if(!data.nombre) return toast('El nombre es obligatorio','bad');
  if(id) Object.assign(DB.groups.find(x=>x.id===id),data);
  else DB.groups.push({id:uid('g'),...data});
  persist(); closeModal(); render(); toast('Grupo guardado');
}
function delGroup(id){
  const n=DB.students.filter(s=>s.grupoId===id).length;
  if(n) return toast(`No se puede: ${n} estudiantes asignados`,'bad');
  if(!confirm('¿Eliminar este grupo?')) return;
  DB.groups=DB.groups.filter(g=>g.id!==id); persist(); render(); toast('Grupo eliminado');
}

}
function openUser(id){
  const u=id?DB.users.find(x=>x.id===id):{rol:'instructor',activo:true};
  openModal(id?'Editar usuario':'Nuevo usuario',`
    <div class="grid2">
      <label>Nombre<input id="u_nombre" value="${h(u.nombre||'')}"></label>
      <label>Usuario<input id="u_user" value="${h(u.usuario||'')}"></label>
      <label>Contraseña<input id="u_pass" value="${h(u.password||'')}"></label>
      <label>Rol<select id="u_rol">${opts(['admin','instructor'],u.rol)}</select></label>
      <label>Estado<select id="u_activo"><option value="1" ${u.activo?'selected':''}>Activo</option><option value="0" ${!u.activo?'selected':''}>Inactivo</option></select></label>
    </div>
    <div class="row end mt"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveUser('${id||''}')">Guardar</button></div>`);
}
function saveUser(id){
  const data={nombre:v('u_nombre'),usuario:v('u_user'),password:v('u_pass'),rol:v('u_rol'),activo:v('u_activo')==='1'};
  if(!data.nombre||!data.usuario||!data.password) return toast('Todos los campos son obligatorios','bad');
  if(DB.users.some(u=>u.usuario.toLowerCase()===data.usuario.toLowerCase()&&u.id!==id))
    return toast('Ese usuario ya existe','bad');
  if(id){
    Object.assign(DB.users.find(u=>u.id===id),data);
    if(id===session.id) setSession({...session,nombre:data.nombre,rol:data.rol});
  } else DB.users.push({id:uid('u'),...data});
  persist(); closeModal(); render(); toast('Usuario guardado');
}
function delUser(id){
  if(id===session.id) return toast('No puedes eliminar tu propio usuario','bad');
  if(!confirm('¿Eliminar este usuario?')) return;
  DB.users=DB.users.filter(u=>u.id!==id); persist(); render(); toast('Usuario eliminado');
}

/* =========================================================
   ARRANQUE
   ========================================================= */
restoreSession();
render();
</script>
</body>
</html>
