  function actualizarLineaCarrito(ix,campo,valor){
  const it=ui.ventaCarrito[ix]; if(!it) return;

  if(it.esRecarga && campo==='precioUnit'){
    const p=prodById(it.productoId);
    const b=p?.proveedorId?bolsaDe(p.proveedorId, it.tipoRecarga):null;
    const disp=b?(b.saldo||0):0;
    const otros=ui.ventaCarrito.filter((_,i)=>i!==ix&&_.productoId===it.productoId).reduce((a,i)=>a+i.subtotal,0);
    const nuevo=num2(valor);
    if(nuevo<=0) return toast('Monto inválido','err');
    if(disp<otros+nuevo) return toast(`Saldo insuficiente (${money(disp)})`,'err');
    it.precioUnit=nuevo; it.costoUnit=nuevo;
  }
  else if(campo==='precioUnit'){
    it.precioUnit=num2(valor);
  }
  else if(campo==='cantidad'){
    const v=num2(valor);
    if(v<=0) return toast('Cantidad inválida','err');
    const p=prodById(it.productoId);
    if(p && !esProductoRecarga(p)){
      const otros=ui.ventaCarrito
        .filter((_,i)=>i!==ix && _.productoId===it.productoId)
        .reduce((a,i)=>a+i.cantidad,0);
      if(p.stock < otros + v)
        return toast(`Stock insuficiente (${p.stock})`, 'err');
    }
    it.cantidad = v;
  }

  it.subtotal=num2(it.cantidad*it.precioUnit);
  render();
}

function confirmarVenta(){
  if(!turnoRequerido()) return toast('Abre tu turno','err');
  if(ui.ventaCarrito.length===0) return toast('Carrito vacío','err');
  const fechaVenta=ui.ventaFecha||HOY();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(fechaVenta) || Number.isNaN(Date.parse(fechaVenta+'T12:00:00'))) return toast('Selecciona una fecha válida','err');
  if(fechaVenta>HOY()) return toast('La fecha de la venta no puede ser futura','err');
  if(mesCerrado(fechaVenta.slice(0,7))) return toast(`El mes ${fechaVenta.slice(0,7)} está cerrado. No se puede registrar una venta en ese período.`,'err');
  for(const it of ui.ventaCarrito){
    const p=prodById(it.productoId);
    if(!p) return toast(`Producto eliminado: ${it.nombre}`,'err');
    if(!esProductoRecarga(p)&&p.stock<it.cantidad) return toast(`Stock insuficiente de ${p.nombre}`,'err');
  }
  const cliente=ui.ventaClienteId?state.clientes.find(c=>c.id===ui.ventaClienteId):null;
  if(ui.ventaTipoPago==='credito'&&!cliente) return toast('Selecciona un cliente','err');
  let plazo=null,vencimiento=null;
  if(ui.ventaTipoPago==='credito'){
    plazo=ui.ventaPlazo==='custom'?Number(ui.ventaPlazoCustom):Number(ui.ventaPlazo);
    if(!(plazo>0)) return toast('Define un plazo','err');
    vencimiento=addDias(fechaVenta,plazo);
  }

  const total=totalCarritoVenta();
  const metodoVenta = ui.ventaMetodoPago === 'transferencia' ? 'transferencia' : 'efectivo';
  let montoRecibido=null,cambio=null;
  if(ui.ventaTipoPago==='contado'){
    if(metodoVenta === 'transferencia'){
      // Transferencia: monto exacto, sin cambio
      montoRecibido = total;
      cambio = 0;
    } else {
      montoRecibido=Number(ui.ventaMontoRecibido);
      if(!(montoRecibido>=total)) return toast('Monto insuficiente','err');
      cambio=num2(montoRecibido-total);
    }
  }
  const venta={
    id:'V'+(state.seq.venta++),fecha:fechaVenta,hora:horaActual(),
    clienteId:cliente?cliente.id:null,
    clienteNombre:cliente?cliente.nombre:'Consumidor final',
    tipoPago:ui.ventaTipoPago,plazo,vencimiento,
    metodoPago: ui.ventaTipoPago==='contado' ? metodoVenta : 'pendiente',
    items:ui.ventaCarrito.map(i=>({...i})),
    total,pagado:ui.ventaTipoPago==='contado'?total:0,
    montoRecibido,cambio,
    usuarioId:usuarioActual?.id||null,usuarioNombre:usuarioActual?.nombre||'—'
  };
  state.ventas.push(venta);
  venta.items.forEach(it=>{
    const p=prodById(it.productoId); if(!p) return;
    if(esProductoRecarga(p)){
      const b=p.proveedorId?bolsaDe(p.proveedorId,it.tipoRecarga||tipoBolsaDeProducto(p)):null;
      if(b) b.saldo=num2((b.saldo||0)-it.subtotal);
    } else p.stock=num2(p.stock-it.cantidad);
  });
  if(venta.tipoPago==='contado')
    agregarMovimientoCaja('venta',total,'Venta '+venta.id+' · '+venta.clienteNombre,venta.id,fechaVenta,metodoVenta);
  ui.ventaCarrito=[]; ui.ventaClienteId=''; ui.ventaMontoRecibido=''; ui.ventaFecha=HOY();
  ui.ventaTipoPago='contado'; ui.ventaPlazo=15; ui.ventaPlazoCustom='';
  ui.ventaMetodoPago='efectivo';


  
  const gan=gananciaVenta(venta);
  if(gan>0) toast(`Venta ${money(total)} · Ganancia ${money(gan)}${cambio>0.001?' · Cambio '+money(cambio):''}`,'ok');
  else toast(`Venta ${money(total)}${cambio>0.001?' · Cambio '+money(cambio):''}`,'ok');
  render();
}

 function actualizarMontoRecibido(input){
  ui.ventaMontoRecibido = input.value;

  const total = totalCarritoVenta();
  const recibido = Number(ui.ventaMontoRecibido)||0;
  const cambio = num2(recibido - total);
  const cambioOk = recibido >= total;

  // 1) Clases del input (verde/rojo) sin re-renderizar
  input.classList.remove('money-ok','money-bad');
  if(recibido > 0) input.classList.add(cambioOk ? 'money-ok' : 'money-bad');

  // 2) Bloque de cambio/falta
  const cont = $('cambio-render');
  if(cont){
    if(recibido <= 0){
      cont.innerHTML = '';
      cont.style.display = 'none';
    } else {
      cont.style.display = 'block';
      let cls, label, valor;
      if(!cambioOk){
        cls='insuf'; label='Falta'; valor = money(num2(total - recibido));
      } else if(cambio > 0.001){
        cls=''; label='Cambio'; valor = money(cambio);
      } else {
        cls='exacto'; label='Exacto'; valor = money(total);
      }
      cont.innerHTML = `<div class="cambio-box ${cls}">
        <span class="cambio-label">${label}</span>
        <span class="cambio-value">${valor}</span>
      </div>`;
    }
  }

  // 3) Habilitar/deshabilitar el botón confirmar
  const btn = $('btn-confirmar-venta');
  if(btn){
    const cliente = ui.ventaClienteId ? state.clientes.find(c=>c.id===ui.ventaClienteId) : null;
    const deshabilitar =
      (ui.ventaTipoPago==='contado' && !cambioOk) ||
      (ui.ventaTipoPago==='credito' && !cliente);
    btn.disabled = deshabilitar;
  }
} 
function buscarProductos(query,excluirRecargas){
  const q=normalizar(query);
  return state.productos
    .filter(p=>!excluirRecargas||!esProductoRecarga(p))
    .filter(p=>!q||coincide(p.nombre,q)||coincide(catById(p.categoriaId)?.nombre||'',q)||coincide(provById(p.proveedorId)?.nombre||'',q))
    .sort((a,b)=>a.nombre.localeCompare(b.nombre));
}
function buscarClientesQuery(query){
  const q=normalizar(query);
  if(!q) return state.clientes.slice();
  return state.clientes.filter(c=>coincide(c.nombre,q)||coincide(c.tel||'',q)||coincide(c.comunidad||'',q));
}

function agregarAlCarritoCompra(productoId,cantidad,costoUnit){
  const p=prodById(productoId); if(!p) return;
  if(esProductoRecarga(p)) return toast('Las recargas se manejan en Caja → Bolsas','err');
  cantidad=num2(cantidad); if(cantidad<=0) return toast('Cantidad inválida','err');
  costoUnit=num2(costoUnit); if(costoUnit<0) return toast('Costo inválido','err');
  const existe=ui.compraCarrito.find(i=>i.productoId===productoId&&i.costoUnit===costoUnit);
  if(existe){ existe.cantidad=num2(existe.cantidad+cantidad); existe.subtotal=num2(existe.cantidad*existe.costoUnit); }
  else ui.compraCarrito.push({productoId,nombre:p.nombre,unidad:p.unidad,cantidad,costoUnit,subtotal:num2(cantidad*costoUnit)});
  render();
}
function actualizarLineaCompra(ix,campo,valor){
  const it=ui.compraCarrito[ix]; if(!it) return;
  if(campo==='cantidad') it.cantidad=num2(valor);
  if(campo==='costoUnit') it.costoUnit=num2(valor);
  if(it.cantidad<=0) it.cantidad=1;
  it.subtotal=num2(it.cantidad*it.costoUnit);
  render();
}

function totalCarritoCompra(){ return num2(ui.compraCarrito.reduce((a,i)=>a+i.subtotal,0)); }
function confirmarCompra(){
  if(ui.compraCarrito.length===0) return toast('Carrito vacío','err');

  // Validar fecha seleccionada
  const fechaCompra = ui.compraFecha || HOY();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(fechaCompra) || Number.isNaN(Date.parse(fechaCompra+'T12:00:00')))
    return toast('Selecciona una fecha válida','err');
  if(fechaCompra > HOY())
    return toast('La fecha de la compra no puede ser futura','err');
  if(mesCerrado(fechaCompra.slice(0,7)))
    return toast(`El mes ${nombreMes(fechaCompra.slice(0,7))} está cerrado. No se puede registrar una compra en ese período.`,'err');

  const total=totalCarritoCompra();
  const prov=ui.compraProveedorId?provById(ui.compraProveedorId):null;

  const ejecutar=()=>{
    const compra={
      id:'P'+(state.seq.compra++),
      fecha:fechaCompra,                    // ← fecha elegida, no HOY()
      hora:horaActual(),
      proveedorId:prov?prov.id:null,
      proveedorNombre:prov?prov.nombre:'Sin proveedor',
      items:ui.compraCarrito.map(i=>({...i})),
      total,
      nota:ui.compraNota.trim(),
      usuarioId:usuarioActual?.id||null,
      usuarioNombre:usuarioActual?.nombre||'—'
    };
    state.compras.push(compra);
    compra.items.forEach(it=>{ const p=prodById(it.productoId); if(p) p.stock=num2(p.stock+it.cantidad); });

    // El movimiento de caja hereda la misma fecha para que reportes y cierre mensual cuadren
    agregarMovimientoCaja('compra',-total,
      'Compra '+compra.id+' · '+compra.proveedorNombre,
      compra.id,
      fechaCompra);                         // ← 5to parámetro = fecha

    ui.compraCarrito=[];
    ui.compraProveedorId='';
    ui.compraNota='';
    ui.compraFecha=HOY();                    // ← reset
    toast('Compra '+money(total),'ok');
    render();
  };

  if(total>saldoCaja()){
    pedirConfirmacion({

function render(){

  if(!visibles.includes(vista)) vista=visibles[0];

  const active=document.activeElement;
  const focusId=(active&&active.id)?active.id:null;
  const selStart=(active&&typeof active.selectionStart==='number')?active.selectionStart:null;
  const selEnd=(active&&typeof active.selectionEnd==='number')?active.selectionEnd:null;
  const scrollY=window.scrollY;
  $('app').innerHTML=fns[vista]?fns[vista]():'<div class="empty">Vista no encontrada</div>';
  if(ui.modal&&ui.modal.tipo==='abono'){ const el=$('m-abono-monto'); if(el) actualizarAbonoPreview(deudaCliente(ui.modal.id)); }
  if(ui.modal&&(ui.modal.tipo==='configurarCapital'||ui.modal.tipo==='editarCapital')) setTimeout(recalcularCapitalTotal,20);
  requestAnimationFrame(()=>{ window.scrollTo({top:scrollY,behavior:'instant'}); });
  if(focusId){
    const el=document.getElementById(focusId);
    if(el&&typeof el.focus==='function'){
      try{ el.focus({preventScroll:true}); }catch(e){ el.focus(); }
      if(selStart!==null&&typeof el.setSelectionRange==='function'){
        try{ el.setSelectionRange(selStart,selEnd); }catch(e){}
      }
    }
  }
}

function exportarDatos(){
  try{

    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='simgest_'+HOY()+'.json'; a.click();
    URL.revokeObjectURL(url);
    toast('Copia descargada','ok');
  }catch(e){ toast('Error al exportar','err'); }
}

function cargarBaseReal(){
  // Categorías
  const cats=['Telefonía','Dulces','Útiles escolares','Bebidas','Otros'].map(n=>{
    const c={id:'CA'+(state.seq.categoria++),nombre:n};
    state.categorias.push(c); return c;
  });
  const catPorNombre=n=>cats.find(c=>c.nombre===n).id;
  // Solo Entel por ahora (el cliente lo pidió)
  const provs=['Entel'].map(x=>{
    const p={id:'PV'+(state.seq.proveedor++),nombre:x,nota:''};
    state.proveedores.push(p);
    bolsaDe(p.id,'paso'); bolsaDe(p.id,'paquete');
    return p;
  });
  const provPorNombre=n=>provs.find(p=>p.nombre===n).id;
  // Categoría "Bolsas electrónicas"
  const catBolsa=(()=>{
    let c=state.categorias.find(x=>x.nombre==='Bolsas electrónicas');
    if(!c){ c={id:'CA'+(state.seq.categoria++),nombre:'Bolsas electrónicas'}; state.categorias.push(c); }
    return c;
  })();
  // 2 productos: Recargas al paso y Paquetes
  state.productos.push({
    id:'PR'+(state.seq.producto++),
    nombre:'Recargas al paso',
    categoriaId:catBolsa.id,
    proveedorId:provPorNombre('Entel'),
    unidad:'bolivianos',
    esRecarga:true,
    tipoRecarga:'paso',
    costo:0, precio:0, stock:0, stockInicial:0
  });
  state.productos.push({
    id:'PR'+(state.seq.producto++),
    nombre:'Recargas de paquetes',
    categoriaId:catBolsa.id,
    proveedorId:provPorNombre('Entel'),
    unidad:'bolivianos',
    esRecarga:true,
    tipoRecarga:'paquete',
    costo:0, precio:0, stock:0, stockInicial:0
  });
  // Chips (físicos) — para más adelante
  const gen=[
    {nombre:'Chip Entel 10',cat:'Telefonía',unidad:'unidad',costo:5,precio:12},
    {nombre:'Chip Entel 15',cat:'Telefonía',unidad:'unidad',costo:7,precio:18},
    {nombre:'Chip Entel 30',cat:'Telefonía',unidad:'unidad',costo:15,precio:30},
    {nombre:'Chicle',cat:'Dulces',unidad:'unidad',costo:0.5,precio:1},
    {nombre:'Cuaderno',cat:'Útiles escolares',unidad:'unidad',costo:5,precio:8},
    {nombre:'Coca Cola 500ml',cat:'Bebidas',unidad:'unidad',costo:4,precio:6}
  ];
  gen.forEach(g=>{
    state.productos.push({id:'PR'+(state.seq.producto++),nombre:g.nombre,categoriaId:catPorNombre(g.cat),proveedorId:null,unidad:g.unidad,esRecarga:false,costo:num2(g.costo),precio:num2(g.precio),stock:0,stockInicial:0});
  });
  save(); render();
  toast('Configuración base cargada','ok');
}

function migrarDatosViejos(){
  let hubo=false;
  // Migrar formato viejo de bolsas: bolsas['PV1'] → bolsas['PV1:paso'] + bolsas['PV1:paquete']
  const nuevasBolsas={};
  Object.entries(state.bolsas||{}).forEach(([k,v])=>{
    if(k.includes(':')){ nuevasBolsas[k]=v; }
    else{
      // Formato viejo: 'PV1' → todo a 'paso'
      nuevasBolsas[`${k}:paso`]={saldo:num2(v.saldo||0), bonificaciones:num2(v.bonificaciones||0)};
      nuevasBolsas[`${k}:paquete`]={saldo:0, bonificaciones:0};
      hubo=true;
    }
  });
  state.bolsas=nuevasBolsas;
  // Migrar productos de recarga viejos: "Recarga Entel 10" → tipo 'paso', unidad 'bolivianos'
  state.productos.forEach(p=>{
    if(p.esRecarga){
      if(!p.tipoRecarga){
        p.tipoRecarga = (p.nombre||'').toLowerCase().includes('paquete') ? 'paquete' : 'paso';
        hubo=true;
      }
      if(p.unidad!=='bolivianos'){ p.unidad='bolivianos'; hubo=true; }
    }
  });
  // Migrar bonificaciones viejas: si había saldoBolsasBonifTotal, pasarlas a ajustesBolsa
  if(!state.ajustesBolsa) state.ajustesBolsa=[];
  // Marcar migración pendiente la primera vez
  if(hubo && !state.__migracionPendiente){
    state.__migracionPendiente=true;
  }
  return hubo;
}

    if(!state.seq.banco) state.seq.banco=(state.bancos?.length||0)+1;
    if(!state.seq.movBanco) state.seq.movBanco=1;
    if(!state.seq.usuario) state.seq.usuario=state.usuarios.length+1;
    if(!state.seq.turno) state.seq.turno=state.turnos.length+1;
    if(!state.seq.ajusteBolsa) state.seq.ajusteBolsa=(state.ajustesBolsa?.length||0)+1;
    if(!state.cierres) state.cierres=[];
    if(!state.caja) state.caja={saldoInicial:0,movimientos:[]};
    if(!state.seq.mov) state.seq.mov=1;
    // Recuperar la identidad por nombre antes de asignar el administrador por defecto.
    // Así los registros históricos sin usuarioId conservan al cajero correcto.
    const resolverUsuarioHistorico = nombre => nombre
      ? state.usuarios.find(u=>normalizar(u.nombre)===normalizar(nombre))
      : null;
    state.caja.movimientos.forEach(m=>{
      if(!m.usuarioId){
        const encontrado=resolverUsuarioHistorico(m.usuarioNombre);
        m.usuarioId=encontrado?.id||'U1';
        m.usuarioNombre=encontrado?.nombre||m.usuarioNombre||'Administrador';
      }
    });
    state.ventas.forEach(v=>{
      if(!v.usuarioId){
        const encontrado=resolverUsuarioHistorico(v.usuarioNombre);
        v.usuarioId=encontrado?.id||'U1';
        v.usuarioNombre=encontrado?.nombre||v.usuarioNombre||'Administrador';

    });
    state.abonos.forEach(a=>{
      if(!a.usuarioId){

        a.usuarioNombre=encontrado?.nombre||a.usuarioNombre||'Administrador';

    });
    state.usuarios.forEach(u=>{ if(!['admin','cajero','cobrador'].includes(u.rol)) u.rol='cajero'; });

    // No usar public.usuarios para reemplazar el estado principal del negocio.
    state.bancos.forEach(b=>{ if(!b.movimientos) b.movimientos=[]; });

    migrarDatosViejos();

    // No asignar automáticamente U1 en una computadora nueva. La selección explícita
    // evita que las ventas del puesto de un cajero queden registradas por error al admin.
    window.__SIMGEST_SELECCION_INICIAL_REQUIRED = !usuarioLocalValido;
    usuarioActual = usuarioLocalValido
      ? userById(usuarioLocalId)
      : (state.usuarios.find(u=>u.rol==='admin' && u.activo!==false) || state.usuarios.find(u=>u.activo!==false) || state.usuarios[0]);
    if(!usuarioActual) throw new Error('No hay usuarios disponibles en el estado guardado.');
    state.usuarioActualId=usuarioActual.id;
    if(usuarioLocalValido) localStorage.setItem(claveUsuarioLocal, String(usuarioActual.id));
    // Repara movimientos de ventas existentes usando el usuario de la venta asociada.
    reconciliarMovimientosVentasCaja();
    $('avatarIni').textContent=iniciales(usuarioActual.nombre);

    $('rolLbl').textContent=usuarioActual.rol==='admin'?'Administrador':usuarioActual.rol==='cajero'?'Cajero':'Cobrador';

    // 🛡️ SANITY CHECK: nunca operar con state vacío si hay backup disponible
    if((state.ventas?.length || 0) === 0 && (state.caja?.movimientos?.length || 0) === 0){
      const tieneRescate = window.SIMGEST_ESTADO_RESCATE?.ventas?.length > 0;
      if(tieneRescate){
        const ok = confirm(
          '⚠️ ALERTA: el estado cargado está vacío (0 ventas, 0 movimientos).\n\n' +
          'Hay un backup interno con ' + window.SIMGEST_ESTADO_RESCATE.ventas.length + ' ventas.\n\n' +
          '¿Querés restaurar el backup? (Recomendado: SÍ)'
        );
        if(ok){
          const r = window.SIMGEST_ESTADO_RESCATE;
          state.ventas = r.ventas || [];
          state.caja = r.caja || state.caja;
          state.turnos = r.turnos || [];
          state.abonos = r.abonos || [];
          state.compras = r.compras || [];
          state.ajustesBolsa = r.ajustesBolsa || [];
          state.clientes = state.clientes?.length ? state.clientes : (r.clientes || []);
          state.productos = state.productos?.length ? state.productos : (r.productos || []);
          state.categorias = state.categorias?.length ? state.categorias : (r.categorias || []);
          state.proveedores = state.proveedores?.length ? state.proveedores : (r.proveedores || []);
          state.bancos = r.bancos || state.bancos;
          state.bolsas = r.bolsas || state.bolsas;
          state.capital = r.capital || state.capital;
          state.config = r.config || state.config;
          state.seq = r.seq || state.seq;
          if(typeof reconciliarMovimientosVentasCaja === 'function') reconciliarMovimientosVentasCaja();
          console.warn('[SIMGest] 🛡️ Estado restaurado automáticamente desde backup interno.');
        } else {
          console.warn('[SIMGest] 🛡️ Usuario decidió NO restaurar. Cualquier operación sobrescribirá el cloud.');
        }
      }
    }

    save(); render();
    try {
      const conteoVentas={};
      (state.usuarios||[]).forEach(u=>{conteoVentas[u.id]={usuario:u.nombre,ventas:(state.ventas||[]).filter(v=>String(v.usuarioId)===String(u.id)).length};});
      console.info('[SIMGest] Ventas asignadas por perfil:',conteoVentas);
    } catch(err) { console.warn('[SIMGest] No se pudo calcular el diagnóstico de usuarios.',err); }
    if(window.__SIMGEST_SELECCION_INICIAL_REQUIRED) setTimeout(solicitarUsuarioDeEquipo,120);
    if(window.__SIMGEST_USO_RESCATE){
      setTimeout(()=>toast('Se recuperaron los usuarios desde una copia guardada. Revisa usuarios y movimientos.','ok'),700);
      window.__SIMGEST_USO_RESCATE=false;
    }

    if(state.__migracionPendiente) setTimeout(mostrarCartelMigracion, 300);
  }catch(e){
    console.error(e);
    document.getElementById('app').innerHTML=`
      <div class="card" style="max-width:640px;margin:40px auto">
        <div class="card-title" style="color:var(--danger);font-size:16px">Error al iniciar</div>
        <p style="margin-top:10px;color:var(--muted)">${esc(e.message||String(e))}</p>
        <button class="btn btn-primary" style="margin-top:16px" onclick="localStorage.clear(); location.reload();">Restablecer y recargar</button>
      </div>`;
  }
};



/* ================================================================
   MIGRACIÓN: JSONB → TABLAS NORMALIZADAS (permanente en la app)
   Idempotente. Se puede correr muchas veces sin duplicar.
   ================================================================ */

function asignarTurno(usuarioId, fecha, hora, turnoIdExplicito){
  if(turnoIdExplicito) return turnoIdExplicito;
  if(!usuarioId || !fecha) return null;
  const ts = fecha + 'T' + (hora || '00:00') + ':00';
  const cands = state.turnos.filter(t => {
    if(String(t.usuarioId) !== String(usuarioId)) return false;
    const ini = t.fechaApertura + 'T' + (t.horaApertura || '00:00') + ':00';
    const fin = t.fechaCierre
      ? t.fechaCierre + 'T' + (t.horaCierre || '23:59') + ':59'
      : '9999-12-31T23:59:59';
    return ts >= ini && ts <= fin;
  });
  if(!cands.length) return null;
  cands.sort((a,b) =>
    ((b.fechaApertura||'')+(b.horaApertura||'')).localeCompare(
      (a.fechaApertura||'')+(a.horaApertura||'')
    )
  );
  return cands[0].id;
}

function turnoDeVenta(v){
  const m = state.caja.movimientos.find(x =>
    x.tipo === 'venta' && String(x.referencia||'') === String(v.id)
  );
  return asignarTurno(v.usuarioId, v.fecha, v.hora, m?.turnoId);
}

async function findOrInsert(tabla, campoCodigo, codigo, datos, cache){
  if(cache && cache[codigo]) return cache[codigo];
  const { data: exist, error: errF } = await sb.from(tabla).select('id')
    .eq('negocio_id', sbNegocioId).eq(campoCodigo, codigo).maybeSingle();
  if(errF) throw new Error(`${tabla} (find ${codigo}): ${errF.message}`);
  if(exist){ if(cache) cache[codigo] = exist.id; return exist.id; }
  const { data, error } = await sb.from(tabla)
    .insert({ negocio_id: sbNegocioId, [campoCodigo]: codigo, ...datos })
    .select().single();
  if(error) throw new Error(`${tabla} (insert ${codigo}): ${error.message}`);
  if(cache) cache[codigo] = data.id;
  return data.id;
}

async function insertBatch(tabla, rows){
  for(let i = 0; i < rows.length; i += 200){
    const chunk = rows.slice(i, i+200);
    const { error } = await sb.from(tabla).insert(chunk);
    if(error) throw new Error(`${tabla} (batch ${i}): ${error.message}`);
  }
}

async function cargarExistentes(tabla, columna){
  const { data, error } = await sb.from(tabla).select(columna)
    .eq('negocio_id', sbNegocioId);
  if(error) throw new Error(`${tabla} (cargar existentes): ${error.message}`);
  return new Set((data||[]).map(r => r[columna]));
}

        if((i+1) % 25 === 0) console.log(`  ... ${i+1}/${state.ventas.length} ventas`);
      }
      console.log(`  ✅ Ventas: ${stats.ventas} nuevas, ${stats.venta_items} items`);
    } catch(e){ errores.push({bloque:'ventas', msg:e.message}); stats.errores++; }

    // 11. ABONOS
    bar(72, 'Abonos...');
    try {
      const exist = await cargarExistentes('abonos','codigo');
            const rows = (state.abonos||[]).filter(a => !exist.has(a.id)).map(a => {
        const turnoCod = asignarTurno(a.usuarioId, a.fecha, a.hora, a.turnoId);
        return {
          negocio_id: sbNegocioId, codigo: a.id,
          cliente_id: a.clienteId ? map.clientes[a.clienteId] : null,
          venta_id: a.ventaId ? map.ventas[a.ventaId] : null,
          fecha: a.fecha, hora: a.hora || '00:00',
          monto: a.monto, entregado: a.entregado ?? a.monto, vuelta: a.vuelta || 0,
          metodo_pago: a.metodoPago || 'efectivo',
          usuario_id: a.usuarioId ? map.usuarios[a.usuarioId] : null,
          usuario_nombre: a.usuarioNombre || null,
          turno_id: turnoCod ? map.turnos[turnoCod] : null
        };
      });
      if(rows.length) await insertBatch('abonos', rows);
      stats.abonos = rows.length;
      console.log(`  ✅ Abonos: ${stats.abonos} nuevos`);
    } catch(e){ errores.push({bloque:'abonos', msg:e.message}); stats.errores++; }

    // 12. COMPRAS + ITEMS
    bar(78, 'Compras...');
    try {
      const { data: cDB, error: eCDB } = await sb.from('compras').select('id, codigo').eq('negocio_id', sbNegocioId);
      if(eCDB) throw eCDB;
      (cDB||[]).forEach(c => { map.compras[c.codigo] = c.id; });
      const cExist = new Set(Object.keys(map.compras));

      for(const c of state.compras){
        if(cExist.has(c.id)) continue;
        const turnoCod = asignarTurno(c.usuarioId, c.fecha, c.hora, c.turnoId);
        const { data: cRow, error: eC } = await sb.from('compras').insert({
          negocio_id: sbNegocioId, codigo: c.id,
          fecha: c.fecha, hora: c.hora || '00:00',
          proveedor_id: c.proveedorId ? map.proveedores[c.proveedorId] : null,
          proveedor_nombre: c.proveedorNombre || 'Sin proveedor',
          total: c.total, nota: c.nota || null,
          usuario_id: c.usuarioId ? map.usuarios[c.usuarioId] : null,
          usuario_nombre: c.usuarioNombre || null,
          turno_id: turnoCod ? map.turnos[turnoCod] : null
        }).select().single();
        if(eC) throw new Error(`compra ${c.id}: ${eC.message}`);
        map.compras[c.id] = cRow.id;
        stats.compras++;

        const items = (c.items||[]).map(it => ({
          negocio_id: sbNegocioId, compra_id: cRow.id,
          producto_id: it.productoId ? map.productos[it.productoId] : null,
          nombre: it.nombre, unidad: it.unidad || null,
          cantidad: it.cantidad, costo_unit: it.costoUnit, subtotal: it.subtotal
        }));
        if(items.length){ await insertBatch('compra_items', items); stats.compra_items += items.length; }
      }
      console.log(`  ✅ Compras: ${stats.compras} nuevas, ${stats.compra_items} items`);
    } catch(e){ errores.push({bloque:'compras', msg:e.message}); stats.errores++; }

    // 13. GASTOS
    bar(84, 'Gastos...');
    try {
      const exist = await cargarExistentes('gastos','codigo');
      const rows = (state.gastos||[]).filter(g => !exist.has(g.id)).map(g => {
        const turnoCod = asignarTurno(g.usuarioId, g.fecha, g.hora, g.turnoId);
        return {
          negocio_id: sbNegocioId, codigo: g.id,
          fecha: g.fecha, hora: g.hora || '00:00',
          categoria: g.categoria, monto: g.monto,
          descripcion: g.descripcion || null,
          usuario_id: g.usuarioId ? map.usuarios[g.usuarioId] : null,
          usuario_nombre: g.usuarioNombre || null,
          turno_id: turnoCod ? map.turnos[turnoCod] : null
        };
      });
      if(rows.length) await insertBatch('gastos', rows);
      stats.gastos = rows.length;
      console.log(`  ✅ Gastos: ${stats.gastos} nuevos`);
    } catch(e){ errores.push({bloque:'gastos', msg:e.message}); stats.errores++; }

    // 14. AJUSTES_BOLSA
    bar(88, 'Ajustes de bolsa...');
    try {
      const exist = await cargarExistentes('ajustes_bolsa','codigo');
      const rows = (state.ajustesBolsa||[]).filter(a => !exist.has(a.id)).map(a => {
        const turnoCod = asignarTurno(a.usuarioId, a.fecha, a.hora, a.turnoId);
        return {
          negocio_id: sbNegocioId, codigo: a.id,
          fecha: a.fecha, hora: a.hora || '00:00',
          proveedor_id: a.provId ? map.proveedores[a.provId] : null,
          tipo: a.tipo, delta: a.delta,
          motivo_tipo: a.motivoTipo, motivo: a.motivo || null,
          saldo_antes: a.saldoAntes || 0, saldo_despues: a.saldoDespues || 0,
          usuario_id: a.usuarioId ? map.usuarios[a.usuarioId] : null,
          usuario_nombre: a.usuarioNombre || null,
          turno_id: turnoCod ? map.turnos[turnoCod] : null
        };
      });
      if(rows.length) await insertBatch('ajustes_bolsa', rows);
      stats.ajustes = rows.length;
      console.log(`  ✅ Ajustes: ${stats.ajustes} nuevos`);
    } catch(e){ errores.push({bloque:'ajustes_bolsa', msg:e.message}); stats.errores++; }

    // 15. DEUDAS INICIALES
    bar(93, 'Deudas iniciales...');
    try {
      const { data: diDB } = await sb.from('capital_deudas_iniciales').select('cliente_id').eq('negocio_id', sbNegocioId);
      const diExist = new Set((diDB||[]).map(d => d.cliente_id));
      const rows = Object.entries(state.capital?.deudasInicialesPorCliente || {})
        .filter(([cod, monto]) => monto > 0 && map.clientes[cod] && !diExist.has(map.clientes[cod]))
        .map(([cod, monto]) => ({
          negocio_id: sbNegocioId,
          cliente_id: map.clientes[cod],
          monto
        }));
      if(rows.length) await insertBatch('capital_deudas_iniciales', rows);
      stats.deudas_ini = rows.length;
      console.log(`  ✅ Deudas iniciales: ${stats.deudas_ini} nuevas`);
    } catch(e){ errores.push({bloque:'deudas_ini', msg:e.message}); stats.errores++; }

    // 16. BOLSAS INICIALES
    bar(96, 'Bolsas iniciales...');
    try {
      const { data: biDB } = await sb.from('capital_bolsas_iniciales').select('proveedor_id, tipo').eq('negocio_id', sbNegocioId);
      const biExist = new Set((biDB||[]).map(b => `${b.proveedor_id}:${b.tipo}`));
      const rows = Object.entries(state.capital?.bolsasIniciales || {})
        .map(([k, monto]) => {
          const [provCod, tipo] = k.split(':');
          const provId = map.proveedores[provCod];
          if(!provId || monto <= 0) return null;
          if(biExist.has(`${provId}:${tipo}`)) return null;
          return { negocio_id: sbNegocioId, proveedor_id: provId, tipo, monto };
        }).filter(Boolean);
      if(rows.length) await insertBatch('capital_bolsas_iniciales', rows);
      stats.bolsas_ini = rows.length;
      console.log(`  ✅ Bolsas iniciales: ${stats.bolsas_ini} nuevas`);
    } catch(e){ errores.push({bloque:'bolsas_ini', msg:e.message}); stats.errores++; }

    // 17. UPDATE BOLSAS
    bar(98, 'Actualizando saldos de bolsas...');
    try {
      for(const [k, b] of Object.entries(state.bolsas || {})){
        const [provCod, tipo] = k.split(':');
        const provId = map.proveedores[provCod];
        if(!provId) continue;
        await sb.from('bolsas')
          .update({ saldo: b.saldo || 0, bonificaciones: b.bonificaciones || 0 })
          .eq('negocio_id', sbNegocioId).eq('proveedor_id', provId).eq('tipo', tipo);
      }
      console.log('  ✅ Saldos de bolsas actualizados');
    } catch(e){ errores.push({bloque:'bolsas_update', msg:e.message}); stats.errores++; }

  } catch(e){
    errores.push({bloque:'GLOBAL', msg:e.message});
  }

  const ms = Math.round(performance.now() - T0);
  bar(100, `Completado en ${(ms/1000).toFixed(1)}s`);

  console.log('%c📊 RESUMEN', 'font-size:14px;font-weight:bold;color:#1c3d5a');
  console.table(stats);

  if(errores.length > 0){
    console.warn('%c⚠️ ERRORES:', 'color:#8b2b2b;font-weight:bold');
    console.table(errores);
    alert(
      '⚠️ Sync con errores.\n\n' +
      'Registros migrados: ' + (stats.ventas + stats.caja_mov + stats.clientes) + '\n' +
      'Errores: ' + errores.length + '\n\n' +
      'Revisá la consola. Es idempotente: podés corregir y volver a ejecutar.'
    );
  } else {
    alert(
      '✅ SYNC COMPLETO en ' + (ms/1000).toFixed(1) + 's\n\n' +
      'Usuarios: ' + stats.usuarios + '\n' +
      'Clientes: ' + stats.clientes + '\n' +
      'Turnos: ' + stats.turnos + '\n' +
      'Movs caja: ' + stats.caja_mov + '\n' +
      'Ventas: ' + stats.ventas + ' (+ ' + stats.venta_items + ' items)\n' +
      'Compras: ' + stats.compras + '\n' +
      'Ajustes bolsa: ' + stats.ajustes
    );
  }
};

/* ---------- VENTA: EDITAR ---------- */
function modalEditarVenta(id){
  const v = state.ventas.find(x=>x.id===id);
  if(!v) return '<div class="empty">Venta no encontrada</div>';
  if(mesCerrado(v.fecha)) return `<div class="modal"><div class="alert alert-warning"><div>El mes ${nombreMes(mesDe(v.fecha))} está cerrado. No se puede editar.</div></div>
    <div class="modal-actions"><button class="btn btn-outline" onclick="cerrarModal()">Cerrar</button></div></div>`;
  const clientes = state.clientes.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  return `
    <div class="modal-head">
      <div><div class="modal-title">Editar venta ${esc(v.id)}</div>
        <div class="card-subtitle">${fFecha(v.fecha)} · ${v.hora||''}</div></div>
      <button class="modal-close" onclick="cerrarModal()">×</button>
    </div>
    <div class="alert alert-warning"><div>
      <strong>Cambios impactan automáticamente:</strong> stock, saldo de bolsas, caja y deuda del cliente. La venta no cambia de fecha ni de número.
    </div></div>
    <div class="field"><label>Cliente</label>
      <select id="mev-cliente">
        <option value="">Consumidor final</option>
        ${clientes.map(c=>`<option value="${c.id}" ${v.clienteId===c.id?'selected':''}>${esc(c.nombre)}${c.comunidad?' · '+esc(c.comunidad):''}</option>`).join('')}
      </select>
    </div>
    <div class="grid-2">
      <div class="field"><label>Forma de pago</label>
        <select id="mev-tipo" onchange="toggleEditVentaPlazo()">
          <option value="contado" ${v.tipoPago==='contado'?'selected':''}>Contado</option>
          <option value="credito" ${v.tipoPago==='credito'?'selected':''}>Crédito</option>
        </select>
      </div>
      <div class="field"><label>Plazo (días)</label>
        <input id="mev-plazo" type="number" min="1" value="${v.plazo||15}" ${v.tipoPago==='contado'?'disabled':''}>
      </div>
    </div>
    <div class="field"><label>Items (${v.items.length})</label>
      <div style="border:1px solid var(--line);border-radius:10px;overflow:hidden">
        ${v.items.map((it,ix)=>`
          <div style="display:grid;grid-template-columns:minmax(0,1fr) 70px 90px 90px 28px;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line-soft)">
            <div style="min-width:0">
              <div style="font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(it.nombre)}</div>
              <div style="font-size:10.5px;color:var(--muted)">${it.esRecarga?'Recarga':'Físico'}</div>
            </div>
            <input type="number" step="0.01" min="0.01" value="${it.cantidad}" data-mev-cant="${ix}" oninput="recalcEdicionVentaUI('${v.id}')" style="text-align:right;font-size:12px;padding:5px 6px">
            <input type="number" step="0.01" min="0" value="${it.precioUnit}" data-mev-precio="${ix}" oninput="recalcEdicionVentaUI('${v.id}')" style="text-align:right;font-size:12px;padding:5px 6px">
            <div style="text-align:right;font-weight:600;font-size:12px" data-mev-subtotal="${ix}">${money(it.subtotal)}</div>
            <button type="button" class="btn-ghost" style="color:var(--danger);padding:2px 4px;font-size:14px" onclick="quitarItemEdicionVenta('${v.id}',${ix})" title="Quitar item">×</button>
          </div>`).join('')}
      </div>
    </div>
    <div style="background:var(--surface-soft);padding:14px;border-radius:10px;display:flex;justify-content:space-between;align-items:baseline;border:1px solid var(--line-soft)">
      <span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted)">Total nuevo</span>
      <span style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums" id="mev-total">${money(v.total)}</span>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarEdicionVenta('${v.id}')">Guardar cambios</button>
    </div>`;
}

function toggleEditVentaPlazo(){
  const tipo = $('mev-tipo')?.value;
  const inp = $('mev-plazo');
  if(inp) inp.disabled = tipo==='contado';
}

function recalcEdicionVentaUI(ventaId){
  const v = state.ventas.find(x=>x.id===ventaId); if(!v) return;
  let total = 0;
  v.items.forEach((it,ix)=>{
    const cant = num2(Number(document.querySelector(`[data-mev-cant="${ix}"]`)?.value)||0);
    const precio = num2(Number(document.querySelector(`[data-mev-precio="${ix}"]`)?.value)||0);
    const sub = num2(cant*precio);
    const subEl = document.querySelector(`[data-mev-subtotal="${ix}"]`);
    if(subEl) subEl.textContent = money(sub);
    total = num2(total+sub);
  });
  const totEl = $('mev-total');
  if(totEl) totEl.textContent = money(total);
}

function quitarItemEdicionVenta(ventaId, ix){
  ui.ventaEliminarItems = ui.ventaEliminarItems || {};
  ui.ventaEliminarItems[ventaId] = ui.ventaEliminarItems[ventaId] || new Set();
  ui.ventaEliminarItems[ventaId].add(ix);
  // Hide the row visually
  const el = document.querySelector(`[data-mev-cant="${ix}"]`)?.closest('div[style*="grid-template-columns"]');
  if(el){ el.style.opacity = '.35'; el.style.textDecoration = 'line-through'; el.style.pointerEvents = 'none'; }

function guardarEdicionVenta(id){
  const v = state.ventas.find(x=>x.id===id);
  if(!v) return toast('Venta no encontrada','err');
  if(mesCerrado(v.fecha)) return toast('Mes cerrado','err');
  if(!esAdmin()) return toast('Solo admin','err');

  const nuevoClienteId = $('mev-cliente').value || null;
  const nuevoTipo = $('mev-tipo').value;
  const nuevoPlazo = nuevoTipo==='credito' ? (Number($('mev-plazo').value)||15) : null;

  const eliminados = ui.ventaEliminarItems?.[id] || new Set();
  const itemsNuevos = [];
  v.items.forEach((it,ix)=>{
    if(eliminados.has(ix)) return;
    const cant = num2(Number(document.querySelector(`[data-mev-cant="${ix}"]`)?.value)||0);
    const precio = num2(Number(document.querySelector(`[data-mev-precio="${ix}"]`)?.value)||0);
    if(!(cant>0.001)) return;
    if(precio<0) return;
    itemsNuevos.push({...it, cantidad:cant, precioUnit:precio, subtotal:num2(cant*precio)});
  });
  if(itemsNuevos.length===0) return toast('La venta debe tener al menos un item','err');

  const nuevoTotal = num2(itemsNuevos.reduce((a,i)=>a+i.subtotal,0));
  if(nuevoTotal<=0.001) return toast('Total inválido','err');

  // 1) Revertir efecto de items viejos (stock + bolsa)
  v.items.forEach(it=>{
    const p = prodById(it.productoId);
    if(!p) return;
    if(esProductoRecarga(p)){
      const b = p.proveedorId ? bolsaDe(p.proveedorId, tipoBolsaDeProducto(p)) : null;
      if(b) b.saldo = num2((b.saldo||0) + it.subtotal);
    } else {
      p.stock = num2(p.stock + it.cantidad);
    }
  });

  // 2) Quitar movimiento de caja viejo (solo si era contado)
  eliminarMovimientosPorRef(id);

  // 3) Aplicar efecto de items nuevos (stock + bolsa)
  for(const it of itemsNuevos){
    const p = prodById(it.productoId);
    if(!p) continue;
    if(esProductoRecarga(p)){
      const tipo = it.tipoRecarga || tipoBolsaDeProducto(p);
      const b = p.proveedorId ? bolsaDe(p.proveedorId, tipo) : null;
      if(b) b.saldo = num2((b.saldo||0) - it.subtotal);
    } else {
      p.stock = num2(p.stock - it.cantidad);
    }
  }

  // 4) Actualizar datos de la venta
  const nuevoCliente = nuevoClienteId ? state.clientes.find(c=>c.id===nuevoClienteId) : null;
  v.clienteId = nuevoClienteId;
  v.clienteNombre = nuevoCliente ? nuevoCliente.nombre : 'Consumidor final';
  v.tipoPago = nuevoTipo;
  v.plazo = nuevoPlazo;
  v.vencimiento = nuevoTipo==='credito' ? addDias(v.fecha, nuevoPlazo) : null;
  v.items = itemsNuevos;
  v.total = nuevoTotal;

  // 5) Ajustar pagado/montoRecibido/cambio y caja según tipo
  if(nuevoTipo==='contado'){
    v.pagado = nuevoTotal;
    v.montoRecibido = nuevoTotal;
    v.cambio = 0;
    agregarMovimientoCaja('venta', nuevoTotal, `Venta ${id} · ${v.clienteNombre}`, id);
  } else {
    // Crédito: conservar lo ya pagado, tope al nuevo total
    v.pagado = num2(Math.min(Number(v.pagado)||0, nuevoTotal));
    v.montoRecibido = null;
    v.cambio = null;
  }

  // Limpiar estado de edición
  if(ui.ventaEliminarItems?.[id]) delete ui.ventaEliminarItems[id];

  toast('Venta actualizada','ok');
  cerrarModal();
  render();
}

      <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0"><span>Aplicado a deuda</span><b style="color:var(--success)">+ ${money(a.monto)}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0"><span>Vuelta</span><b>${a.vuelta>0.001?money(a.vuelta):'—'}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-top:1px solid var(--line);margin-top:6px;padding-top:8px"><span>Deuda vieja cobrada</span><b>${money(a.aplicadoCapital||0)}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0"><span>Ventas cobradas</span><b>${money(a.aplicadoVentas||0)}</b></div>
    </div>
    ${Array.isArray(a.ventasAplicadas)&&a.ventasAplicadas.length>0?`
      <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Ventas aplicadas</div>
      <div style="border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px">
        <table style="width:100%;margin:0">
          <thead style="background:var(--surface-soft)"><tr>
            <th style="text-align:left;padding:8px 12px;font-size:10.5px">Venta</th>
            <th style="text-align:left;padding:8px 12px;font-size:10.5px">Fecha</th>
            <th style="text-align:right;padding:8px 12px;font-size:10.5px">Aplicado</th>
          </tr></thead>
          <tbody>${a.ventasAplicadas.map(x=>{
            const v = state.ventas.find(y=>y.id===x.ventaId);
            return `<tr style="border-top:1px solid var(--line-soft)">
              <td style="padding:8px 12px">${esc(x.ventaId)}</td>
              <td style="padding:8px 12px">${fFecha(v?.fecha||'')}</td>
              <td style="padding:8px 12px;text-align:right;font-weight:600">${money(x.monto)}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
    `:''}
    ${a.anulado?`<div class="alert alert-danger"><div><b>Anulado</b> por ${esc(a.anuladoPorNombre||'—')} el ${fFecha(a.anuladoFecha)} ${a.anuladoHora||''}. La deuda fue restaurada.</div></div>`:''}
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="cerrarModal()">Cerrar</button>
      ${!a.anulado&&(esAdmin()||a.usuarioId===usuarioActual?.id)&&!mesCerrado(mesDe(a.fecha))?`<button class="btn btn-danger" onclick="cerrarModal(); setTimeout(()=>accionAnularCobro('${a.id}'),100)">Anular cobro</button>`:''}
    </div>`;
}

function abrirModalDetalleGasto(id){
  const g = state.gastos.find(x=>x.id===id); if(!g) return;
  ui.modal={tipo:'confirmar',data:{
    criticidad:'info',
    titulo:'Detalle de gasto '+g.id,
    mensaje:'',
    detalle:`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12.5px;margin-top:8px">
        <div><b>Fecha:</b> ${fFecha(g.fecha)} ${g.hora||''}</div>
        <div><b>Categoría:</b> ${esc(g.categoria)}</div>
        <div><b>Monto:</b> ${money(g.monto)}</div>
        <div><b>Registrado por:</b> ${esc(g.usuarioNombre||'—')}</div>
        <div style="grid-column:1/-1"><b>Descripción:</b> ${esc(g.descripcion||'—')}</div>
      </div>`,
    textoBoton:'Cerrar',
    textoCancelar:'Cerrar',
    onConfirm:cerrarModal,
  }};
  renderModal();
}

function abrirModalDetalleMovimientoCaja(id){
  const m = state.caja.movimientos.find(x=>x.id===id); if(!m) return;
  ui.modal={tipo:'confirmar',data:{
    criticidad:'info', titulo:'Detalle de movimiento '+m.id, mensaje:'',
    detalle:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12.5px;margin-top:8px">
      <div><b>Fecha:</b> ${fFecha(m.fecha)} ${m.hora||''}</div>
      <div><b>Tipo:</b> ${esc(m.tipo)}</div>
      <div><b>Monto:</b> ${money(m.monto)}</div>
      <div><b>Registrado por:</b> ${esc(m.usuarioNombre||'—')}</div>
      <div style="grid-column:1/-1"><b>Descripción:</b> ${esc(m.descripcion||'—')}</div>
      ${m.referencia?`<div style="grid-column:1/-1"><b>Referencia:</b> ${esc(m.referencia)}</div>`:''}
    </div>`,
    textoBoton:'Cerrar', textoCancelar:'Cerrar', onConfirm:cerrarModal,
  }};
  renderModal();
}
</script>
</body>
</html>
