<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIMGest · Sistema de Gestión</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
<style>
:root{--bg:#f5f4f1;--surface:#fff;--surface-soft:#fafaf7;--ink:#15140f;--ink-2:#3a3833;--muted:#7a766d;--line:#e8e6e0;--line-soft:#f1efea;--primary:#1c3d5a;--primary-hover:#152e45;--accent:#8a6d3b;--success:#2d6a4f;--success-soft:#eaf3ee;--warning:#9c6f1f;--warning-soft:#fbf3e2;--danger:#8b2b2b;--danger-soft:#f9ecec;--info:#1e5a8a;--info-soft:#eaf1f7;--r-lg:14px;--shadow-sm:0 1px 2px rgba(20,18,12,.04),0 1px 3px rgba(20,18,12,.03)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;min-height:100vh}
.sidebar{width:252px;background:var(--surface);border-right:1px solid var(--line);padding:24px 0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;overflow-y:auto}
.brand{padding:0 22px 22px;border-bottom:1px solid var(--line-soft);margin-bottom:14px}
.brand-mark{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand-logo{width:32px;height:32px;border-radius:9px;background:var(--primary);display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px}
.brand-name{font-size:15px;font-weight:600}
.brand-sub{font-size:11px;color:var(--muted)}
.nav{flex:1;padding:0 10px;display:flex;flex-direction:column;gap:1px}
.nav-label{font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;font-family:inherit}
.nav-item:hover{background:var(--surface-soft)}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item svg{width:15px;height:15px;stroke:var(--muted);stroke-width:1.6;fill:none;flex-shrink:0}
.nav-item.active svg{stroke:#fff}
.sidebar-footer{padding:14px 22px 0;border-top:1px solid var(--line-soft);margin:0 10px}
.user-box{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;background:var(--surface-soft);border:1px solid var(--line-soft)}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-box select{background:transparent;border:none;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;padding:0;font-family:inherit;outline:none;width:100%}
.user-role{font-size:10.5px;color:var(--muted);margin-top:1px}
.main{margin-left:252px;flex:1;padding:32px 40px 60px;max-width:1300px;width:calc(100% - 252px)}
.page-head{margin-bottom:24px}
.page-eyebrow{font-size:10.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.page-title{font-size:26px;font-weight:600;letter-spacing:-.5px;line-height:1.2}
.page-desc{font-size:13.5px;color:var(--muted);margin-top:6px;max-width:720px;line-height:1.55}
.info-banner{display:flex;gap:12px;padding:14px 16px;border-radius:11px;background:var(--info-soft);border:1px solid #d1e0ec;color:#183a56;font-size:12.5px;line-height:1.6;margin-bottom:20px}
.info-banner svg{width:18px;height:18px;flex-shrink:0;stroke:currentColor;stroke-width:2;fill:none;margin-top:1px}
.info-banner strong{color:#0e2b45}
.info-banner.warn{background:var(--warning-soft);border-color:#ecdcae;color:#6d4d13}
.info-banner.warn strong{color:#4a340b}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.card-title{font-size:14.5px;font-weight:600}
.card-subtitle{font-size:12.5px;color:var(--muted);margin-top:3px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-sm)}
.kpi-label{font-size:10.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.kpi-value{font-size:22px;font-weight:600;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.kpi-value.is-success{color:var(--success)}
.kpi-value.is-danger{color:var(--danger)}
.kpi-value.is-warning{color:var(--warning)}
.kpi-meta{font-size:11.5px;color:var(--muted);margin-top:4px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:500;color:var(--ink-2);margin-bottom:5px}
.hint{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.45}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit;color:var(--ink);background:var(--surface);outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(28,61,90,.10)}
input::placeholder{color:#b5b2ab}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%237a766d' stroke-width='1.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 11px center;padding-right:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:9px;border:1px solid transparent;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-outline{background:var(--surface);border-color:var(--line);color:var(--ink-2)}
.btn-outline:hover{border-color:#d5d2ca;background:var(--surface-soft)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--primary);padding:6px 10px;font-size:12.5px;border-radius:6px}
.btn-ghost:hover{background:var(--surface-soft)}
.btn-block{width:100%}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.table-wrap{overflow-x:auto;margin:0 -22px;padding:0 22px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);padding:0 10px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th:first-child{padding-left:0}
thead th:last-child{padding-right:0;text-align:right}
tbody td{padding:12px 10px;border-bottom:1px solid var(--line-soft);color:var(--ink-2);vertical-align:middle}
tbody td:first-child{padding-left:0;color:var(--ink)}
tbody td:last-child{padding-right:0;text-align:right}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.bold{font-weight:600;color:var(--ink)}
.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10.5px;font-weight:500;white-space:nowrap}
.badge-success{background:var(--success-soft);color:var(--success)}
.badge-warning{background:var(--warning-soft);color:var(--warning)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-info{background:var(--info-soft);color:var(--info)}
.badge-neutral{background:var(--line-soft);color:var(--muted)}
.badge-accent{background:#f3ecdc;color:var(--accent)}
.badge-cobrador{background:#e0f2ec;color:#0f5132}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:10px;font-size:12.5px;line-height:1.55;margin-bottom:14px;border:1px solid}
.alert-info{background:var(--info-soft);border-color:#d1e0ec;color:#183a56}
.alert-warning{background:var(--warning-soft);border-color:#ecdcae;color:#6d4d13}
.alert-danger{background:var(--danger-soft);border-color:#ecd1d1;color:#6a2020}
.alert-success{background:var(--success-soft);border-color:#c7e0cf;color:#22503c}
.alert-title{font-weight:600;margin-bottom:2px}
.cart-list{max-height:340px;overflow-y:auto;padding-right:4px;margin-right:-4px}
.cart-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.cart-line:last-child{border-bottom:none}
.cart-info{flex:1;min-width:0}
.cart-name{font-size:13px;font-weight:500}
.cart-meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.cart-qty{width:60px;padding:4px 6px;font-size:12.5px;text-align:center}
.cart-price{width:80px;padding:4px 6px;font-size:12.5px;text-align:right}
.cart-sub{width:80px;text-align:right;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.cart-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;margin-top:10px;border-top:1px solid var(--line)}
.cart-total-label{font-size:11.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.cart-total-value{font-size:22px;font-weight:600;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.prod-list{max-height:520px;overflow-y:auto;margin:0 -8px;padding:0 8px}
.prod-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 8px;border-radius:8px;cursor:pointer}
.prod-item:hover{background:var(--surface-soft)}
.prod-item.stock-0{opacity:.5;cursor:not-allowed}
.prod-name{font-size:13px;font-weight:500}
.prod-meta{font-size:11px;color:var(--muted);margin-top:2px}
.prod-price{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--primary)}
.prod-stock{font-size:11px;color:var(--muted);text-align:right;margin-top:2px}
.bolsa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.bolsa-card{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--surface-soft)}
.bolsa-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.bolsa-card-op{font-size:13px;font-weight:600}
.bolsa-card-com{font-size:11px;color:var(--muted);margin-top:2px}
.bolsa-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line)}
.bolsa-row:last-child{border-bottom:none}
.bolsa-row-label{font-size:11.5px;color:var(--muted);font-weight:500}
.bolsa-row-value{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.bolsa-row-value.saldo{color:var(--primary)}
.bolsa-row-value.comision{color:var(--success)}
.bolsa-row-value.retirada{color:var(--muted);font-size:13px}
.bolsa-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.balance-hero{background:linear-gradient(135deg,#0f2942,#1c3d5a);color:#fff;border-radius:var(--r-lg);padding:32px;margin-bottom:20px}
.balance-hero-title{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#a5c4ff;margin-bottom:8px}
.balance-hero-value{font-size:42px;font-weight:600;letter-spacing:-1.4px;font-variant-numeric:tabular-nums}
.balance-hero-sub{font-size:13px;color:#a5c4ff;margin-top:6px}
.balance-hero-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px;padding-top:22px;border-top:1px solid rgba(255,255,255,.15)}
.balance-hero-cell-label{font-size:10.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#a5c4ff;margin-bottom:6px}
.balance-hero-cell-value{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.balance-hero-cell-value.pos{color:#a8e0c2}
.balance-hero-cell-value.neg{color:#ffb3b3}
.caja-hero{background:linear-gradient(135deg,var(--primary),#0f2942);color:#fff;border-radius:var(--r-lg);padding:28px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.caja-hero-label{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#a5c4ff;margin-bottom:6px}
.caja-hero-value{font-size:36px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.caja-hero-sub{font-size:12px;color:#a5c4ff;margin-top:6px}
.gan-hero{background:linear-gradient(135deg,#1f4d3a,#0f2d20);color:#fff;border-radius:var(--r-lg);padding:28px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.gan-hero-label{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#a8e0c2;margin-bottom:6px}
.gan-hero-value{font-size:36px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.gan-hero-sub{font-size:12px;color:#a8e0c2;margin-top:6px}
.cob-hero{background:linear-gradient(135deg,#0f5132,#083d24);color:#fff;border-radius:var(--r-lg);padding:28px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.cob-hero-label{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#a8e0c2;margin-bottom:6px}
.cob-hero-value{font-size:36px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.cob-hero-sub{font-size:12px;color:#a8e0c2;margin-top:6px}
.gasto-hero{background:linear-gradient(135deg,#6a1f1f,#4a1414);color:#fff;border-radius:var(--r-lg);padding:28px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.gasto-hero-label{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#ffb3b3;margin-bottom:6px}
.gasto-hero-value{font-size:36px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.gasto-hero-sub{font-size:12px;color:#ffb3b3;margin-top:6px}
.pagar-hero{background:linear-gradient(135deg,#6a4a1f,#4a3414);color:#fff;border-radius:var(--r-lg);padding:28px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.pagar-hero-label{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#ffd9a5;margin-bottom:6px}
.pagar-hero-value{font-size:36px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.pagar-hero-sub{font-size:12px;color:#ffd9a5;margin-top:6px}
.turno-hero{background:linear-gradient(135deg,#3a2817,#1f1810);color:#fff;border-radius:var(--r-lg);padding:24px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.turno-hero.abierto{background:linear-gradient(135deg,#1f4d3a,#0f2d20)}
.turno-label{font-size:10.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:6px}
.turno-value{font-size:22px;font-weight:600}
.turno-sub{font-size:12px;color:rgba(255,255,255,.7);margin-top:4px}
.modal-overlay{position:fixed;inset:0;background:rgba(20,18,12,.5);display:grid;place-items:center;padding:20px;z-index:200;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:var(--r-lg);padding:26px;max-width:560px;width:100%;box-shadow:0 20px 60px -20px rgba(0,0,0,.4);max-height:90vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.modal-title{font-size:16px;font-weight:600}
.modal-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:0 4px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line-soft)}
.modal-alert{max-width:480px}
.alert-icon{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin-bottom:18px}
.alert-icon.critico{background:var(--danger-soft);color:var(--danger)}
.alert-icon.advertencia{background:var(--warning-soft);color:var(--warning)}
.alert-icon.info{background:var(--info-soft);color:var(--info)}
.alert-icon svg{width:28px;height:28px;stroke:currentColor;stroke-width:2;fill:none}
.irrevocable-badge{display:inline-flex;align-items:center;gap:6px;background:var(--danger-soft);color:var(--danger);padding:5px 12px;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:16px;border:1px solid #ecd1d1}
.irrevocable-badge svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.2;fill:none}
.alert-title-lg{font-size:18px;font-weight:600;margin-bottom:10px;color:var(--ink)}
.alert-body{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin-bottom:8px}
.alert-detail{background:var(--surface-soft);border-radius:10px;padding:14px;margin:14px 0;border:1px solid var(--line-soft);font-size:12.5px;line-height:1.55}
.alert-warning-box{background:var(--danger-soft);border:1px solid #ecd1d1;border-radius:10px;padding:12px 14px;margin:14px 0;font-size:12.5px;color:#6a2020;line-height:1.55;display:flex;gap:10px;align-items:flex-start}
.alert-warning-box svg{width:16px;height:16px;flex-shrink:0;margin-top:2px;stroke:currentColor;stroke-width:2;fill:none}
.empty{text-align:center;padding:32px 16px;color:var(--muted);font-size:13px;line-height:1.6}
.tag-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;background:var(--surface-soft);border:1px solid var(--line-soft);font-size:11px;color:var(--ink-2);font-weight:500}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--line-soft)}
.summary-row:last-child{border-bottom:none}
.summary-row.highlight{color:var(--ink);font-weight:600;font-size:14.5px;padding:14px 0;border-top:1px solid var(--line);border-bottom:none}
.summary-row .label{flex:1}
.summary-row .value{font-variant-numeric:tabular-nums;font-weight:500}
.summary-row .value.pos{color:var(--success)}
.summary-row .value.neg{color:var(--danger)}
.choice-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.choice{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:11px 12px;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s}
.choice:hover{border-color:#cdc9c0;background:var(--surface-soft)}
.choice.active{border-color:var(--primary);background:#f4f7fa;box-shadow:inset 0 0 0 1px var(--primary)}
.choice-title{font-size:12.5px;font-weight:500;color:var(--ink);display:block}
.choice-desc{font-size:11px;color:var(--muted);margin-top:2px;display:block}
.money-input-wrap{position:relative;margin-top:6px}
.money-input-wrap::before{content:"Bs";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:600;color:var(--muted);pointer-events:none}
.money-input-wrap input{padding-left:42px;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;height:52px}
.money-input-wrap.sm input{font-size:14px;height:38px;padding-left:34px}
.money-input-wrap.sm::before{font-size:12px;left:11px}
.money-input-wrap input.money-ok{border-color:var(--success);background:var(--success-soft)}
.money-input-wrap input.money-bad{border-color:var(--danger);background:var(--danger-soft)}
.cambio-box{background:var(--success-soft);border:1px solid #c7e0cf;border-radius:10px;padding:14px;margin-top:12px;display:flex;justify-content:space-between;align-items:baseline}

  <script>
/* ================================================================
   MÓDULO SUPABASE — Auth, Sync y Migración
   ================================================================ */

// ⚠️ COMPLETAR CON TUS CREDENCIALES
const SB_URL = 'https://ponqbocqiufcqxmfzgmg.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvbnFib2NxaXVmY3F4bWZ6Z21nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2OTMxNTIsImV4cCI6MjEwMjI2OTE1Mn0.DpWcnX_7H9RSRSz4dOxZx_eBrwchY_vgnxgz2DY3eig'; // anon key

let sb = null;
let sbUser = null;      // auth.user actual
let sbNegocioId = null; // negocio_id activo
let syncTimer = null;
let modoLocal = false;  // true si no hay Supabase configurado

/* ---------- INIT ---------- */
async function initSupabase(){
  if(!SB_URL || SB_URL.includes('TU-PROYECTO') || !SB_KEY || SB_KEY.includes('eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...')){
    // Sin credenciales → modo local, arrancar app directamente
    console.warn('[SIMGest] Supabase no configurado. Modo local.');
    modoLocal = true;
    document.getElementById('authScreen').style.display = 'none';
    window.arrancarApp();
    return;
  }
  sb = window.supabase.createClient(SB_URL, SB_KEY);

  // Escuchar cambios de sesión
  sb.auth.onAuthStateChange((event, session) => {
    if(event === 'SIGNED_OUT'){
      sbUser = null; sbNegocioId = null;
      mostrarLogin();
    }
  });

  // Ver si hay sesión activa
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    await onAuth(session.user);
  } else {
    mostrarLogin();
  }
}

/* ---------- UI ---------- */
function cambiarTabAuth(tab){
  document.getElementById('tabLogin').classList.toggle('active', tab==='login');
  document.getElementById('tabRegistro').classList.toggle('active', tab==='registro');
  document.getElementById('formLogin').style.display = tab==='login' ? 'block' : 'none';
  document.getElementById('formRegistro').style.display = tab==='registro' ? 'block' : 'none';
  ocultarAuthError();
}

function mostrarLogin(){
  document.getElementById('authScreen').style.display = 'grid';
  document.getElementById('formLogin').style.display = 'block';
  document.getElementById('formRegistro').style.display = 'none';
  document.getElementById('onboardingStep').style.display = 'none';
  document.getElementById('migracionStep').style.display = 'none';
    document.getElementById('btnLogoutTop').style.display = 'none';
  const btnSide = document.getElementById('btnLogoutSidebar');
  if(btnSide) btnSide.style.display = 'none';
  ocultarAuthError();
}
    
function ocultarLogin(){
  document.getElementById('authScreen').style.display = 'none';
}
function mostrarAuthError(msg){
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.style.display = 'block';
}
function ocultarAuthError(){
  document.getElementById('authError').style.display = 'none';
}
function setCargando(botonId, cargando, textoOriginal){
  const b = document.getElementById(botonId);
  if(!b) return;
  b.disabled = cargando;
  b.textContent = cargando ? 'Un momento...' : textoOriginal;
}

/* ---------- LOGIN / REGISTRO ---------- */
async function doLogin(){
  const email = document.getElementById('authEmailLogin').value.trim();
  const password = document.getElementById('authPasswordLogin').value;
  if(!email || !password) return mostrarAuthError('Completá email y contraseña.');
  setCargando('btnLogin', true, 'Entrar');
  ocultarAuthError();
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error) throw error;
    await onAuth(data.user);
  }catch(e){
    mostrarAuthError(traducirError(e.message));
  }finally{
    setCargando('btnLogin', false, 'Entrar');
  }
}
async function doRegistro(){
  const nombre = document.getElementById('authNombreReg').value.trim();
  const negocio = document.getElementById('authNegocioReg').value.trim();
  const email = document.getElementById('authEmailReg').value.trim();
  const password = document.getElementById('authPasswordReg').value;
  if(!nombre || !negocio || !email || !password) return mostrarAuthError('Completá todos los campos.');
  if(password.length < 6) return mostrarAuthError('La contraseña debe tener al menos 6 caracteres.');
  setCargando('btnRegistro', true, 'Crear cuenta');
  ocultarAuthError();
  try{
    const { data, error } = await sb.auth.signUp({ email, password });
    if(error) throw error;
    if(!data.user) throw new Error('No se pudo crear la cuenta.');

    // Crear negocio + usuario admin en la BD
    const { data: negocioRow, error: errN } = await sb.from('negocios').insert({
      nombre: negocio,
      config: { usarTurnos: true },
      capital: {
        configurado: false,
        efectivoInicial: 0,
        efectivoBancosInicial: 0,
        inventarioInicial: 0,
        cuentasPorCobrarIniciales: 0,
        notas: '',
        fechaConfiguracion: null
      }
    }).select().single();
    if(errN) throw errN;

    const { error: errU } = await sb.from('usuarios').insert({
      negocio_id: negocioRow.id,
      auth_user_id: data.user.id,
      codigo: 'U1',
      nombre: nombre,
      rol: 'admin',
      activo: true,
      color: '#1c3d5a'
    });
    if(errU) throw errU;

    // Crear fila de caja
    await sb.from('caja').insert({ negocio_id: negocioRow.id, saldo_inicial: 0 });

    // Categorías de gastos por defecto
    const catsGastos = ['Alquiler','Servicios (luz/agua/internet)','Transporte','Sueldos','Mantenimiento','Insumos de oficina','Impuestos','Otros'];
    await sb.from('categorias_gastos').insert(
      catsGastos.map(n => ({ negocio_id: negocioRow.id, nombre: n }))
    );

    await onAuth(data.user);
  }catch(e){
    mostrarAuthError(traducirError(e.message));
  }finally{
    setCargando('btnRegistro', false, 'Crear cuenta');
  }
}
async function doResetPassword(){
  const email = prompt('Ingresá tu email para enviarte el enlace de recuperación:');
  if(!email) return;
  const { error } = await sb.auth.resetPasswordForEmail(email);
  if(error) return alert('Error: ' + error.message);
  alert('Te mandamos un email con el enlace.');
}
async function cerrarSesionGlobal(){
  if(!sb) return;
  if(!confirm('¿Cerrar sesión?')) return;
  await sb.auth.signOut();
}

/* ---------- SINCRONIZACIÓN DE USUARIOS INTERNOS ---------- */
// Los cajeros/cobradores son perfiles internos del negocio: no necesitan
// una cuenta de Auth propia, pero sí una fila en public.usuarios.
async function sincronizarUsuarioRelacional(usuario){
  if(!sb || !sbNegocioId || !usuario || !usuario.id) return;
  const codigo = String(usuario.id);
  const payload = {
    negocio_id: sbNegocioId,
    codigo,
    nombre: usuario.nombre || codigo,
    rol: usuario.rol || 'cajero',
    activo: usuario.activo !== false,
    color: usuario.color || '#1c3d5a',
    creado: usuario.creado || HOY()
  };
  const { data: existente, error: errorBuscar } = await sb
    .from('usuarios').select('id')
    .eq('negocio_id', sbNegocioId).eq('codigo', codigo).maybeSingle();
  if(errorBuscar) throw errorBuscar;
  if(existente){

async function sincronizarUsuariosRelacionales(){
  if(!sb || !sbNegocioId || !state?.usuarios?.length) return;
  const errores = [];
  for(const usuario of state.usuarios){
    try { await sincronizarUsuarioRelacional(usuario); }
    catch(e){ errores.push(`${usuario.nombre||usuario.id}: ${e.message||e}`); }
  }
  if(errores.length){
    console.error('[SIMGest] No se pudieron sincronizar algunos usuarios:', errores);
    window.dispatchEvent(new CustomEvent('simgest-sync-error', {
      detail: { message: 'Usuarios internos: ' + errores.join(' | ') }
    }));
  }

/* ---------- POST-LOGIN ---------- */
    async function onAuth(user){
  sbUser = user;
  // Buscar usuario vinculado
  const { data: u, error } = await sb.from('usuarios')
    .select('*')
    .eq('auth_user_id', user.id)
    .maybeSingle();

  if(error){ mostrarLogin(); mostrarAuthError('Error al cargar usuario: ' + error.message); return; }

  if(!u){
    // Usuario sin negocio vinculado → onboarding
    document.getElementById('formLogin').style.display = 'none';
    document.getElementById('formRegistro').style.display = 'none';
    document.getElementById('onboardingStep').style.display = 'block';
    document.getElementById('authScreen').style.display = 'grid';
    return;
  }

  sbNegocioId = u.negocio_id;

  // Cargar TODO desde Supabase → localStorage
  try{
    await cargarStateDesdeSupabase();
    ocultarLogin();
    window.arrancarApp();
        // Botones de cerrar sesión
    const btn = document.getElementById('btnLogoutTop');
    if(btn) btn.style.display = 'inline-flex';
    const btnSide = document.getElementById('btnLogoutSidebar');
    if(btnSide) btnSide.style.display = 'inline';
  }catch(e){
    console.error(e);
    mostrarAuthError('Error al cargar datos: ' + e.message);
  }
}

async function onboardingMigrar(){
  if(!sbUser) return;
  const stateLocal = leerStateLocal();
  if(!stateLocal){
    alert('No encontramos datos locales en este navegador. Vas a empezar de cero.');
    return onboardingEmpezarCero();
  }
  const negocioNombre = prompt('Nombre del negocio (para identificar tus datos):', 'Mi negocio');
  if(!negocioNombre) return;
  document.getElementById('onboardingStep').style.display = 'none';
  document.getElementById('migracionStep').style.display = 'block';
  try{
    await migrarStateASupabase(stateLocal, sbUser, negocioNombre);
    alert('¡Datos migrados! Ahora vas a poder acceder desde cualquier dispositivo.');
    await onAuth(sbUser);
  }catch(e){
    console.error(e);
    document.getElementById('migracionStep').style.display = 'none';
    document.getElementById('onboardingStep').style.display = 'block';
    mostrarAuthError('Error al migrar: ' + e.message);
  }

function leerStateLocal(){
  try{
    const raw = localStorage.getItem('simgest_v18');
    if(raw) return JSON.parse(raw);
    // Buscar versiones anteriores
    for(const k of ['simgest_v17','simgest_v16','simgest_v15']){
      const r = localStorage.getItem(k);
      if(r) return JSON.parse(r);
    }
    return null;
  }catch(e){ return null; }
}

/* ---------- CARGA DE SUPABASE → LOCALSTORAGE ---------- */
function simgestParseJsonb(valor){
  if(typeof valor === 'string'){
    try { return JSON.parse(valor); } catch(_) { return null; }
  }
  return valor && typeof valor === 'object' ? valor : null;
}
function simgestEsEstadoCompleto(valor){
  const x = simgestParseJsonb(valor);
  return !!(x && !Array.isArray(x) && Array.isArray(x.usuarios) &&
    (Array.isArray(x.ventas) || Array.isArray(x.productos) ||
     (x.caja && Array.isArray(x.caja.movimientos))));
}
function simgestExtraerEstadoJsonb(fila){
  // Busca el estado completo recursivamente porque algunas exportaciones/versiones
  // guardan el JSONB dentro de estado.data, estado.state o un envoltorio adicional.
  const vistos = new Set();
  function buscar(valor, profundidad){
    const parsed = simgestParseJsonb(valor);
    if(!parsed || typeof parsed !== 'object' || profundidad > 7) return null;
    if(simgestEsEstadoCompleto(parsed)) return parsed;
    if(vistos.has(parsed)) return null;
    vistos.add(parsed);
    const preferidas = ['estado','__simgest_state','state','data','payload','value','config'];
    for(const k of preferidas){
      if(Object.prototype.hasOwnProperty.call(parsed,k)){
        const hallado = buscar(parsed[k], profundidad+1);
        if(hallado) return hallado;
      }
    }
    // Algunos clientes envuelven el JSONB con una o más claves no estandarizadas.
    for(const [k,v] of Object.entries(parsed)){
      if(preferidas.includes(k)) continue;
      if(v && typeof v === 'object'){
        const hallado = buscar(v, profundidad+1);
        if(hallado) return hallado;
      }
    }
    return null;
  }
  return buscar(fila,0);
}
function simgestFuenteValida(valor){
  const x=simgestParseJsonb(valor);
  return !!(x && !Array.isArray(x) && (Array.isArray(x.usuarios) || Array.isArray(x.ventas) || (x.caja && Array.isArray(x.caja.movimientos))));
}
function simgestConteoRegistros(x){
  if(!x || typeof x!=='object') return -1;
  return (x.ventas?.length||0)+(x.caja?.movimientos?.length||0)+(x.abonos?.length||0)+
    (x.compras?.length||0)+(x.clientes?.length||0)+(x.productos?.length||0)+(x.turnos?.length||0);
}
function simgestFusionarUsuarios(estado, fuentes=[]){
  if(!Array.isArray(estado.usuarios)) estado.usuarios=[];
  const porId=new Map();
  // Estado de Supabase tiene prioridad para los campos que ya existen.
  for(const u of estado.usuarios){ if(u && u.id!=null) porId.set(String(u.id), {...u}); }
  for(const fuente of fuentes){
    const x=simgestParseJsonb(fuente);
    if(!Array.isArray(x?.usuarios)) continue;
    for(const u of x.usuarios){
      if(!u || u.id==null) continue;
      const id=String(u.id);
      if(!porId.has(id)) porId.set(id,{...u});
      else {
        const actual=porId.get(id);
        // Rellenar solo datos ausentes; no pisar la versión vigente de Supabase.
        for(const [k,v] of Object.entries(u)) if((actual[k]===undefined || actual[k]===null || actual[k]==='') && v!==undefined && v!==null && v!=='') actual[k]=v;
      }
    }
  }
  estado.usuarios=Array.from(porId.values());
  if(!estado.seq) estado.seq={};
  const maxU=estado.usuarios.reduce((max,u)=>{const m=String(u.id||'').match(/^U(\d+)$/); return m?Math.max(max,Number(m[1])):max;},0);
  estado.seq.usuario=Math.max(Number(estado.seq.usuario)||1,maxU+1);
  return estado;
}

/* ---------- SYNC (localStorage → Supabase) ---------- */
window.syncToCloud = function(stateArg){
  if(modoLocal || !sb || !sbNegocioId || !stateArg) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try{
      await subirStateASupabase(stateArg);
      console.info('[sync] Estado guardado en Supabase.');
    }catch(e){
      console.error('[sync] Error al guardar en Supabase:', e);
      window.dispatchEvent(new CustomEvent('simgest-sync-error', {
        detail: { message: e?.message || String(e) }
      }));
    }
  }, 1200);
};

async function subirStateASupabase(s){
  if(!sb || !sbNegocioId || !s) return;

  // Fuente principal y única de la copia completa: negocios.estado (JSONB).
  // No guardar usuarioActualId, porque la sesión pertenece a cada dispositivo.
  // Nunca tocar public.usuarios para reconstruir el estado: los usuarios internos
  // U1/U2/U3/U5 y sus movimientos permanecen en este objeto JSONB.
  const estadoCompartido = JSON.parse(JSON.stringify(s));
  delete estadoCompartido.usuarioActualId;

  const { error } = await sb
    .from('negocios')
    .update({
      estado: estadoCompartido,
      capital: s.capital || {}
    })
    .eq('id', sbNegocioId);

  if(error) throw error;
}

/* ---------- ARRANCAR ---------- */
document.addEventListener('DOMContentLoaded', () => {
  initSupabase();
});

// Helper: traducir errores comunes de Supabase
function traducirError(msg){
  const m = String(msg||'').toLowerCase();
  if(m.includes('invalid login credentials')) return 'Email o contraseña incorrectos.';
  if(m.includes('email not confirmed')) return 'Verificá tu email antes de entrar.';
  if(m.includes('user already registered')) return 'Este email ya está registrado.';
  if(m.includes('password should be at least')) return 'La contraseña es muy corta.';
  if(m.includes('invalid email')) return 'El email no es válido.';
  if(m.includes('rate limit')) return 'Demasiados intentos. Esperá un momento.';
  return msg;
}

function bolsaKey(provId, tipo){ return `${provId}:${tipo}`; }
function bolsaDe(provId, tipo){
  const k = bolsaKey(provId, tipo);
  if(!state.bolsas[k]) state.bolsas[k] = { saldo:0, bonificaciones:0 };
  if(typeof state.bolsas[k].bonificaciones !== 'number') state.bolsas[k].bonificaciones = 0;
  return state.bolsas[k];
}
function saldoBolsa(provId, tipo){ return num2(bolsaDe(provId, tipo).saldo || 0); }
function saldoBolsasTotal(){
  return num2(Object.values(state.bolsas).reduce((a,b)=>a+(b.saldo||0),0));
}
function saldoBolsasPorTipo(tipo){
  return num2(Object.entries(state.bolsas)
    .filter(([k]) => k.endsWith(':'+tipo))
    .reduce((a,[,b]) => a+(b.saldo||0), 0));
}
function bonifBolsasTotal(){
  return num2(Object.values(state.bolsas).reduce((a,b)=>a+(b.bonificaciones||0),0));
}

  return num2(Object.entries(state.bolsas)

}

function deudaVencida(cid){
  const h=HOY();
  const vencidaVentas=num2(state.ventas.filter(v=>v.clienteId===cid&&v.tipoPago==='credito'&&saldoVenta(v)>0&&v.vencimiento&&v.vencimiento<h).reduce((a,v)=>a+saldoVenta(v),0));
  const fechaConf=state.capital?.fechaConfiguracion;
  const deudaIni=deudaInicialCliente(cid);
  let inicialVencida=0;
  if(deudaIni>0&&fechaConf&&fechaConf<addDias(h,-30)) inicialVencida=deudaIni;
  return num2(vencidaVentas+inicialVencida);
}
function ventasPendientesCliente(cid){

function ultimoTurno(){
  const cerrados=state.turnos.filter(t=>t.estado==='cerrado').sort((a,b)=>{const fa=(a.fechaCierre||'')+(a.horaCierre||'');const fb=(b.fechaCierre||'')+(b.horaCierre||'');return fb.localeCompare(fa);});
  return cerrados[0]||null;
}


function movimientosDelTurno(t){
  if(!t) return [];
  const tsIni = t.fechaApertura + 'T' + (t.horaApertura||'00:00') + ':00';
  const tsFin = t.fechaCierre
    ? t.fechaCierre + 'T' + (t.horaCierre||'23:59') + ':59'
    : '9999-12-31T23:59:59';

  // Delimitar el inicio del hueco: cierre del turno anterior del mismo usuario
  // (para no robarle movimientos huérfanos al turno anterior)
  let anteriorCierre = null;
  state.turnos.forEach(x=>{
    if(String(x.usuarioId)!==String(t.usuarioId)) return;
    if(x.id===t.id) return;
    if(!x.fechaCierre) return;
    const tsX = x.fechaCierre+'T'+(x.horaCierre||'23:59')+':59';
    if(tsX < tsIni && (!anteriorCierre || tsX > anteriorCierre)) anteriorCierre = tsX;
  });

  return state.caja.movimientos.filter(m=>{
    if(String(m.usuarioId)!==String(t.usuarioId)) return false;

    // Caso 1: turnoId explícito → manda ese turno
    if(m.turnoId){
      return String(m.turnoId)===String(t.id);
    }

    // Caso 2: huérfano → incluir si está dentro del rango del turno
    const ts = (m.fecha||'') + 'T' + (m.hora||'00:00') + ':00';
    if(ts < tsIni || ts > tsFin) return false;
    if(anteriorCierre && ts <= anteriorCierre) return false;
    return true;
  });
}
  
function saldoEsperadoApertura(){
  const u=ultimoTurno();
  if(u&&typeof u.saldoCierre==='number') return num2(u.saldoCierre);
  return saldoCaja();
}

// Repara de forma idempotente ventas de contado que no tengan movimiento de caja.
// También corrige el usuario del movimiento cuando la referencia identifica la venta.
function reconciliarMovimientosVentasCaja(){
  if(!state?.caja) return;
  if(!Array.isArray(state.caja.movimientos)) state.caja.movimientos=[];
  if(!Array.isArray(state.ventas)) return;

  // Solo repara movimientos asociados por referencia exacta. No usa includes() simple,
  // porque V13 podría coincidir accidentalmente con V130, V131, etc.
  for(const venta of state.ventas){
    if(venta.tipoPago!=='contado' || !(Number(venta.total)>0)) continue;

    let usuario = state.usuarios.find(u=>String(u.id)===String(venta.usuarioId));
    if(!usuario && venta.usuarioNombre){
      usuario = state.usuarios.find(u=>normalizar(u.nombre)===normalizar(venta.usuarioNombre));
      if(usuario) venta.usuarioId=usuario.id;
    }

    let movimiento = state.caja.movimientos.find(m=>
      m && String(m.referencia||'')===String(venta.id) && m.tipo==='venta'
    );
    if(!movimiento){
      movimiento = state.caja.movimientos.find(m=>m && m.tipo==='venta' && String(m.descripcion||'').trim().startsWith('Venta '+String(venta.id)+' '));
    }

    const nombreUsuario = usuario?.nombre || venta.usuarioNombre || '—';
    if(movimiento){
      movimiento.referencia = movimiento.referencia || venta.id;
      // El movimiento de caja debe heredar el dueño de la venta relacionada.
      if(venta.usuarioId){
        movimiento.usuarioId=venta.usuarioId;
        movimiento.usuarioNombre=nombreUsuario;
      }
      continue;
    }

    // Buscar el turno que corresponde por timestamp (usuario + fecha/hora de la venta)
    const tsVenta = (venta.fecha||HOY()) + 'T' + (venta.hora||'00:00') + ':00';
    const turnoCands = state.turnos.filter(t=>{
      if(String(t.usuarioId)!==String(venta.usuarioId)) return false;
      const ini = t.fechaApertura + 'T' + (t.horaApertura||'00:00') + ':00';
      const fin = t.fechaCierre
        ? t.fechaCierre + 'T' + (t.horaCierre||'23:59') + ':59'
        : '9999-12-31T23:59:59';
      return tsVenta >= ini && tsVenta <= fin;
    });
    turnoCands.sort((a,b)=>((b.fechaApertura||'')+(b.horaApertura||'')).localeCompare((a.fechaApertura||'')+(a.horaApertura||'')));

    state.caja.movimientos.push({
      id:'M'+(state.seq.mov++), fecha:venta.fecha||HOY(), hora:venta.hora||'00:00',
      tipo:'venta', monto:num2(venta.total),
      descripcion:'Venta '+venta.id+' · '+(venta.clienteNombre||'Consumidor final'),
      referencia:venta.id, usuarioId:venta.usuarioId||null, usuarioNombre:nombreUsuario,
      turnoId: turnoCands[0]?.id || null
    });
  }
}
function movimientosVisibles(){
  reconciliarMovimientosVentasCaja();
      // MIGRACIÓN: asignar turnoId a movimientos históricos sin él.
    // Evita que al cerrar turnos del mismo día se dupliquen movimientos.
    (function migrarTurnoIdMovimientos(){
      let asignados = 0;
      state.caja.movimientos.forEach(m=>{
        if(m.turnoId) return;
        if(!m.usuarioId || !m.fecha) return;
        const ts = m.fecha + 'T' + (m.hora||'00:00') + ':00';
        const cands = state.turnos.filter(t=>{
          if(String(t.usuarioId)!==String(m.usuarioId)) return false;
          const ini = t.fechaApertura + 'T' + (t.horaApertura||'00:00') + ':00';
          const fin = t.fechaCierre
            ? t.fechaCierre + 'T' + (t.horaCierre||'23:59') + ':59'
            : '9999-12-31T23:59:59';
          return ts >= ini && ts <= fin;
        });
        if(cands.length){
          cands.sort((a,b)=>((b.fechaApertura||'')+(b.horaApertura||'')).localeCompare((a.fechaApertura||'')+(a.horaApertura||'')));
          m.turnoId = cands[0].id;
          asignados++;
        }
      });
      if(asignados) console.info('[SIMGest] turnoId asignado a', asignados, 'movimientos históricos.');
    })();
  return esAdmin()?state.caja.movimientos:state.caja.movimientos.filter(m=>m.usuarioId===usuarioActual?.id);
}

  if(tipo==='nuevaCuentaPagar'||tipo==='pagarCuenta') setTimeout(()=>{const el=$('m-cuenta-monto'); if(el) el.focus();},50);
  if(tipo==='registrarBonificacion'||tipo==='ajustarSaldo') setTimeout(()=>{const el=$('m-bonif-monto'); if(el) el.focus();},50);

function recalcularCapitalTotal(){
  const ef=Number($('m-cap-efectivo')?.value)||0;
  const ba=Number($('m-cap-bancos')?.value)||0;
  const inv=valorInventarioCosto();
  let deudas=0;
  document.querySelectorAll('.m-cap-deuda').forEach(el=>{ deudas+=Number(el.value)||0; });
  let bolsas=0;
  document.querySelectorAll('.m-cap-bolsa').forEach(el=>{ bolsas+=Number(el.value)||0; });
  const tot=ef+ba+inv+deudas+bolsas;
  const elTot=$('capital-total'); if(elTot) elTot.textContent=money(tot);
  const elB=$('capital-total-bolsas'); if(elB) elB.textContent=money(bolsas);
}

function leerBolsasInputs(){
  const result={};
  document.querySelectorAll('.m-cap-bolsa').forEach(el=>{
    const monto=Number(el.value)||0;
    if(monto>0){
      const k=bolsaKey(el.dataset.prov, el.dataset.tipo);
      result[k]=num2(monto);
    }
  });
  return result;
}
function leerDeudasIniciales(){
  const result={};
  document.querySelectorAll('.m-cap-deuda').forEach(el=>{
    const monto=Number(el.value)||0;
    if(monto>0) result[el.dataset.cliente]=num2(monto);
  });
  return result;
}
function guardarCapitalInicial(){
  const ef=Number($('m-cap-efectivo').value)||0;
  const bancos=Number($('m-cap-bancos').value)||0;
  const inv=valorInventarioCosto();
  const bolsas=leerBolsasInputs();
  const deudas=leerDeudasIniciales();
  const notas=$('m-cap-notas').value.trim();

  state.capital.configurado=true;
  state.capital.efectivoInicial=num2(ef);
  state.capital.efectivoBancosInicial=num2(bancos);
  state.capital.inventarioInicial=num2(inv);
  state.capital.bolsasIniciales={...bolsas};
  state.capital.deudasInicialesPorCliente={...deudas};
  state.capital.cuentasPorCobrarIniciales=num2(Object.values(deudas).reduce((a,b)=>a+b,0));
  state.capital.notas=notas;
  state.capital.fechaConfiguracion=HOY();

  if(ef>0) state.caja.saldoInicial=num2(ef);
  if(bancos>0){
    const bp=state.bancos.find(b=>b.nombre==='Banco principal');
    if(bp) bp.saldoInicial=num2(bancos);
    else state.bancos.push({id:'B'+(state.seq.banco++),nombre:'Banco principal',nota:'Desde capital inicial',saldoInicial:num2(bancos),movimientos:[]});
  }
  Object.entries(bolsas).forEach(([k,monto])=>{
    const [provId,tipo]=k.split(':');
    const b=bolsaDe(provId,tipo); b.saldo=num2((b.saldo||0)+monto);
  });
  toast('Capital inicial configurado','ok');
  cerrarModal(); render();
}
function guardarEdicionCapital(){
  const ef=Number($('m-cap-efectivo').value)||0;
  const bancos=Number($('m-cap-bancos').value)||0;
  const inv=valorInventarioCosto();
  const bolsas=leerBolsasInputs();
  const deudas=leerDeudasIniciales();
  const notas=$('m-cap-notas').value.trim();

  if(ef>0){
    state.caja.saldoInicial=num2(state.caja.saldoInicial+ef);
    state.capital.efectivoInicial=num2((state.capital.efectivoInicial||0)+ef);
  }
  state.capital.inventarioInicial=num2(inv);
  state.capital.notas=notas;
  if(bancos>0){
    const bp=state.bancos.find(b=>b.nombre==='Banco principal');
    if(bp) bp.saldoInicial=num2(bp.saldoInicial+bancos);
    else state.bancos.push({id:'B'+(state.seq.banco++),nombre:'Banco principal',nota:'Desde capital inicial',saldoInicial:num2(bancos),movimientos:[]});
    state.capital.efectivoBancosInicial=num2((state.capital.efectivoBancosInicial||0)+bancos);
  }

  if(!state.capital.bolsasIniciales) state.capital.bolsasIniciales={};
  Object.entries(bolsas).forEach(([k,monto])=>{
    const [provId,tipo]=k.split(':');
    const b=bolsaDe(provId,tipo); b.saldo=num2((b.saldo||0)+monto);
    state.capital.bolsasIniciales[k]=num2((state.capital.bolsasIniciales[k]||0)+monto);
  });
  if(!state.capital.deudasInicialesPorCliente) state.capital.deudasInicialesPorCliente={};
  let agregado=0;
  Object.entries(deudas).forEach(([cliId,monto])=>{
    state.capital.deudasInicialesPorCliente[cliId]=num2((state.capital.deudasInicialesPorCliente[cliId]||0)+monto);
    agregado+=monto;
  });
  state.capital.cuentasPorCobrarIniciales=num2((state.capital.cuentasPorCobrarIniciales||0)+agregado);
  toast('Capital actualizado','ok');
  cerrarModal(); render();
}

  document.querySelectorAll('#m-u-colores .color-btn').forEach(b=>{

function leerVentasSeleccionadasAbono(clienteId){
  const pendientes=ventasPendientesCliente(clienteId);
  const seleccionadas=[];
  for(let i=0;i<pendientes.length;i++){
    const check=document.querySelector(`[data-abono-venta-check="${i}"]`);
    if(!check?.checked) continue;
    const input=document.querySelector(`[data-abono-venta-monto="${i}"]`);
    const v=pendientes[i];
    const monto=num2(Number(input?.value)||0);
    const saldo=num2(saldoVenta(v));
    if(!(monto>0.001)) return {error:`El importe de la venta ${v.id} debe ser mayor que cero.`};
    if(monto>saldo+0.001) return {error:`El importe supera el saldo pendiente de la venta ${v.id} (${money(saldo)}).`};
    seleccionadas.push({ventaId:v.id,monto});
  }
  return {seleccionadas,total:num2(seleccionadas.reduce((sum,x)=>sum+x.monto,0))};
}

function actualizarAbonoSeleccionPreview(clienteId,modo){
  const lectura=leerVentasSeleccionadasAbono(clienteId);
  const capEl=$('m-abono-capital')||$('m-abono-monto');
  const capitalSolicitado=modo==='capital'||modo==='dividir'?num2(Number(capEl?.value)||0):0;
  const ventasSolicitadas=lectura.error?0:lectura.total;
  const solicitado=num2(capitalSolicitado+ventasSolicitadas);
  const entregado=num2(Number($('m-abono-entregado')?.value)||0);
  const aplicadoEfectivo=num2(Math.min(solicitado,entregado));
  const totalEl=$('abono-ventas-seleccion-total');
  if(totalEl) totalEl.innerHTML=`Seleccionado: <b>${money(ventasSolicitadas)}</b> en ${lectura.error?'—':lectura.seleccionadas.length} venta(s)`;
  const resumen=$('abono-seleccion-resumen');
  if(resumen){
    if(lectura.error) resumen.innerHTML=`<span style="color:var(--danger)">${esc(lectura.error)}</span>`;
    else if(entregado>0 && entregado+0.001<solicitado) resumen.innerHTML=`Se aplicará <b>${money(aplicadoEfectivo)}</b> de los ${money(solicitado)} seleccionados. El resto seguirá pendiente.`;
    else resumen.innerHTML=`Aplicado: <b>${money(solicitado)}</b> · Entregado: <b>${money(entregado)}</b> · Vuelto: <b>${money(Math.max(0,entregado-solicitado))}</b>`;
  }
  const preview=$('abono-preview');
  if(preview){
    if(entregado>0 && entregado+0.001<solicitado){
      preview.innerHTML=`<div class="cambio-box exacto"><span class="cambio-label">Cobro parcial · se aplicará</span><span class="cambio-value">${money(aplicadoEfectivo)}</span><div style="font-size:12px;margin-top:4px">Quedará pendiente: ${money(solicitado-aplicadoEfectivo)}</div></div>`;
    }else if(entregado>solicitado+0.001){
      preview.innerHTML=`<div class="cambio-box"><span class="cambio-label">Vuelta a devolver</span><span class="cambio-value">${money(entregado-solicitado)}</span></div>`;
    }else if(solicitado>0 && entregado>0){
      preview.innerHTML=`<div class="cambio-box exacto"><span class="cambio-label">Pago exacto</span><span class="cambio-value">${money(solicitado)}</span></div>`;
    }else preview.innerHTML='';
  }
}
  
function actualizarAbonoPreview(deuda){
  const el=$('m-abono-monto'); if(!el) return;
  const monto=Number(el.value)||0;
  const preview=$('abono-preview');
  if(monto<=0){ preview.innerHTML=''; el.classList.remove('money-ok','money-bad'); return; }
  if(monto>=deuda-0.001){
    const vuelta=num2(monto-deuda);
    if(vuelta>0.001){
      preview.innerHTML=`<div class="cambio-box"><span class="cambio-label">Vuelta a devolver</span><span class="cambio-value">${money(vuelta)}</span></div>`;
    }else{
      preview.innerHTML=`<div class="cambio-box exacto"><span class="cambio-label">Pago exacto</span><span class="cambio-value">${money(deuda)}</span></div>`;
    }
    el.classList.add('money-ok'); el.classList.remove('money-bad');
  }else{
    preview.innerHTML=`<div class="cambio-box insuf"><span class="cambio-label">Queda debiendo</span><span class="cambio-value">${money(num2(deuda-monto))}</span></div>`;
    el.classList.remove('money-ok'); el.classList.add('money-bad');
  }
}

  function actualizarAbonoDividirPreview(maxCapital, maxVentas){
  const cap = Number($('m-abono-capital')?.value) || 0;
  const ven = Number($('m-abono-ventas')?.value) || 0;
  const ent = Number($('m-abono-entregado')?.value) || 0;
  const preview = $('abono-preview');
  if(!preview) return;

  if(cap > maxCapital + 0.001){
    preview.innerHTML = `<div class="cambio-box insuf"><span class="cambio-label">Excede deuda vieja</span><span class="cambio-value">${money(cap - maxCapital)}</span></div>`;
    return;
  }
  if(ven > maxVentas + 0.001){
    preview.innerHTML = `<div class="cambio-box insuf"><span class="cambio-label">Excede ventas</span><span class="cambio-value">${money(ven - maxVentas)}</span></div>`;
    return;
  }
  const aplicadoTotal = num2(cap + ven);
  if(ent < aplicadoTotal - 0.001){
    preview.innerHTML = `<div class="cambio-box insuf"><span class="cambio-label">Falta entregar</span><span class="cambio-value">${money(num2(aplicadoTotal - ent))}</span></div>`;
    return;
  }
  const vuelta = num2(ent - aplicadoTotal);
  if(vuelta > 0.001){
    preview.innerHTML = `<div class="cambio-box"><span class="cambio-label">Vuelta</span><span class="cambio-value">${money(vuelta)}</span></div>`;
  } else {
    preview.innerHTML = `<div class="cambio-box exacto"><span class="cambio-label">Pago exacto</span><span class="cambio-value">${money(aplicadoTotal)}</span></div>`;
  }
}

  function modalCantidadProducto(productoId){

    .filter(i=>i.productoId===productoId && !i.esRecarga)
    .reduce((a,i)=>a+i.cantidad,0);
  const disponible = num2(p.stock - enCarrito);

  if(disponible <= 0) return `
    <div class="modal-head"><div><div class="modal-title">${esc(p.nombre)}</div></div>
    <button class="modal-close" onclick="cerrarModal()">×</button></div>

    <div class="modal-actions"><button class="btn btn-outline" onclick="cerrarModal()">Cerrar</button></div>`;

  const rapidos = [1,5,10,20,50,100,300].filter(n=>n<=disponible);
  const yaExiste = enCarrito > 0;
  const hayMismoPrecio = ui.ventaCarrito.some(i =>
    i.productoId===productoId && !i.esRecarga &&
    Math.abs(i.precioUnit - p.precio) < 0.001
  );

  return `
    <div class="modal-head">
      <div><div class="modal-title">${esc(p.nombre)}</div>
        <div class="card-subtitle">Stock ${p.stock} ${unidadAbrev(p.unidad)}${yaExiste?` · En carrito: ${enCarrito}`:''}</div></div>
      <button class="modal-close" onclick="cerrarModal()">×</button>
    </div>
    ${rapidos.length>1?`
      <div class="field" style="margin-bottom:10px">
        <label>Cantidad rápida</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${rapidos.map(n=>`<button type="button" class="filter-tab"
            onclick="document.getElementById('m-cantidad-prod').value=${n}; previewCantidadProducto('${productoId}')">${n}</button>`).join('')}
        </div>
      </div>`:''}
    <div class="grid-2">
      <div class="field">
        <label>Cantidad *</label>
        <input id="m-cantidad-prod" type="number" step="0.01" min="0.01" max="${disponible}" value="1"
          oninput="previewCantidadProducto('${productoId}')"
          onkeydown="if(event.key==='Enter'){event.preventDefault(); confirmarCantidadProducto('${productoId}')}">
      </div>
      <div class="field">
        <label>Precio unitario (Bs) *</label>
        <div class="money-input-wrap sm">
          <input id="m-precio-prod" type="number" step="0.01" min="0" value="${p.precio}"
            oninput="previewCantidadProducto('${productoId}')">
        </div>
        <div class="hint">Precio de lista: <b>${money(p.precio)}</b></div>
      </div>
    </div>
    <div id="preview-cantidad-prod"
      style="background:var(--surface-soft);padding:14px;border-radius:10px;display:flex;justify-content:space-between;align-items:baseline;border:1px solid var(--line-soft)">
      <span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted)">Subtotal</span>
      <span style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums">${money(p.precio)}</span>
    </div>
    ${yaExiste ? `
      <div class="alert alert-info" style="margin-top:14px">
        <div><strong>Ya tenés ${enCarrito} de este producto.</strong>
        ${hayMismoPrecio
          ? 'Si el precio es el mismo se sumará al lote existente. Si cambiaste el precio, se creará un lote nuevo automáticamente.'
          : 'Con este precio se creará un <b>lote separado</b>.'}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 12px;background:var(--surface-soft);border-radius:9px;border:1px solid var(--line-soft)">
        <input type="checkbox" id="m-forzar-nueva-linea" style="width:auto">
        <label for="m-forzar-nueva-linea" style="font-size:12.5px;cursor:pointer;margin:0">Forzar lote separado aunque el precio sea igual</label>
      </div>
    ` : ''}
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-success" onclick="confirmarCantidadProducto('${productoId}')">Agregar al carrito</button>
    </div>`;
}

function previewCantidadProducto(productoId){
  const p = prodById(productoId); if(!p) return;
  const cantEl = $('m-cantidad-prod');
  const precEl = $('m-precio-prod');
  const prev = $('preview-cantidad-prod');
  if(!cantEl || !precEl || !prev) return;
  const cant = num2(Number(cantEl.value)||0);
  const precio = num2(Number(precEl.value)||0);
  const enCarrito = ui.ventaCarrito
    .filter(i=>i.productoId===productoId && !i.esRecarga)
    .reduce((a,i)=>a+i.cantidad,0);
  const disponible = num2(p.stock - enCarrito);
  const excede = cant > disponible + 0.001;
  prev.innerHTML = `
    <span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:${excede?'var(--danger)':'var(--muted)'}">${excede?'Excede stock':'Subtotal'}</span>
    <span style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:${excede?'var(--danger)':'inherit'}">${money(num2(cant*precio))}</span>`;
  cantEl.classList.toggle('money-bad', excede);
}

function confirmarCantidadProducto(productoId){
  const p = prodById(productoId); if(!p) return;
  const cant = num2(Number($('m-cantidad-prod')?.value)||0);
  const precio = num2(Number($('m-precio-prod')?.value)||0);
  const forzar = $('m-forzar-nueva-linea')?.checked === true;
  if(!(cant>0)) return toast('Cantidad inválida','err');
  if(precio<0) return toast('Precio inválido','err');
  const enCarrito = ui.ventaCarrito
    .filter(i=>i.productoId===productoId && !i.esRecarga)
    .reduce((a,i)=>a+i.cantidad,0);
  const disponible = num2(p.stock - enCarrito);
  if(cant > disponible + 0.001) return toast(`Stock insuficiente. Disponible: ${disponible}`,'err');
  cerrarModal();
  setTimeout(()=>agregarAlCarritoVenta(productoId, cant, precio, forzar), 50);
}

function guardarCategoria(id){
  const n=$('m-cat-nombre').value.trim();
  if(!n) return toast('Ingresa nombre','err');
  if(state.categorias.some(c=>normalizar(c.nombre)===normalizar(n)&&c.id!==id)) return toast('Ya existe','err');
  if(id){ catById(id).nombre=n; toast('Actualizada','ok'); }
  else{ state.categorias.push({id:'CA'+(state.seq.categoria++),nombre:n}); toast('Creada','ok'); }

function guardarProveedor(id){
  const inputNombre = $('m-prov-nombre');
  const inputNota   = $('m-prov-nota');
  if(!inputNombre) return toast('Formulario no disponible','err');
  const nombre = inputNombre.value.trim();
  const nota   = inputNota ? inputNota.value.trim() : '';
  if(!nombre) return toast('Ingresá un nombre','err');

  const duplicado = state.proveedores.some(x =>
    normalizar(x.nombre) === normalizar(nombre) && x.id !== id
  );
  if(duplicado) return toast('Ya existe otro operador con ese nombre','err');

  if(id){
    const p = provById(id);
    if(!p) return toast('Operador no encontrado','err');
    const anterior = p.nombre;
    p.nombre = nombre;
    p.nota   = nota;
    if(anterior !== nombre){
      toast(`"${anterior}" → "${nombre}" actualizado`,'ok');
    } else {
      toast('Cambios guardados','ok');
    }
  } else {
    const nuevo = {id:'PV'+(state.seq.proveedor++), nombre, nota};
    state.proveedores.push(nuevo);
    bolsaDe(nuevo.id,'paso');
    bolsaDe(nuevo.id,'paquete');
    toast(`Operador "${nombre}" creado`,'ok');
  }
  cerrarModal();
  render();
}

function accionEliminarCliente(id){
  const c=state.clientes.find(x=>x.id===id); if(!c) return;
  const ventasAsociadas = state.ventas.filter(v=>v.clienteId===id);
  const abonosAsociados = state.abonos.filter(a=>a.clienteId===id);
  const deudaIni = deudaInicialCliente(id);
  if(ventasAsociadas.length > 0) return toast(`No se puede: tiene ${ventasAsociadas.length} venta(s).`,'err');
  if(abonosAsociados.length > 0) return toast(`No se puede: tiene ${abonosAsociados.length} cobro(s).`,'err');
  pedirConfirmacion({
    criticidad:'critico', titulo:'Eliminar cliente',
    mensaje:`¿Eliminar permanentemente a <b>${esc(c.nombre)}</b>?`,
    detalle:`<div><strong>Comunidad:</strong> ${esc(c.comunidad||'—')}</div>${deudaIni>0?`<div style="color:var(--danger);margin-top:6px"><strong>Deuda vieja a borrar:</strong> ${money(deudaIni)}</div>`:''}`,
    advertencia: deudaIni>0?`Se va a perder la deuda vieja de ${money(deudaIni)}.`:'',
    textoBoton:'Sí, eliminar',
    onConfirm:()=>{
      if(state.capital?.deudasInicialesPorCliente?.[id]){
        const monto = num2(state.capital.deudasInicialesPorCliente[id]);
        delete state.capital.deudasInicialesPorCliente[id];
        state.capital.cuentasPorCobrarIniciales = num2(Math.max(0,(state.capital.cuentasPorCobrarIniciales||0) - monto));
      }
      state.clientes = state.clientes.filter(x=>x.id!==id);
      if(ui.ventaClienteId === id) ui.ventaClienteId = '';
      if(ui.clienteAbierto === id) ui.clienteAbierto = null;
      toast('Cliente eliminado','ok'); render();
    }
  });
}
function guardarUsuario(id){
  const n=$('m-u-nombre').value.trim();
  if(!n) return toast('Ingresa nombre','err');
  if(id){
    const u=userById(id); if(!u) return toast('Usuario no encontrado','err');
    u.nombre=n;
    if(u.rol!=='admin'&&$('m-u-activo')) u.activo=$('m-u-activo').value==='true';
    toast('Actualizado','ok'); cerrarModal();
    if(usuarioActual.id===id){ usuarioActual=u; $('avatarIni').textContent=iniciales(u.nombre); }
    renderUsuarioSelector(); render();
    if(sb && sbNegocioId) sincronizarUsuarioRelacional(u).catch(e=>{
      console.error('[SIMGest] Error sincronizando usuario:',e);
      toast('Usuario actualizado localmente, pero falló la sincronización: '+(e.message||e),'err');
    });
    return;
  }
  const rol=$('m-u-rol').value;
  const color=$('m-u-color').value||COLORES_CAJERO[0];
  if(rol==='cajero'&&state.usuarios.filter(u=>u.rol==='cajero').length>=MAX_CAJEROS) return toast(`Máx ${MAX_CAJEROS} cajeros`,'err');
  if(rol==='cobrador'&&state.usuarios.filter(u=>u.rol==='cobrador').length>=MAX_COBRADORES) return toast(`Máx ${MAX_COBRADORES} cobradores`,'err');
  const nuevo={id:'U'+(state.seq.usuario++),nombre:n,rol,color,activo:true,creado:HOY()};
  state.usuarios.push(nuevo);
  toast('Usuario creado','ok');
  cerrarModal(); renderUsuarioSelector(); render();
  if(sb && sbNegocioId) sincronizarUsuarioRelacional(nuevo).then(()=>{
    toast('Usuario guardado en Supabase','ok');
  }).catch(e=>{
    console.error('[SIMGest] Error guardando usuario en Supabase:',e);
    toast('Se creó localmente, pero Supabase rechazó el registro: '+(e.message||e),'err');
  });
}

function montoVentasAplicadoAbono(a){
  if(a?.aplicadoVentas!==undefined && a?.aplicadoVentas!==null) return num2(Math.max(0, Number(a.aplicadoVentas)||0));
  if(a?.aplicadoCapital!==undefined && a?.aplicadoCapital!==null) return num2(Math.max(0, (Number(a.monto)||0)-(Number(a.aplicadoCapital)||0)));
  if(a?.modoCobro==='capital') return 0;
  return num2(Math.max(0, Number(a?.monto)||0));
}

// Reconstruye qué ventas absorbió cada cobro antiguo que no guardaba el desglose por venta.
// Respeta el mismo orden FIFO usado por el registro de cobros: ventas más antiguas primero.
function reconstruirAsignacionesVentasAbono(abonoObjetivo){
  const ventas=state.ventas
    .filter(v=>v.clienteId===abonoObjetivo.clienteId && v.tipoPago==='credito')
    .slice().sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  const porId=new Map(ventas.map(v=>[v.id,v]));
  const pagadoSimulado=new Map(ventas.map(v=>[v.id,0]));
  const asignaciones=new Map();
  const cobros=state.abonos
    .filter(a=>a.clienteId===abonoObjetivo.clienteId && !a.anulado)
    .slice().sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'') || (a.hora||'').localeCompare(b.hora||''));

  function aplicarFIFO(monto, lista){
    let restante=num2(Math.max(0, monto));
    for(const v of ventas){
      if(restante<=0.001) break;
      const pagado=pagadoSimulado.get(v.id)||0;
      const disponible=Math.max(0,num2((Number(v.total)||0)-pagado));
      if(disponible<=0.001) continue;
      const apl=num2(Math.min(disponible,restante));
      if(apl<=0.001) continue;
      pagadoSimulado.set(v.id,num2(pagado+apl));
      lista.push({ventaId:v.id,monto:apl});
      restante=num2(restante-apl);
    }
    return restante;
  }

  for(const a of cobros){
    const montoVentas=montoVentasAplicadoAbono(a);
    const items=[];
    if(Array.isArray(a.ventasAplicadas)){
      for(const item of a.ventasAplicadas){
        const venta=porId.get(item?.ventaId);
        const importe=num2(Math.max(0,Number(item?.monto)||0));
        if(!venta || importe<=0.001) continue;
        pagadoSimulado.set(venta.id,num2((pagadoSimulado.get(venta.id)||0)+importe));
        items.push({ventaId:venta.id,monto:importe});
      }
      const guardado=num2(items.reduce((sum,x)=>sum+x.monto,0));
      if(montoVentas>guardado+0.001) aplicarFIFO(num2(montoVentas-guardado),items);
    }else if(a.ventaId && porId.has(a.ventaId)){
      let restante=montoVentas;
      const v=porId.get(a.ventaId);
      const pagado=pagadoSimulado.get(v.id)||0;
      const disponible=Math.max(0,num2((Number(v.total)||0)-pagado));
      const apl=num2(Math.min(disponible,restante));
      if(apl>0.001){
        pagadoSimulado.set(v.id,num2(pagado+apl));
        items.push({ventaId:v.id,monto:apl});
        restante=num2(restante-apl);
      }
      if(restante>0.001) aplicarFIFO(restante,items);
    }else{
      aplicarFIFO(montoVentas,items);
    }
    asignaciones.set(a.id,items);
  }
  return asignaciones.get(abonoObjetivo.id)||[];
}

function accionAnularCobro(id){
  const a=state.abonos.find(x=>x.id===id);
  if(!a) return toast('No se encontró el cobro.','err');
  if(a.anulado) return toast('Este cobro ya está anulado.','err');
  if(!esAdmin() && a.usuarioId!==usuarioActual?.id) return toast('Solo puedes anular tus propios cobros.','err');
  if(bloquearMesCerrado(a.fecha,'Anular cobro')) return;

  const cliente=state.clientes.find(c=>c.id===a.clienteId);
  const aplicadoCapital=num2(Math.max(0,a.aplicadoCapital!==undefined&&a.aplicadoCapital!==null?(Number(a.aplicadoCapital)||0):(a.modoCobro==='capital'?(Number(a.monto)||0):0)));
  const aplicadoVentas=montoVentasAplicadoAbono(a);
  let asignaciones=[];
  if(aplicadoVentas>0.001){
    asignaciones=Array.isArray(a.ventasAplicadas)
      ? a.ventasAplicadas.map(x=>({ventaId:x?.ventaId,monto:num2(Math.max(0,Number(x?.monto)||0))})).filter(x=>x.ventaId&&x.monto>0.001)
      : reconstruirAsignacionesVentasAbono(a);

    const totalAsignado=num2(asignaciones.reduce((sum,x)=>sum+x.monto,0));
    if(Math.abs(totalAsignado-aplicadoVentas)>0.02){
      return toast('No se pudo reconstruir la aplicación a ventas con seguridad. No se anuló el cobro.','err');
    }
    // Consolidar por venta y validar antes de modificar nada.
    const plan=new Map();
    asignaciones.forEach(x=>plan.set(x.ventaId,num2((plan.get(x.ventaId)||0)+x.monto)));
    for(const [ventaId,importe] of plan){
      const v=state.ventas.find(x=>x.id===ventaId && x.clienteId===a.clienteId && x.tipoPago==='credito');
      if(!v || (Number(v.pagado)||0)<importe-0.02){
        return toast(`No se anuló: el saldo pagado de una venta (${ventaId}) no alcanza para una reversión segura.`, 'err');
      }
    }
    asignaciones=Array.from(plan,([ventaId,monto])=>({ventaId,monto}));
  }

  const totalRevertido=num2(aplicadoCapital+aplicadoVentas);
  pedirConfirmacion({
    criticidad:'critico',
    titulo:'Anular cobro '+a.id,
    mensaje:`¿Anular el cobro de <b>${esc(cliente?.nombre||'cliente')}</b> por ${money(a.monto)}?`,
    detalle:`<div><strong>Se devuelve a deuda vieja:</strong> ${money(aplicadoCapital)}</div><div><strong>Se devuelve a ventas a crédito:</strong> ${money(aplicadoVentas)}</div><div><strong>Total de deuda a restaurar:</strong> ${money(totalRevertido)}</div><div style="margin-top:8px;color:var(--muted)">El movimiento de caja se compensará y el registro quedará marcado como anulado para conservar el historial.</div>`,
    advertencia:'Esta operación no se puede deshacer automáticamente. Para cobrar correctamente, registra un nuevo cobro después de la anulación.',
    textoBoton:'Sí, anular cobro',
    onConfirm:()=>{
      // Revertir el importe aplicado a cada venta, sin tocar el pago inicial de la venta.
      asignaciones.forEach(x=>{
        const v=state.ventas.find(y=>y.id===x.ventaId);
        if(v) v.pagado=num2(Math.max(0,(Number(v.pagado)||0)-x.monto));
      });

      // Devolver el capital cobrado a la deuda vieja del cliente.
      if(aplicadoCapital>0.001){
        if(!state.capital) state.capital={deudasInicialesPorCliente:{},cuentasPorCobrarIniciales:0};
        if(!state.capital.deudasInicialesPorCliente) state.capital.deudasInicialesPorCliente={};
        state.capital.deudasInicialesPorCliente[a.clienteId]=num2((Number(state.capital.deudasInicialesPorCliente[a.clienteId])||0)+aplicadoCapital);
        state.capital.cuentasPorCobrarIniciales=num2((Number(state.capital.cuentasPorCobrarIniciales)||0)+aplicadoCapital);
      }

      // No borrar el movimiento original: registrar una salida compensatoria conserva la auditoría y corrige la caja.
      agregarMovimientoCaja('anulacion_abono',-num2(a.monto),`Anulación de cobro ${a.id} · ${cliente?.nombre||''}`,a.id);
      a.anulado=true;
      a.anuladoFecha=HOY();
      a.anuladoHora=horaActual();
      a.anuladoPorId=usuarioActual?.id||null;
      a.anuladoPorNombre=usuarioActual?.nombre||'—';
      toast(`Cobro ${a.id} anulado · Deuda restaurada ${money(totalRevertido)}`,'ok');
      render();
    }
  });
}

function confirmarAbono(clienteId){
  const modo=ui.abonoModo || (deudaInicialCliente(clienteId)>0.001?'capital':'ventas');
  const deudaIni=deudaInicialCliente(clienteId);
  let aplicadoCapital=0, aplicadoVentas=0, entregado=0;
  let ventasAplicadas=[];

  if(modo==='capital'){
    aplicadoCapital=num2(Number($('m-abono-monto')?.value)||0);
    entregado=num2(Number($('m-abono-entregado')?.value)||0);
    if(!(aplicadoCapital>0)) return toast('Monto aplicado a capital inválido','err');
    if(aplicadoCapital>deudaIni+0.001) return toast(`Excede la deuda vieja (${money(deudaIni)})`,'err');
  }else if(modo==='ventas'||modo==='dividir'){
    const lectura=leerVentasSeleccionadasAbono(clienteId);
    if(lectura.error) return toast(lectura.error,'err');
    ventasAplicadas=lectura.seleccionadas.map(x=>({...x}));
    aplicadoVentas=lectura.total;
    entregado=num2(Number($('m-abono-entregado')?.value)||0);
    if(modo==='dividir'){
      aplicadoCapital=num2(Number($('m-abono-capital')?.value)||0);
      if(aplicadoCapital<0) return toast('Monto de capital inválido','err');
      if(aplicadoCapital>deudaIni+0.001) return toast(`Excede deuda vieja (${money(deudaIni)})`,'err');
    }
    if(aplicadoVentas<=0.001) return toast('Selecciona al menos una venta que el cliente está pagando.','err');
  }else{
    return toast('Selecciona deuda vieja, ventas específicas o ambas.','err');
  }

  if(!(entregado>0)) return toast('Ingresa el total que entrega el cliente','err');

  // Permitir pagos parciales: se aplica solo lo entregado y el resto permanece como deuda.
  // En modo combinado se cubre primero el monto de capital indicado y el remanente va a las ventas seleccionadas en el orden mostrado.
  let disponibleAplicacion=entregado;
  if(aplicadoCapital>0.001){
    aplicadoCapital=num2(Math.min(aplicadoCapital,disponibleAplicacion));
    disponibleAplicacion=num2(Math.max(0,disponibleAplicacion-aplicadoCapital));
  }
  const ventasAjustadas=[];
  for(const x of ventasAplicadas){
    if(disponibleAplicacion<=0.001) break;
    const montoAplicar=num2(Math.min(Number(x.monto)||0,disponibleAplicacion));
    if(montoAplicar>0.001) ventasAjustadas.push({ventaId:x.ventaId,monto:montoAplicar});
    disponibleAplicacion=num2(Math.max(0,disponibleAplicacion-montoAplicar));
  }
  ventasAplicadas=ventasAjustadas;
  aplicadoVentas=num2(ventasAplicadas.reduce((sum,x)=>sum+x.monto,0));
  const aplicadoTotal=num2(aplicadoCapital+aplicadoVentas);
  if(aplicadoTotal<=0.001) return toast('Debe aplicar al menos a una deuda','err');
  const vuelta=num2(Math.max(0,entregado-aplicadoTotal));

  // Validar todas las ventas seleccionadas antes de modificar cualquier saldo.
  for(const x of ventasAplicadas){
    const v=state.ventas.find(y=>y.id===x.ventaId && y.clienteId===clienteId && y.tipoPago==='credito');
    if(!v || x.monto>saldoVenta(v)+0.001) return toast(`La venta ${x.ventaId} ya no tiene ese saldo disponible. Actualiza la pantalla e inténtalo otra vez.`,'err');
  }
  ventasAplicadas.forEach(x=>{
    const v=state.ventas.find(y=>y.id===x.ventaId);
    if(v) v.pagado=num2((Number(v.pagado)||0)+x.monto);
  });

  if(aplicadoCapital>0.001){
    if(state.capital?.deudasInicialesPorCliente?.[clienteId]){
      const dIni=num2(state.capital.deudasInicialesPorCliente[clienteId]);
      if(aplicadoCapital>dIni+0.001){
        // Revertir la aplicación a ventas porque el capital cambió antes de confirmar.
        ventasAplicadas.forEach(x=>{const v=state.ventas.find(y=>y.id===x.ventaId);if(v)v.pagado=num2(Math.max(0,(Number(v.pagado)||0)-x.monto));});
        return toast('La deuda vieja cambió y ya no permite aplicar ese monto. Actualiza e inténtalo otra vez.','err');
      }
      state.capital.deudasInicialesPorCliente[clienteId]=num2(dIni-aplicadoCapital);
      state.capital.cuentasPorCobrarIniciales=num2(Math.max(0,(Number(state.capital.cuentasPorCobrarIniciales)||0)-aplicadoCapital));
    }else{
      ventasAplicadas.forEach(x=>{const v=state.ventas.find(y=>y.id===x.ventaId);if(v)v.pagado=num2(Math.max(0,(Number(v.pagado)||0)-x.monto));});
      return toast('No se encontró la deuda vieja para aplicar el monto. No se registró el cobro.','err');
    }
  }

  const abonoId='A'+(state.seq.abono++);
  const c=state.clientes.find(x=>x.id===clienteId);
  const metodoAbono = ui.abonoMetodo === 'transferencia' ? 'transferencia' : 'efectivo';
  const partes=[];
  if(aplicadoCapital>0.001) partes.push(`capital ${money(aplicadoCapital)}`);
  if(aplicadoVentas>0.001) partes.push(`ventas seleccionadas ${money(aplicadoVentas)}`);
  const descMov=`Cobro de ${c?.nombre||''} (${partes.join(' + ')}) · ${metodoAbono}`;
  state.abonos.push({
    id:abonoId,clienteId,ventaId:null,fecha:HOY(),hora:horaActual(),
    monto:aplicadoTotal,entregado:num2(entregado),vuelta,
    metodoPago: metodoAbono,
    aplicadoCapital:num2(aplicadoCapital),aplicadoVentas:num2(aplicadoVentas),
    ventasAplicadas:ventasAplicadas.map(x=>({ventaId:x.ventaId,monto:num2(x.monto)})),
    modoCobro:modo,anulado:false,
    usuarioId:usuarioActual?.id||null,usuarioNombre:usuarioActual?.nombre||'—'
  });
  agregarMovimientoCaja('abono',aplicadoTotal,descMov,abonoId,HOY(),metodoAbono);
  const detalleVentas=ventasAplicadas.map(x=>{
    const v=state.ventas.find(y=>y.id===x.ventaId);
    return `${v?.id||x.ventaId} (${fFecha(v?.fecha||'')}) ${money(x.monto)}`;
  });
  let msg=`Cobro ${money(aplicadoTotal)}`;
  if(detalleVentas.length) msg+=` · ${detalleVentas.join(', ')}`;
  if(vuelta>0.001) msg+=` · Vuelta ${money(vuelta)}`;
  toast(msg,'ok');
  ui.abonoModo=null;
  ui.abonoMetodo='efectivo';
  cerrarModal();
  render();
}

function accionEliminarProveedor(id){
  const p = provById(id);
  if(!p) return toast('Operador no encontrado','err');

  const nProd    = state.productos.filter(x=>x.proveedorId===id).length;
  const nCompras = state.compras.filter(x=>x.proveedorId===id).length;
  const nAjustes = (state.ajustesBolsa||[]).filter(a=>a.provId===id).length;
  const bPaso = bolsaDe(id,'paso');
  const bPaq  = bolsaDe(id,'paquete');
  const saldoTotal = num2((bPaso?.saldo||0) + (bPaq?.saldo||0));
  const tieneUso   = nProd > 0 || nCompras > 0 || nAjustes > 0;
  const tieneSaldo = saldoTotal > 0.001;

  let advertencia = '';
  if(tieneUso && tieneSaldo){
    advertencia = 'Tiene productos, compras o ajustes asociados Y saldo en bolsa. Los productos y compras se mantendrán (sin operador asignado), pero el saldo de bolsa se perderá.';
  } else if(tieneUso){
    advertencia = 'Tiene productos, compras o ajustes asociados. Los productos y compras se mantendrán, pero sin operador asignado.';
  } else if(tieneSaldo){
    advertencia = `El saldo de bolsa (${money(saldoTotal)}) se perderá al eliminar el operador.`;
  }

  pedirConfirmacion({
    criticidad: (tieneUso || tieneSaldo) ? 'critico' : 'advertencia',
    titulo: 'Eliminar operador',
    mensaje: `¿Eliminar al operador <b>${esc(p.nombre)}</b>?`,
    detalle: `
      <div><strong>Productos:</strong> ${nProd}</div>
      <div><strong>Compras:</strong> ${nCompras}</div>
      <div><strong>Ajustes:</strong> ${nAjustes}</div>
      <div><strong>Bolsa paso:</strong> ${money(bPaso?.saldo||0)}</div>
      <div><strong>Bolsa paquete:</strong> ${money(bPaq?.saldo||0)}</div>
    `,
    advertencia,
    textoBoton: 'Sí, eliminar operador',
    onConfirm: () => {
      // Desasociar (no borrar) los datos históricos
      state.productos.forEach(prod => {
        if(prod.proveedorId === id) prod.proveedorId = null;
      });
      state.compras.forEach(c => {
        if(c.proveedorId === id) c.proveedorId = null;
      });
      if(Array.isArray(state.ajustesBolsa)){
        state.ajustesBolsa.forEach(a => {
          if(a.provId === id) a.provId = null;
        });
      }
      // Eliminar operador y sus bolsas
      state.proveedores = state.proveedores.filter(x => x.id !== id);
      delete state.bolsas[bolsaKey(id,'paso')];
      delete state.bolsas[bolsaKey(id,'paquete')];
      toast(`Operador "${p.nombre}" eliminado`,'ok');
      render();
    }
  });
}

function turnoRequerido(){
  if(!esUsarTurnos()) return true;
  if(esAdmin()) return true;

}
  function agregarAlCarritoVenta(productoId, cantidad, precioUnit, forzarNuevaLinea){
  if(!turnoRequerido()) return toast('Primero abre tu turno','err');
  const p = prodById(productoId); if(!p) return;

  if(esProductoRecarga(p)){
    const tipo = tipoBolsaDeProducto(p);
    const monto = Number(cantidad)||0;
    if(!(monto>0)) return toast('Monto inválido','err');
    const b = p.proveedorId?bolsaDe(p.proveedorId,tipo):null;
    const disp = b?(b.saldo||0):0;
    const enCarrito = ui.ventaCarrito.filter(i=>i.productoId===productoId).reduce((a,i)=>a+i.subtotal,0);
    if(disp < enCarrito + monto) return toast(`Saldo insuficiente en bolsa (${money(disp)})`,'err');
    ui.ventaCarrito.push({
      productoId, nombre:p.nombre, unidad:'bolivianos',
      esRecarga:true, tipoRecarga:tipo,
      proveedorId:p.proveedorId||null,
      cantidad:1, precioUnit:num2(monto), costoUnit:num2(monto),
      subtotal:num2(monto)
    });
    render();
    return;
  }

  const cant = num2(Number(cantidad)||0);
  if(!(cant>0)) return toast('Cantidad inválida','err');
  if(p.stock < cant) return toast(`Stock insuficiente (${p.stock})`,'err');

  const enCarrito = ui.ventaCarrito
    .filter(i=>i.productoId===productoId && !i.esRecarga)
    .reduce((a,i)=>a+i.cantidad,0);
  if(p.stock < enCarrito + cant) return toast(`Ya tienes ${enCarrito} en carrito`,'err');

  const precio = num2(precioUnit ?? p.precio);
  if(precio < 0) return toast('Precio inválido','err');

  // Fusión SOLO si producto + precio + costo coinciden. Si el precio cambia, línea nueva automática.
  const existente = !forzarNuevaLinea
    ? ui.ventaCarrito.find(i =>
        i.productoId === productoId &&
        !i.esRecarga &&
        Math.abs(i.precioUnit - precio) < 0.001 &&
        Math.abs(i.costoUnit  - p.costo)  < 0.001
      )
    : null;

  if(existente){
    existente.cantidad = num2(existente.cantidad + cant);
    existente.subtotal = num2(existente.cantidad * existente.precioUnit);
  } else {
    ui.ventaCarrito.push({
      productoId, nombre:p.nombre, unidad:p.unidad,
      esRecarga:false, proveedorId:p.proveedorId||null,
      cantidad:cant, precioUnit:precio, costoUnit:num2(p.costo),
      subtotal:num2(cant * precio)
    });
  }
  render();
}
